/* ---------- model ---------- */
// Michaels equation on blood-water flow with in vivo KoA (0.75 x in vitro)
function clearance(Qb,Qd,KoA){
  var qb=Qb*0.86, koa=KoA*0.7, r=qb/Qd, z=koa/qb*(1-r);
  if(Math.abs(1-r)<1e-6) return qb*koa/(qb+koa);
  var e=Math.exp(z); return qb*(e-1)/(e-r);
}
function schedule(N){ // session start times (min from Monday 00:00), 08:00
  var days={2:[0,3],3:[0,2,4],4:[0,1,3,5],6:[0,1,2,3,4,5]}[N];
  return days.map(function(d){ return d*1440+480; });
}
function simulate(p){
  var K=clearance(p.Qb,p.Qd,p.KoA)/100, Kr=p.Kru/100; // dL/min
  var Vd=0.55*p.W*10, starts=schedule(p.N), wk=10080, dt=2;
  var gainPerMin=p.gain*10/1440; // dL/min of fluid gain
  // UF per session = gain over preceding interval
  var uf=starts.map(function(s,i){ var prev=starts[(i-1+starts.length)%starts.length]; var gap=(s-prev+wk)%wk; return gap*gainPerMin; });
  var V=Vd+uf[0], M=V*60, pts=[], rep=null, repIdx=Math.floor(starts.length/2);
  for(var w=0; w<4; w++){
    for(var m=0; m<wk; m+=dt){
      var on=-1; for(var i=0;i<starts.length;i++){ if(m>=starts[i] && m<starts[i]+p.t){ on=i; break; } }
      var Cc=M/V, Kt=Kr+(on>=0?K:0);
      M += (p.G - Kt*Cc)*dt;
      V += on>=0 ? -uf[on]/p.t*dt : gainPerMin*dt;
      if(w===3){
        if(m%20===0) pts.push([m, M/V]);
        if(on===repIdx && m===starts[repIdx]) rep={pre:Cc, V0:V};
        if(on===repIdx && m===starts[repIdx]+p.t-dt) { rep.post=M/V; rep.Vpost=V; }
      }
    }
  }
  return {pts:pts, rep:rep, K:K*100, starts:starts, uf:uf[repIdx]/10, ufw:uf.reduce(function(a,b){return a+b;},0)/10, Vpost:rep.Vpost/10};
}
function daugirdas(R,th,UF,W){ return -Math.log(R-0.008*th)+(4-3.5*R)*UF/W; }
function eKtV(sp,th){ return sp-0.6*sp/th+0.03; }
function stdKtV(e,t,N,ufw,V){
  var a=1-Math.exp(-e), S=(10080*a/t)/(a/e+10080/(N*t)-1);
  return S/(1-0.74/N*ufw/V);
}

  var sx=function(m){ return X0+(X1-X0)*m/10080; }, sy=function(c){ return Y0-(Y0-Y1)*c/maxC; };
  for(var c=0;c<=maxC;c+=20){ Sim.svg("line",{x1:X0,x2:X1,y1:sy(c),y2:sy(c),stroke:LINE},svg); txt(X0-8,sy(c)+4,String(c),{a:"end",mono:true,s:10.5}); }
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d,i){ txt(sx(i*1440+720),Y0+18,d,{s:11.5}); Sim.svg("line",{x1:sx(i*1440),x2:sx(i*1440),y1:Y1,y2:Y0,stroke:LINE,"stroke-dasharray":"2 4"},svg); });
  r.starts.forEach(function(s){ Sim.svg("rect",{x:sx(s),y:Y1,width:Math.max(2,sx(s+C.t.get())-sx(s)),height:Y0-Y1,fill:"#EFEDFF"},svg); });
  txt(X0,Y1-8,"BUN (mg/dL)",{a:"start",s:11});
  var d=r.pts.map(function(q,i){ return (i?"L":"M")+sx(q[0]).toFixed(1)+" "+sy(q[1]).toFixed(1); }).join(" ");
  Sim.svg("path",{d:d,fill:"none",stroke:INK,"stroke-width":2.2,"stroke-linejoin":"round"},svg);
  // continuous kidney-equivalent (TAC) line
  var tac=r.pts.reduce(function(a,q){return a+q[1];},0)/r.pts.length;
  Sim.svg("line",{x1:X0,x2:X1,y1:sy(tac),y2:sy(tac),stroke:ACC2,"stroke-width":1.5,"stroke-dasharray":"6 4"},svg);
  txt(X1,sy(tac)-6,"TAC "+tac.toFixed(0),{a:"end",mono:true,s:10.5,f:"#0e8aa0"});
  // report session markers
  var s0=r.starts[Math.floor(r.starts.length/2)], t=C.t.get();
  var ceqY=sy(meas.ceq);
  Sim.svg("path",{d:"M"+sx(s0+t)+" "+sy(r.rep.post)+" Q"+(sx(s0+t)+10)+" "+ceqY+" "+(sx(s0+t+60))+" "+ceqY,fill:"none",stroke:ACC,"stroke-width":1.6,"stroke-dasharray":"3 3"},svg);
  [[s0,r.rep.pre,"pre "+r.rep.pre.toFixed(0),INK],[s0+t+(late?15:0),meas.post,"post "+meas.post.toFixed(0),late?RED:ACC]].forEach(function(q,i){
    Sim.svg("circle",{cx:sx(q[0]),cy:sy(q[1]),r:5,fill:"#fff",stroke:q[3],"stroke-width":2.4},svg);
    txt(sx(q[0])+(i?10:-8),sy(q[1])+(i?16:-8),q[2],{a:i?"start":"end",mono:true,s:11.5,f:q[3],w:500});
  });
}

/* ---------- update ---------- */
function params(){ return {W:C.W.get(),t:C.t.get(),Qb:C.Qb.get(),Qd:C.Qd.get(),KoA:C.KoA.get(),N:parseInt(nSel.value,10),gain:C.gain.get(),Kru:C.Kru.get(),G:C.G.get()}; }
function update(){
  var p=params(), r=simulate(p), th=p.t/60, V=r.Vpost, W=p.W;
  // true values (prompt sample)
  var R=r.rep.post/r.rep.pre, sp=daugirdas(R,th,r.uf,W), e=eKtV(sp,th);
  var ceq=r.rep.post*Math.exp(sp-e);
  var post=late ? r.rep.post+(ceq-r.rep.post)*(1-Math.exp(-15/12)) : r.rep.post;
  var Rm=post/r.rep.pre, spm=daugirdas(Rm,th,r.uf,W), em=eKtV(spm,th);
  var stdD=stdKtV(em,p.t,p.N,r.ufw,V), ren=p.Kru*10080/(V*1000), std=stdD+ren, urr=(1-Rm)*100;
  draw(r,{post:post,ceq:ceq});
  var thrice=p.N===3;
  Sim.ro("roPre",Sim.fmt(r.rep.pre,0));
  Sim.ro("roPost",Sim.fmt(post,0),late?"flag":false);
  Sim.ro("roURR",Sim.fmt(urr,0),thrice?(urr<65?"flag":"ok"):false);
  Sim.ro("roSp",Sim.fmt(spm,2),thrice?(spm<1.2?"flag":(spm>=1.4?"ok":false)):false);
  Sim.ro("roE",Sim.fmt(em,2));
  Sim.ro("roStd",Sim.fmt(std,2),std<2.1?"flag":(std>=2.3?"ok":false));
  document.getElementById("kv").innerHTML="";
  [["K (Michaels, in vivo)",Sim.fmt(r.K,0)+" ml/min"],["V post (0.55 × W)",Sim.fmt(V,1)+" L"],["Model Kt/V = K × t / V",Sim.fmt(r.K*p.t/(V*1000),2)],["UF session กลางสัปดาห์",Sim.fmt(r.uf,1)+" L"],["stdKt/V จากเครื่อง",Sim.fmt(stdD,2)],["Renal Kt/V ต่อสัปดาห์",Sim.fmt(ren,2)],["เป้า (KDOQI 2015)",thrice?"spKt/V ≥ 1.2 เป้า 1.4":"ใช้ stdKt/V ≥ 2.1"]].forEach(function(x){
    document.getElementById("kv").appendChild(Sim.h("span",{text:x[0]})); document.getElementById("kv").appendChild(Sim.h("span",{text:x[1]}));
  });
  var L=document.getElementById("stepList"); L.innerHTML="";
  ["R = post/pre = "+post.toFixed(1)+"/"+r.rep.pre.toFixed(1)+" = "+Rm.toFixed(3),
   "spKt/V = −ln(R − 0.008 × t) + (4 − 3.5R) × UF/W = −ln("+Rm.toFixed(3)+" − 0.008 × "+th.toFixed(2)+") + (4 − 3.5 × "+Rm.toFixed(3)+") × "+r.uf.toFixed(1)+"/"+W+" = "+spm.toFixed(2),
   "eKt/V = spKt/V − 0.6 × spKt/V / t + 0.03 = "+em.toFixed(2),
   "stdKt/V (FHN) = [10080(1 − e^−eKt/V)/t] / [(1 − e^−eKt/V)/eKt/V + 10080/(N t) − 1] แล้วหารด้วย 1 − 0.74/N × UFweek/V = "+stdD.toFixed(2),
   "Renal = Kru × 10080 / V = "+p.Kru.toFixed(1)+" × 10080 / "+(V*1000).toFixed(0)+" = "+ren.toFixed(2)+" รวม "+std.toFixed(2)
  ].forEach(function(s){ L.appendChild(Sim.h("li",{},[Sim.h("code",{text:s})])); });
}

Sim.mount({code:"HD-04", title:"Urea Kinetics and Adequacy", lead:"ปรับเวลา Qb dialyzer ความถี่ และ RKF แล้วดู BUN sawtooth, URR, spKt/V, eKt/V และ stdKt/V",
  scenarios:S, order:ORDER,
  onChange:function(k,s){ var p=s.p; ["W","t","Qb","Qd","KoA","gain","Kru","G"].forEach(function(x){ C[x].set(p[x]); }); nSel.value=String(p.N); late=!!s.late; tLate.setAttribute("aria-pressed",late?"true":"false"); update(); },
  refs:["National Kidney Foundation. KDOQI Clinical Practice Guideline for Hemodialysis Adequacy: 2015 Update. Am J Kidney Dis 2015, 66(5): 884-930",
        "Daugirdas JT. Second generation logarithmic estimates of single-pool variable volume Kt/V: an analysis of error. J Am Soc Nephrol 1993, 4(5): 1205-1213",
        "Daugirdas JT, Depner TA, Greene T, et al. Standard Kt/V urea: a method of calculation that includes effects of fluid removal and residual kidney clearance. Kidney Int 2010, 77(7): 637-644",
        "Eknoyan G, Beck GJ, Cheung AK, et al. Effect of dialysis dose and membrane flux in maintenance hemodialysis (HEMO). N Engl J Med 2002, 347(25): 2010-2019",
        "Michaels AS. Operating parameters and performance criteria for hemodialyzers and other membrane-separation devices. Trans Am Soc Artif Intern Organs 1966, 12: 387-392"],
  note:"Single-pool variable-volume model, V = 0.55 × dry weight, K จาก Michaels equation (blood water 0.86, KoA in vivo 0.7) ค่าเพื่อการสอน"
});
