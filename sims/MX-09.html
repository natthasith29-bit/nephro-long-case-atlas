<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[MX-09] Urine Sediment Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../core/core.css">
<style>

.tools{margin-top:6px}

body.present .hint{display:none}
body.present .card{padding:12px 18px}
body.present .card h2{margin-bottom:6px}
body.present .svgwrap svg{max-height:470px}
body.present .tog{padding:3px 8px;font-size:11.5px}

</style>
</head>
<body>
<main class="sim" id="sim">
  <section class="bench">
    <div class="card">
      <h2>กล้องจุลทรรศน์ high power field</h2>
      <div class="svgwrap"><svg id="vis" viewBox="0 0 640 440" role="img" aria-label="Schematic urine sediment microscopy field"></svg></div>
      <p class="hint no-present">ภาพวาดเชิงสัญลักษณ์ (ไม่ใช่ภาพถ่ายจริง) ขนาดเทียบกับ scale bar 20 µm กดชื่อ element ด้านขวาเพื่อเพิ่มหรือเอาออกจาก field ปุ่ม polarized light แสดงผลึกและไขมันที่ birefringent (fat droplet เห็นเป็น Maltese cross)</p>
    </div>
    <div class="card">
      <h2>Elements</h2>
      <div class="sub">Cells</div><div class="tools" id="tCell"></div>
      <div class="sub">Casts</div><div class="tools" id="tCast"></div>
      <div class="sub">Crystals และอื่น ๆ</div><div class="tools" id="tCry"></div>
      <div class="sub">การดู</div><div class="tools" id="tView"></div>
      <table class="card2" id="info"></table>
      <div class="act" id="act"></div>
    </div>
  </section>
</main>
