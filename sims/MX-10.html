<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
@media (min-width:901px){.bench{grid-template-columns:1.2fr 1fr}}
.sel{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px;margin-bottom:8px}
.sel label{font-weight:500}
select{max-width:100%;min-width:0;width:100%;font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line-strong);background:#fff}

.act b{font-weight:600}
.act.bad{background:var(--pink)}
body.present .find .card{display:none}

body.present .hint{display:none}
body.present .card{padding:12px 18px}
body.present .card h2{margin-bottom:6px}
body.present .svgwrap svg{max-height:440px}
body.present .tog{padding:3px 8px;font-size:11.5px}
body.present table.card2{font-size:12px}
body.present table.card2 th,body.present table.card2 td{padding:3px 0}

    [[-22,-40],[-30,-4],[-22,32],[-8,-20],[-8,14]].forEach(function(q){ SV("circle",{cx:q[0],cy:q[1],r:13,fill:"#4e4e4e",stroke:"#b6b6b6","stroke-width":2},K); });
    SV("path",{d:"M0 -26 L10 -8 L4 6 L12 22 L0 30 L-6 12 L-2 -4 Z",fill:"#ffffff"},K);
    lbl(Rk[0]-4,Rk[1],540,110,"Staghorn calculus"); lbl(Rk[0]+26,Rk[1]-38,560,380,"Dilated calyces, low density (bear paw)"); return; }
  if(k==="infarct"){ SV("path",{d:"M-8 -6 L-50 -50 Q-58 -20 -56 10 Z",fill:"#5e5e5e"},K); SV("path",{d:"M-50 -50 Q-58 -20 -56 10",stroke:"#d6d6d6","stroke-width":3,fill:"none"},K);
    lbl(Rk[0]+38,Rk[1]-14,540,110,"Wedge-shaped non-enhancing area"); lbl(Rk[0]+54,Rk[1]+4,560,380,"Cortical rim sign"); return; }
  if(k==="aml"){ SV("circle",{cx:-46,cy:24,r:26,fill:"#2e2e2e",stroke:"#6a6a6a"},K); for(var m=0;m<5;m++) SV("circle",{cx:-46+(m-2)*8,cy:24+((m*7)%10-5),r:2.2,fill:"#7a7a7a"},K);
    lbl(Rk[0]+48,Rk[1]+28,560,380,"Mass with fat density (negative HU)"); return; }
  if(k==="rcc"){ SV("circle",{cx:-40,cy:-30,r:30,fill:"#b9b9b9",stroke:"#e0e0e0","stroke-width":2},K); SV("circle",{cx:-40,cy:-30,r:12,fill:"#7a7a7a"},K);
    SV("path",{d:"M380 266 Q350 274 338 280",stroke:"#9a9a9a","stroke-width":13,fill:"none"},svg); SV("ellipse",{cx:360,cy:271,rx:14,ry:5,fill:"#c6c6c6"},svg);
    lbl(Rk[0]+40,Rk[1]-40,540,110,"Enhancing heterogeneous mass"); lbl(360,271,540,380,"Tumor thrombus in renal vein"); return; }
}
/* ---------- US sagittal ---------- */
function drawUS(k){
  SV("rect",{x:0,y:0,width:640,height:460,fill:"#000"},svg);
  SV("path",{d:"M320 40 L600 400 Q320 470 40 400 Z",fill:"#1c1c1c"},svg);
  for(var i=0;i<260;i++){ var x=60+((i*97)%520), y=70+((i*53)%360); SV("circle",{cx:x,cy:y,r:1.1,fill:"#3a3a3a"},svg); }
  head(k==="ncalc"?"Ultrasound, kidney sagittal":"Ultrasound, left kidney sagittal","B-mode");
  var g=SV("g",{transform:"translate(320,250)"},svg);
  SV("ellipse",{rx:190,ry:92,fill:"#5a5a5a",stroke:"#9a9a9a","stroke-width":2},g);
  var pyr=[[-120,-40],[-60,-62],[10,-66],[80,-58],[130,-30],[-110,40],[-40,62],[30,64],[100,52]];
  pyr.forEach(function(q){ var a=Math.atan2(q[1],q[0]); var gg=SV("g",{transform:"translate("+q[0]+","+q[1]+") rotate("+(a*180/Math.PI+90)+")"},g);
    SV("path",{d:"M-14 -14 L14 -14 L0 16 Z",fill:k==="ncalc"?"#f2f2f2":"#2c2c2c"},gg);
    if(k==="ncalc") SV("path",{d:"M-4 16 L-10 60 L10 60 L4 16 Z",fill:"rgba(0,0,0,0.55)"},gg); });
  if(k==="hydro"){ var gr=+C.g.get();
    SV("ellipse",{rx:105,ry:40,fill:"#d0d0d0"},g);
    var pw=[0,26,40,56,70][gr], ph=[0,16,24,34,46][gr];
    SV("ellipse",{cx:10,cy:6,rx:pw,ry:ph,fill:"#050505"},g);
    if(gr>=2) pyr.forEach(function(q,i){ var s=gr>=3?1:0.6; SV("ellipse",{cx:q[0]*0.72,cy:q[1]*0.62,rx:(gr>=3?20:12)*s+4,ry:(gr>=3?15:9)*s+3,fill:"#050505"},g); SV("line",{x1:q[0]*0.72,y1:q[1]*0.62,x2:10,y2:6,stroke:"#050505","stroke-width":gr>=3?12:7},g); });
    if(gr===4) SV("ellipse",{rx:190,ry:92,fill:"none",stroke:"#5a5a5a","stroke-width":12},g);
    lbl(330,256,540,110,"Dilated renal pelvis"); if(gr>=2) lbl(320+pyr[1][0]*0.72,250+pyr[1][1]*0.62,110,110,"Dilated calyces, connected"); if(gr===4) lbl(320-170,250+40,110,380,"Cortical thinning"); return; }
  SV("ellipse",{rx:100,ry:36,fill:"#d6d6d6"},g);
  if(k==="ncalc"){ lbl(320+pyr[2][0],250+pyr[2][1],540,110,"Echogenic medullary pyramids"); lbl(320+pyr[6][0],250+pyr[6][1]+40,110,400,"Acoustic shadowing"); lbl(320+180,250,560,330,"Cortex less echogenic than pyramids"); }
}
/* ---------- CT urography coronal ---------- */
function drawCTU(k){
  SV("rect",{x:0,y:0,width:640,height:460,fill:"#262626"},svg);
  head("CT urography, coronal, excretory phase","Left kidney, collecting system opacified");
  var g=SV("g",{transform:"translate(320,250)"},svg);
  SV("path",{d:"M0 -170 C120 -170 130 -60 60 -30 C40 -15 40 15 60 30 C130 60 120 170 0 170 C-150 170 -150 -170 0 -170 Z",fill:"#8e8e8e",stroke:"#b0b0b0"},g);
  /* pelvis and ureter */
  SV("path",{d:"M40 -10 Q80 0 70 40 L110 200",stroke:"#fff","stroke-width":12,fill:"none","stroke-linecap":"round"},g);
  SV("path",{d:"M-10 -30 Q30 -40 50 0 Q30 40 -10 30 Z",fill:"#fff"},g);
  var cal=[[-90,-120],[-110,-60],[-115,0],[-110,60],[-90,120]];
  cal.forEach(function(c,i){ SV("path",{d:"M-6 0 L"+(c[0]*0.55)+" "+(c[1]*0.6),stroke:"#fff","stroke-width":9,fill:"none"},g);
    var cx=c[0]*0.7, cy=c[1]*0.72;
    if(k==="papnec"&&(i===1||i===3)){ SV("circle",{cx:cx,cy:cy,r:14,fill:"#fff"},g); SV("circle",{cx:cx-2,cy:cy,r:8,fill:"#7a7a7a"},g); }
    else if(k==="papnec"&&i===2){ SV("path",{d:"M"+(cx+8)+" "+(cy-14)+" Q"+(cx-18)+" "+cy+" "+(cx+8)+" "+(cy+14)+" Z",fill:"#fff"},g); }
    else { SV("path",{d:"M"+(cx+10)+" "+(cy-12)+" L"+(cx-6)+" "+(cy-16)+" Q"+(cx+2)+" "+cy+" "+(cx-6)+" "+(cy+16)+" L"+(cx+10)+" "+(cy+12)+" Z",fill:"#fff"},g); }
    if(k==="msk"){ for(var r=0;r<6;r++){ var a=Math.atan2(c[1],c[0])+(r-2.5)*0.12; SV("line",{x1:cx-4,y1:cy,x2:cx-4+Math.cos(a)*30,y2:cy+Math.sin(a)*30,stroke:"#f4f4f4","stroke-width":2.2},g); }
      SV("circle",{cx:cx-22,cy:cy+4,r:3.6,fill:"#fff"},g); SV("circle",{cx:cx-18,cy:cy-8,r:2.8,fill:"#fff"},g); }
  });
  if(k==="papnec"){ SV("path",{d:"M85 60 l10 -6 l6 10 l-10 6 z",fill:"#5a5a5a",stroke:"#fff"},g); lbl(320+cal[1][0]*0.7,250+cal[1][1]*0.72,110,110,"Ring sign"); lbl(320+cal[2][0]*0.7,250+cal[2][1]*0.72,110,330,"Clubbed calyx"); lbl(320+90,250+57,540,330,"Sloughed papilla in ureter"); }
  if(k==="msk"){ lbl(320+cal[0][0]*0.7-20,250+cal[0][1]*0.72-14,110,110,"Paintbrush striations"); lbl(320+cal[3][0]*0.7-22,250+cal[3][1]*0.72+4,110,380,"Medullary calcifications"); }
}
function update(){
  var k=fs.value, f=F[k]; svg.innerHTML="";
  C.g.el.style.display=f.grade?"":"none"; if(f.grade) C.g.el.querySelector("label").textContent=f.grade==="Class"?"EPN class":"Hydronephrosis grade";
  if(f.mod==="CT") drawCT(k); else if(f.mod==="US") drawUS(k); else drawCTU(k);
  document.getElementById("vt").textContent=f.mod==="CT"?"CT axial":f.mod==="US"?"Ultrasound sagittal":"CT urography coronal";
  var t=document.getElementById("info"); t.innerHTML="";
  [["Finding",f.n],["Key sign",f.sign],["DDx",f.ddx]].forEach(function(r){ t.appendChild(Sim.h("tr",{},[Sim.h("th",{text:r[0]}),Sim.h("td",{text:LAB?r[1]:"ซ่อนอยู่ ลองบรรยายภาพก่อนแล้วเปิดป้าย"})])); });
  var a=document.getElementById("act"); a.innerHTML=LAB?"<b>Next step:</b> "+f.next:"<b>ฝึกบรรยาย:</b> modality, ตำแหน่ง, ขนาดไต, ความผิดปกติ, density หรือ echogenicity แล้วให้ diagnosis และ DDx"; a.className="act"+(LAB?" bad":"");
}

  scenarios:S, order:ORDER, captureMs:500,
  onChange:function(k,s){ fs.value=s.f; if(s.g) C.g.set(s.g); LAB=true; labB.setState(true); update(); },
  refs:["Craig WD, Wagner BJ, Travis MD. Pyelonephritis: radiologic-pathologic review. Radiographics 2008, 28(1): 255-277",
        "Huang JJ, Tseng CC. Emphysematous pyelonephritis: clinicoradiological classification, management, prognosis, and pathogenesis. Arch Intern Med 2000, 160(6): 797-805",
        "Jung DC, Kim SH, Jung SI, Hwang SI, Kim SH. Renal papillary necrosis: review and comparison of findings at multi-detector row CT and intravenous urography. Radiographics 2006, 26(6): 1827-1836",
        "Dyer RB, Chen MY, Zagoria RJ. Abnormal calcifications in the urinary tract. Radiographics 1998, 18(6): 1405-1424",
        "Hazanov N, Somin M, Attali M, et al. Acute renal embolism: forty-four cases of renal infarction in patients with atrial fibrillation. Medicine 2004, 83(5): 292-299",
        "Flum AS, Hamoui N, Said MA, et al. Update on the diagnosis and management of renal angiomyolipoma. J Urol 2016, 195(4 Pt 1): 834-846",
        "Onen A. Grading of hydronephrosis: an ongoing challenge. Front Pediatr 2020, 8: 458"],
  note:"ภาพวาดเชิงสัญลักษณ์เพื่อการสอน ไม่ใช่ภาพรังสีจริง ความหนาแน่นใน CT: อากาศดำสนิท ไขมันเทาเข้ม เนื้อเยื่อเทากลาง contrast และ calcification ขาว"
});
})();
