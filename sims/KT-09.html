<body>
<main class="sim" id="sim">
  <section class="bench">
    <div class="card">
      <h2 id="vtitle">Graft survival ตาม KDRI</h2>
      <div id="chart"></div>

    </div>
  </section>
</main>

<script>
(function(){
"use strict";
function D(o){ var d = {mode:"dd", age:40, ht:170, wt:75, cr:1.0, htn:false, dm:false, cva:false, hcv:false, dcd:false, lage:40, sex:"f", egfr:100, acr:10, sbp:120, bmi:24, smk:false, ldm:false, fam:false, thr:1.5}; Object.keys(o).forEach(function(k){ d[k] = o[k]; }); return d; }
var S = {
  young:{name:"Deceased donor อายุน้อย", p:D({age:24, ht:175, wt:70, cr:0.9}),
    rows:[["Donor","ชาย 24 ปี อุบัติเหตุ head injury Cr 0.9"],["Comorbidity","ไม่มี HT, DM, HCV ไม่ใช่ DCD"],["KDPI","ต่ำ อยู่ในกลุ่มดีที่สุด"],["Allocation","จับคู่กับ recipient อายุน้อยที่คาดว่าจะอยู่นาน"]],
    take:["KDPI รวมปัจจัย donor 8 ตัวเป็นค่าเดียวเทียบกับ donor ทั้งประเทศ","KDPI ต่ำคาดว่า graft อยู่นาน","Longevity matching ให้ไต KDPI ต่ำแก่ผู้รับที่คาดว่าจะมีชีวิตยาว"]},
  ecd:{name:"Donor สูงอายุ KDPI สูง", p:D({age:66, ht:160, wt:68, cr:1.6, htn:true, cva:true}),
    rows:[["Donor","หญิง 66 ปี stroke HT 15 ปี Cr 1.6"],["KDPI","มากกว่า 85%"],["ความหมาย","Graft survival สั้นกว่า แต่ยังดีกว่ารอฟอกเลือดในผู้รับสูงอายุ"],["Consent","ต้องแจ้งผู้รับก่อนรับไต KDPI สูง"]],
    take:["อายุ donor เป็นตัวแปรที่มีน้ำหนักมากที่สุดใน KDRI","ไต KDPI สูงยังให้ survival benefit ในผู้รับสูงอายุที่รอนาน","Biopsy ของ donor ช่วยเสริม แต่ไม่ควรใช้ทิ้งไตเพียงลำพัง"]},
  dcd:{name:"DCD + Cr สูงจาก AKI", p:D({age:45, ht:168, wt:72, cr:3.0, dcd:true}),
    rows:[["Donor","ชาย 45 ปี cardiac arrest แล้วเป็น DCD"],["Cr","3.0 mg/dL จาก AKI ใน ICU"],["KDRI","Cr สูงเพิ่ม KDRI แต่มีเพดานที่ Cr 1.5"],["คาด","DGF สูง แต่ graft survival ระยะยาวใกล้เคียง"]],
    take:["Cr ของ donor ใน KDRI มีผลเชิงเส้นถึง 1.5 แล้วชันน้อยลง","AKI ของ donor ทำให้ DGF มากขึ้นแต่ไม่ได้ทำให้ graft อยู่สั้นมากนัก","DCD เพิ่ม DGF ควรลด cold ischemia time"]},
  hcv:{name:"HCV-viremic donor", p:D({age:35, ht:172, wt:78, cr:1.0, hcv:true}),
    rows:[["Donor","ชาย 35 ปี HCV RNA บวก"],["KDPI","HCV ไม่ถูกนับใน KDPI แล้วตั้งแต่ ต.ค. 2024"],["ยุค DAA","ให้ DAA แก่ผู้รับหลังปลูกถ่ายหายได้เกือบทั้งหมด"],["Consent","แจ้งผู้รับและติดตาม HCV RNA"]],
    take:["KDPI เดิมนับ HCV ทำให้ไตดูแย่เกินจริงในยุค DAA จึงตัดออกจาก KDPI แล้ว","ไต HCV บวกช่วยลดเวลารอได้มาก","ต้องมีระบบให้ DAA ทันทีหลังผ่าตัด"]},
  ldok:{name:"Living donor อายุ 45 ปีที่เหมาะ", p:D({mode:"ld", lage:45, sex:"f", egfr:98, acr:8, sbp:118, bmi:23}),
    rows:[["Donor","หญิง 45 ปี ภรรยาผู้ป่วย"],["Evaluation","mGFR 98, ACR 8, BP ปกติ BMI 23"],["Risk","Lifetime ESKD risk หลังบริจาคยังต่ำกว่าเกณฑ์"],["Decision","บริจาคได้"]],
    take:["ประเมิน living donor ด้วย projected lifetime risk ไม่ใช่ตัวแปรเดี่ยว","การบริจาคเพิ่มความเสี่ยง ESKD แบบสัมพัทธ์ แต่ absolute risk ยังต่ำ","แต่ละศูนย์ควรกำหนดเกณฑ์ความเสี่ยงที่ยอมรับได้"]},
  ldyoung:{name:"Donor อายุ 22 ปี, ACR 40", p:D({mode:"ld", lage:22, sex:"m", egfr:105, acr:40, sbp:132, bmi:29, fam:true}),
    rows:[["Donor","ชาย 22 ปี น้องชายผู้ป่วยที่เป็น ESKD จาก GN ไม่ทราบสาเหตุ"],["Evaluation","ACR 40, BP 132, BMI 29"],["Risk","Lifetime risk สูงเพราะอายุน้อยและมีญาติเป็นโรคไต"],["Decision","ระวัง ต้องหาสาเหตุโรคในครอบครัวก่อน"]],
    take:["Donor อายุน้อยมี lifetime risk สูงกว่าเพราะเหลือเวลาให้โรคเกิดนาน","ญาติที่เป็นโรคไตเพิ่มความเสี่ยง ควรตรวจ genetic ถ้าทำได้","Albuminuria 30–100 mg/g ต้องพิจารณารายบุคคล"]},
  ldno:{name:"Donor eGFR 58, DM", p:D({mode:"ld", lage:55, sex:"m", egfr:58, acr:120, sbp:150, bmi:33, ldm:true, smk:true}),
    rows:[["Donor","ชาย 55 ปี DM type 2 HT"],["Evaluation","eGFR 58, ACR 120, BP 150/95, BMI 33"],["Risk","หลายข้อเกินเกณฑ์"],["Decision","ไม่ควรบริจาค"]],
    take:["eGFR < 60 หรือ ACR > 100 mg/g ไม่ควรบริจาค","DM type 2 ต้องพิจารณาเข้มงวดหรือไม่รับ","ปฏิเสธ donor อย่างมีศิลปะและส่งต่อดูแลสุขภาพ"]}
};
var ORDER = ["young","ecd","dcd","hcv","ldok","ldyoung","ldno"];
var C = {}, F = {}, TG = {}, MODE = "dd";
function sl(box, k, o){ o.id = "s" + k; o.onInput = update; C[k] = Sim.slider(o); document.getElementById(box).appendChild(C[k].el); }
sl("cDD", "age", {label:"Donor age", min:5, max:80, step:1, value:40, unit:"y"});
sl("cDD", "ht", {label:"Height", min:140, max:200, step:1, value:170, unit:"cm"});
sl("cDD", "wt", {label:"Weight", min:35, max:130, step:1, value:75, unit:"kg"});
sl("cDD", "cr", {label:"Terminal Cr", min:0.4, max:5, step:0.1, value:1.0, unit:"mg/dL"});
[["htn","Hypertension"],["dm","Diabetes"],["cva","Death from stroke"],["hcv","HCV positive"],["dcd","DCD"]].forEach(function(x){ F[x[0]] = false; TG[x[0]] = Sim.toggle(x[1], function(on){ F[x[0]] = on; update(); }, false); document.getElementById("tDD").appendChild(TG[x[0]]); });
sl("cLD", "lage", {label:"Donor age", min:18, max:75, step:1, value:40, unit:"y"});
sl("cLD", "egfr", {label:"eGFR or mGFR", min:40, max:130, step:1, value:100, unit:""});
sl("cLD", "acr", {label:"ACR", min:0, max:300, step:1, value:10, unit:"mg/g"});
sl("cLD", "sbp", {label:"SBP", min:100, max:170, step:1, value:120, unit:"mmHg"});
sl("cLD", "bmi", {label:"BMI", min:17, max:42, step:0.5, value:24, unit:""});
sl("cLD", "thr", {label:"เกณฑ์ศูนย์ (lifetime)", min:0.5, max:5, step:0.1, value:1.5, unit:"%"});
[["sexm","Male"],["smk","Smoker"],["ldm","Diabetes or prediabetes"],["fam","ญาติเป็นโรคไต หรือ APOL1 high-risk"]].forEach(function(x){ F[x[0]] = false; TG[x[0]] = Sim.toggle(x[1], function(on){ F[x[0]] = on; update(); }, false); document.getElementById("tLD").appendChild(TG[x[0]]); });
var mb = document.querySelectorAll("#mode button");
function setMode(m){ MODE = m; mb.forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.m === m ? "true" : "false"); });
  document.getElementById("pDD").classList.toggle("hide", m !== "dd"); document.getElementById("pLD").classList.toggle("hide", m !== "ld");
  document.getElementById("chart").classList.toggle("hide", m !== "dd"); document.getElementById("ld").parentNode.classList.toggle("hide", m !== "ld"); }
mb.forEach(function(b){ b.addEventListener("click", function(){ setMode(b.dataset.m); update(); }); });

/* ---------- deceased donor: KDRI (Rao 2009 without race and HCV, as in the current KDPI) ---------- */
function kdri(p){
  var x = 0.0128 * (p.age - 40);
  if(p.age < 18) x += -0.0194 * (p.age - 18);
  if(p.age > 50) x += 0.0107 * (p.age - 50);
  x += -0.0464 * (p.ht - 170) / 10;
  if(p.wt < 80) x += -0.0199 * (p.wt - 80) / 5;
  if(p.htn) x += 0.126; if(p.dm) x += 0.13; if(p.cva) x += 0.0881;
  x += 0.22 * (p.cr - 1); if(p.cr > 1.5) x += -0.209 * (p.cr - 1.5);
  if(p.dcd) x += 0.133;
  return Math.exp(x);
}
function ncdf(z){ var t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2), pr = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - pr : pr; }
var SCALE = 1.33, SD = 0.33;
function kdpi(k){ return Math.round(100 * ncdf(Math.log(k / SCALE) / SD)); }
function surv(km, t){ var lam = 0.046; return Math.exp(-Math.pow(lam * t, 1.12) * km); }
var A = Plot.colors;
var chart = Plot.chart(document.getElementById("chart"), {height:Sim.present ? 330 : 300, aria:"Estimated death-censored graft survival over ten years by donor KDRI",
  x:{min:0, max:10, step:1, label:"Years after transplant"}, y:{min:0, max:100, step:20, label:"Graft survival (%)"},
  series:[{id:"me", name:"This donor", color:A.accent, data:[], width:2.8},{id:"k20", name:"KDPI 20", color:A.teal, data:[], width:1.4, dash:[5,3]},{id:"k50", name:"KDPI 50", color:A.muted, data:[], width:1.4, dash:[2,3]},{id:"k85", name:"KDPI 85", color:A.red, data:[], width:1.4, dash:[5,3]}],
  legend:true});
function kOf(kd){ var z = [-0.8416, 0, 1.0364][[20,50,85].indexOf(kd)]; return Math.exp(z * SD) ; }
function curve(km){ var d = []; for(var t = 0; t <= 10.001; t += 0.25) d.push([t, 100 * surv(km, t)]); return d; }
chart.setSeries("k20", curve(kOf(20))); chart.setSeries("k50", curve(kOf(50))); chart.setSeries("k85", curve(kOf(85)));

/* ---------- living donor (teaching estimate) ---------- */
function ldRisk(p){
  var r = 0.15 * (1 + Math.max(0, 60 - p.lage) / 25) * (p.sexm ? 1.4 : 1) * Math.pow(1.22, Math.max(0, (100 - p.egfr) / 10)) * (1 + p.acr / 40) * Math.pow(1.15, Math.max(0, (p.sbp - 120) / 10)) * Math.pow(1.2, Math.max(0, (p.bmi - 25) / 5)) * (p.smk ? 1.7 : 1) * (p.ldm ? 3 : 1) * (p.fam ? 3 : 1);
  return {pre:r, post:Math.min(60, r * (1 + 2.5 / (1 + r / 2)))};
}
var ld = document.getElementById("ld"), FT = "IBM Plex Sans Thai, sans-serif", MO = "Geist Mono, monospace";
function drawLD(p, R){
  ld.innerHTML = "";
  var mx = Math.max(4, Math.ceil(Math.max(R.post, p.thr) * 1.2)), x0 = 190, w = 400;
  function X(v){ return x0 + w * Math.min(v, mx) / mx; }
  Sim.svg("text", {x:16, y:24, "font-family":FT, "font-size":13, "font-weight":600, fill:"#0B0B1F", text:"Projected lifetime ESKD risk (teaching estimate)"}, ld);
  [["Without donation", R.pre, "#9A9CB2", 50],["After donation", R.post, R.post > p.thr ? "#B4232A" : "#5B4BFF", 100]].forEach(function(b){
    Sim.svg("text", {x:x0 - 12, y:b[3] + 18, "text-anchor":"end", "font-family":FT, "font-size":13, fill:"#0B0B1F", text:b[0]}, ld);
    Sim.svg("rect", {x:x0, y:b[3], width:w, height:28, rx:8, fill:"#F4F5F9"}, ld);
    Sim.svg("rect", {x:x0, y:b[3], width:Math.max(3, X(b[1]) - x0), height:28, rx:8, fill:b[2]}, ld);
    Sim.svg("text", {x:Math.min(x0 + w + 8, X(b[1]) + 8), y:b[3] + 19, "font-family":MO, "font-size":13, fill:"#0B0B1F", text:b[1].toFixed(2) + "%"}, ld);
  });
  Sim.svg("line", {x1:X(p.thr), y1:40, x2:X(p.thr), y2:140, stroke:"#0B0B1F", "stroke-dasharray":"4 3"}, ld);
  Sim.svg("text", {x:X(p.thr), y:154, "text-anchor":"middle", "font-family":MO, "font-size":11, fill:"#0B0B1F", text:"Program threshold " + p.thr.toFixed(1) + "%"}, ld);
  var f = [["Age " + p.lage, 1 + Math.max(0, 60 - p.lage) / 25],["eGFR " + p.egfr, Math.pow(1.22, Math.max(0, (100 - p.egfr) / 10))],["ACR " + p.acr, 1 + p.acr / 40],["SBP " + p.sbp, Math.pow(1.15, Math.max(0, (p.sbp - 120) / 10))],["BMI " + p.bmi, Math.pow(1.2, Math.max(0, (p.bmi - 25) / 5))],["Male", p.sexm ? 1.4 : 1],["Smoking", p.smk ? 1.7 : 1],["Diabetes", p.ldm ? 3 : 1],["Family or APOL1", p.fam ? 3 : 1]];
  Sim.svg("text", {x:16, y:188, "font-family":FT, "font-size":12.5, "font-weight":600, fill:"#0B0B1F", text:"Risk multipliers"}, ld);
  f.forEach(function(q, i){ var col = i % 3, row = Math.floor(i / 3), x = 16 + col * 222, y = 202 + row * 38, hi = q[1] > 1.25;
    Sim.svg("rect", {x:x, y:y, width:212, height:30, rx:9, fill:hi ? "#F9EAEA" : "#FFFFFF", stroke:hi ? "#E9B9BC" : "#E6E7F0"}, ld);
    Sim.svg("text", {x:x + 10, y:y + 20, "font-family":FT, "font-size":12, fill:"#0B0B1F", text:q[0]}, ld);
    Sim.svg("text", {x:x + 202, y:y + 20, "text-anchor":"end", "font-family":MO, "font-size":12, fill:hi ? "#B4232A" : "#5E6075", text:"x" + q[1].toFixed(2)}, ld); });
  Sim.svg("text", {x:16, y:324, "font-family":FT, "font-size":10.5, fill:"#9A9CB2", text:"Simplified multiplicative model for teaching. Use a validated calculator for real donor decisions."}, ld);
}
function P(){ var p = {}; Object.keys(C).forEach(function(k){ p[k] = C[k].get(); }); Object.keys(F).forEach(function(k){ p[k] = F[k]; }); return p; }
function ckRow(cls, sym, txt){ return "<div class='" + cls + "'><span class='i'>" + sym + "</span><span>" + txt + "</span></div>"; }
function update(){
  var p = P(), ck = [], n;
  if(MODE === "dd"){
    var k = kdri(p), kp = kdpi(k), km = k / SCALE;
    chart.setSeries("me", curve(km));
    document.getElementById("vtitle").textContent = "Graft survival ตาม KDRI ของ donor นี้";
    document.getElementById("vhint").textContent = "เส้นม่วงคือ graft survival โดยประมาณของ donor นี้ เทียบกับ donor ที่ KDPI 20, 50 และ 85 KDRI คือ relative hazard ของ graft failure เทียบ donor อ้างอิง ส่วนการแปลงเป็น KDPI และเส้น survival ในหน้านี้เป็นค่าประมาณ";
    ["KDRI","KDPI (approx.)","5-yr graft survival"].forEach(function(l, i){ document.getElementById("l" + (i + 1)).textContent = l; });
    Sim.ro("r1", k.toFixed(2), k > 1.6 ? "flag" : k < 1.0 ? "ok" : null);
    Sim.ro("r2", kp + "%", kp > 85 ? "flag" : kp <= 20 ? "ok" : null);
    Sim.ro("r3", Math.round(100 * surv(km, 5)) + "%");
    ck.push(ckRow(p.age > 50 ? "mid" : "ok", p.age > 50 ? "!" : "✓", "Age " + p.age + ": น้ำหนักมากที่สุด เพิ่มชันขึ้นหลัง 50 ปี"));
    ck.push(ckRow(p.cr > 1.5 ? "mid" : "ok", p.cr > 1.5 ? "!" : "✓", "Cr " + p.cr.toFixed(1) + ": ผลชันถึง 1.5 แล้วลดความชัน"));
    if(p.htn || p.dm) ck.push(ckRow("mid", "!", "HT หรือ DM ของ donor เพิ่ม KDRI"));
    if(p.hcv) ck.push(ckRow("mid", "!", "HCV ไม่อยู่ใน KDPI ตั้งแต่ ต.ค. 2024 เพราะยุค DAA ผลลัพธ์ใกล้เคียงไต HCV ลบ ต้องมีระบบให้ DAA แก่ผู้รับ"));
    if(p.dcd) ck.push(ckRow("mid", "!", "DCD เพิ่ม DGF ลด cold ischemia time"));
    n = kp > 85 ? "KDPI > 85%: เหมาะกับผู้รับสูงอายุหรือที่รอนานและเสี่ยงตายบน dialysis ต้องขอ consent ก่อน พิจารณา biopsy ร่วมกับข้อมูลอื่น ไม่ทิ้งไตจาก biopsy อย่างเดียว" : kp <= 20 ? "KDPI ≤ 20%: จับคู่กับผู้รับที่คาดว่าจะมีชีวิตยาว (longevity matching) เช่นอายุน้อย ไม่มี DM" : "KDPI กลาง: allocation ตามคิวมาตรฐาน ลด cold ischemia time และวางแผนรับมือ DGF";
  } else {
    var R = ldRisk(p); drawLD(p, R);
    document.getElementById("vtitle").textContent = "Living donor: ความเสี่ยงตลอดชีวิต";
    document.getElementById("vhint").textContent = "แท่งบนคือความเสี่ยง ESKD ตลอดชีวิตที่ประมาณได้ถ้าไม่บริจาค แท่งล่างคือหลังบริจาค (โมเดลนี้เพิ่มราว 3 เท่าเมื่อความเสี่ยงพื้นฐานต่ำ และน้อยกว่านั้นเมื่อความเสี่ยงพื้นฐานสูง ส่วนการศึกษาที่เทียบกับคนสุขภาพดีที่ไม่ได้บริจาครายงานราว 8–11 เท่า แต่ absolute risk ยังต่ำ) เส้นประคือเกณฑ์ที่ศูนย์กำหนด";
    ["Lifetime risk ถ้าไม่บริจาค","Lifetime risk หลังบริจาค","เทียบเกณฑ์ศูนย์"].forEach(function(l, i){ document.getElementById("l" + (i + 1)).textContent = l; });
    Sim.ro("r1", R.pre.toFixed(2) + "%");
    Sim.ro("r2", R.post.toFixed(2) + "%", R.post > p.thr ? "flag" : "ok");
    Sim.ro("r3", R.post > p.thr ? "เกิน" : "ผ่าน", R.post > p.thr ? "flag" : "ok");
    ck.push(ckRow(p.egfr >= 90 ? "ok" : p.egfr >= 60 ? "mid" : "no", p.egfr >= 90 ? "✓" : p.egfr >= 60 ? "!" : "✕", "GFR " + p.egfr + ": ≥ 90 รับได้, 60–89 พิจารณาตามความเสี่ยง, < 60 ไม่ควรบริจาค"));
    ck.push(ckRow(p.acr < 30 ? "ok" : p.acr <= 100 ? "mid" : "no", p.acr < 30 ? "✓" : p.acr <= 100 ? "!" : "✕", "ACR " + p.acr + " mg/g: < 30 รับได้, 30–100 รายบุคคล, > 100 ไม่ควรบริจาค"));
    ck.push(ckRow(p.sbp < 140 ? "ok" : "mid", p.sbp < 140 ? "✓" : "!", "BP: คุมได้ < 140/90 ด้วยยาไม่เกิน 1–2 ตัวอาจรับได้"));
    ck.push(ckRow(p.bmi <= 30 ? "ok" : p.bmi <= 35 ? "mid" : "no", p.bmi <= 30 ? "✓" : p.bmi <= 35 ? "!" : "✕", "BMI " + p.bmi + ": > 30 ประเมินรายบุคคล > 35 มักไม่แนะนำ"));
    if(p.ldm) ck.push(ckRow("no", "✕", "DM: type 1 ห้ามบริจาค type 2 พิจารณาเข้มงวดมาก"));
    if(p.fam) ck.push(ckRow("mid", "!", "ญาติเป็นโรคไต: หาสาเหตุ (genetic, APOL1) ก่อนรับ"));
    var hardNo = p.egfr < 60 || p.acr > 100 || p.bmi > 35 || p.ldm;
    n = hardNo ? "ไม่ควรบริจาค แจ้งผลอย่างเป็นความลับและส่งต่อดูแลปัจจัยเสี่ยง หา donor อื่นหรือ paired exchange" : R.post > p.thr ? "Lifetime risk เกินเกณฑ์ของศูนย์ ถ้า donor อายุน้อยให้รอประเมินซ้ำหรือหา donor อื่น ปรึกษา donor advocate ที่เป็นอิสระ" : "บริจาคได้ ให้ข้อมูลความเสี่ยงระยะยาว (ESKD, HT, preeclampsia ในหญิง) และติดตาม BP, eGFR, albuminuria ทุกปี";
  }
  document.getElementById("ck").innerHTML = ck.join("");
  document.getElementById("act").innerHTML = "<b>Next step:</b> " + n;
}
Sim.mount({code:"KT-09", title:"Donor Evaluation: KDPI and Living Donor Risk",

  scenarios:S, order:ORDER, captureMs:900,
  onChange:function(k, s){ var q = s.p; setMode(q.mode);
    ["age","ht","wt","cr","lage","egfr","acr","sbp","bmi","thr"].forEach(function(x){ C[x].set(q[x]); });
    ["htn","dm","cva","hcv","dcd","smk","ldm","fam"].forEach(function(x){ F[x] = !!q[x]; TG[x].setState(F[x]); }); F.sexm = q.sex === "m"; TG.sexm.setState(F.sexm); update(); },
  refs:["Rao PS, Schaubel DE, Guidinger MK, et al. A comprehensive risk quantification score for deceased donor kidneys: the kidney donor risk index. Transplantation 2009, 88(2): 231-236",
        "Lentine KL, Kasiske BL, Levey AS, et al. KDIGO clinical practice guideline on the evaluation and care of living kidney donors. Transplantation 2017, 101(8S Suppl 1): S1-S109",
        "Muzaale AD, Massie AB, Wang MC, et al. Risk of end-stage renal disease following live kidney donation. JAMA 2014, 311(6): 579-586",
        "Grams ME, Sang Y, Levey AS, et al. Kidney-failure risk projection for the living kidney-donor candidate. N Engl J Med 2016, 374(5): 411-421",
        "Mohan S, Chiles MC, Patzer RE, et al. Factors leading to the discard of deceased donor kidneys in the United States. Kidney Int 2018, 94(1): 187-198",
        "Reese PP, Abt PL, Blumberg EA, et al. Twelve-month outcomes after transplant of hepatitis C-infected kidneys into uninfected recipients: a single-group trial. Ann Intern Med 2018, 169(5): 273-281"],
  note:"KDRI ใช้สัมประสิทธิ์ของ Rao 2009 โดยตัดตัวแปร race และ HCV ออกตาม KDPI ปัจจุบัน (OPTN ต.ค. 2024 ซึ่ง refit สัมประสิทธิ์ที่เหลือใหม่ ค่าในหน้านี้จึงเป็นค่าประมาณ) การแปลง KDRI เป็น KDPI ใช้ log-normal โดยประมาณ (median scaling 1.33, SD 0.33) และเส้น survival เป็น Weibull อ้างอิง ส่วน living donor risk เป็นโมเดลคูณแบบง่ายเพื่อการสอน ไม่ใช่สมการที่ validate แล้ว"
});
