    take:["Interaction ที่น่าเชื่อ: กำหนดล่วงหน้า จำนวนน้อย มีเหตุผลทางชีววิทยา p interaction ต่ำ และพบซ้ำใน trial อื่น","Quantitative interaction (ขนาดต่าง ทิศเดียวกัน) พบบ่อยกว่า qualitative (ทิศตรงข้าม)","Post hoc subgroup เป็น hypothesis-generating"]},

};
var ORDER=["km","under","lowrisk","censor","multi","niMet","niInc","niWorse","niSup","sgChance","sgTrue","sgSmall"];
var C={};
function sl(box,k,o){ o.id="s"+k; o.onInput=function(){ update(); }; C[k]=Sim.slider(o); document.getElementById(box).appendChild(C[k].el); }
sl("cKM","n",{label:"n ต่อกลุ่ม",min:100,max:6000,step:50,value:2000,unit:""});

var SEED=7;
var rb=Sim.h("button",{class:"tog",type:"button",text:"สุ่มใหม่ (seed ใหม่)"}); rb.addEventListener("click",function(){ SEED=(SEED*7+13)%997; update(); }); document.getElementById("tSG").appendChild(rb);
var MODE="km", MB={};
[["km","KM และ NNT"],["ni","Non-inferiority"],["sg","Subgroup forest"]].forEach(function(m){ var b=Sim.h("button",{class:"tog",type:"button","aria-pressed":"false",text:m[1]}); b.addEventListener("click",function(){ setMode(m[0]); update(); }); document.getElementById("modes").appendChild(b); MB[m[0]]=b; });
function setMode(m){ MODE=m; Object.keys(MB).forEach(function(k){ MB[k].setAttribute("aria-pressed",k===m?"true":"false"); });

}

/* ---------- KM ---------- */
function km(){
  var n=C.n.get(), pc=C.pc.get()/100, hr=C.hr.get(), T=C.T.get(), drop=C.drop.get()/100, k=C.k.get();
  var lc=-Math.log(1-pc)/T, lt=lc*hr, c=drop>0?-Math.log(1-drop):0;
  function ev(l){ return n*l/(l+c)*(1-Math.exp(-(l+c)*T)); }
  var Dc=ev(lc), Dt=ev(lt), se=Math.sqrt(1/Dc+1/Dt), lhr=Math.log(hr);
  var lo=Math.exp(lhr-1.96*se), hi=Math.exp(lhr+1.96*se), z=Math.abs(lhr)/se, p=2*(1-Phi(z)), power=hr===1?0.05:Phi(z-1.96)+Phi(-z-1.96);
  var rc=1-Math.exp(-lc*T), rt=1-Math.exp(-lt*T), arr=rc-rt, nnt=arr!==0?1/Math.abs(arr):Infinity, fwer=1-Math.pow(0.95,k);
  /* draw */
  svg.innerHTML="";
  var X0=110,X1=610,Y0=34,Y1=270, ymin=Math.max(0,Math.floor((1-Math.max(rc,rt)*1.25)*10)/10);
  if(ymin>0.9) ymin=0.9;
  function X(t){ return X0+(t/T)*(X1-X0); } function Y(s){ return Y1-(s-ymin)/(1-ymin)*(Y1-Y0); }
  tx(20,18,"Event-free survival",{a:"start",fs:13,fw:600});
  for(var g=ymin;g<=1.0001;g+=(1-ymin)/5){ ln(X0,Y(g),X1,Y(g),"#EEEFF5"); tx(X0-8,Y(g)+4,(g*100).toFixed(0)+"%",{a:"end",fs:11,mono:true,fill:MUT}); }
  ln(X0,Y1,X1,Y1,MUT); ln(X0,Y0,X0,Y1,MUT);
  for(var y=0;y<=T+1e-9;y+=(T>3?1:0.5)){ tx(X(y),Y1+16,(y%1===0?y.toFixed(0):y.toFixed(1)),{fs:11,mono:true,fill:MUT}); }
  tx((X0+X1)/2,Y1+32,"Years",{fs:11.5,fill:MUT});
  [["Control",lc,"#9A9CB2"],["Treatment",lt,ACC]].forEach(function(a){
    var d="M"+X(0)+" "+Y(1), steps=Math.round(T*12);
    for(var i=1;i<=steps;i++){ var t=i/12, s=Math.exp(-a[1]*t); d+=" L"+X(t)+" "+Y(Math.exp(-a[1]*(i-1)/12))+" L"+X(t)+" "+Y(s); }
    SV("path",{d:d,fill:"none",stroke:a[2],"stroke-width":a[2]===ACC?2.6:2},svg);
    if(c>0){ var cens=n*(1-Math.exp(-c*T)), step=Math.max(1,cens/14); for(var j=1;j*step<cens&&j<16;j++){ var tc=-Math.log(1-j*step/n*1)/c; if(!(tc>0&&tc<T)) continue; var sc=Math.exp(-a[1]*tc); ln(X(tc),Y(sc)-5,X(tc),Y(sc)+5,a[2],1.4); } }
  });
  var yc=Y(1-rc), yt=Y(1-rt); ln(X1-6,yc,X1-6,yt,RED,2); tx(X1-12,(yc+yt)/2+4,"ARR "+(arr*100).toFixed(1)+"%",{a:"end",fs:11.5,fw:600,fill:RED});
  SV("rect",{x:X0+12,y:Y1-60,width:200,height:46,rx:10,fill:"#fff",stroke:LINE},svg);
  ln(X0+24,Y1-44,X0+44,Y1-44,ACC,2.6); tx(X0+50,Y1-40,"Treatment",{a:"start",fs:11.5});
  ln(X0+24,Y1-26,X0+44,Y1-26,"#9A9CB2",2); tx(X0+50,Y1-22,"Control",{a:"start",fs:11.5});
  tx(X0+120,Y1-40,"HR "+hr.toFixed(2),{a:"start",fs:11.5,mono:true});
  tx(X0+120,Y1-22,"p "+pfmt(p),{a:"start",fs:11.5,mono:true,fill:p<0.05?TEAL:RED});
  /* at risk */
  var ty=Y1+56; tx(20,ty,"Number at risk",{a:"start",fs:12,fw:600});

  tx(20,ty+66,"Events: control "+Math.round(Dc)+", treatment "+Math.round(Dt)+"   SE(ln HR) = √(1/"+Math.round(Dc)+" + 1/"+Math.round(Dt)+") = "+se.toFixed(3),{a:"start",fs:11,mono:true,fill:MUT});
  setRO(1,"HR (95% CI)",hr.toFixed(2)+" ("+lo.toFixed(2)+"–"+hi.toFixed(2)+")",hi<1?"ok":lo>1?"flag":null);
  setRO(2,"p value",pfmt(p),p<0.05?"ok":"flag");
  setRO(3,"Power (α 0.05)",(power*100).toFixed(0)+"%",power<0.8?"flag":"ok");
  setRO(4,"Events รวม",Math.round(Dc+Dt).toLocaleString("en-US"),null);

  var m,bad=false;

/* ---------- NI ---------- */
function ni(){
  var cr=C.cr.get()/100, d=C.diff.get()/100, n=C.nn.get(), M=C.margin.get();
  var er=Math.min(0.99,Math.max(0.001,cr+d)), se=Math.sqrt(cr*(1-cr)/n+er*(1-er)/n)*100, dd=d*100, lo=dd-1.96*se, hi=dd+1.96*se;
  var cls, col;

  svg.innerHTML="";
  var R=Math.max(10,Math.ceil(Math.max(Math.abs(lo),Math.abs(hi),M)+2)), X0=200,X1=620;

  SV("rect",{x:X(M),y:34,width:X1-X(M),height:356,fill:"#FBE9EA",opacity:0.6},svg);
  tx(X(M)+6,50,"Unacceptably worse",{a:"start",fs:11,fill:RED});
  tx(X(0)-6,50,"New is better",{a:"end",fs:11,fill:TEAL});
  ln(X(0),34,X(0),390,INK,1.4); ln(X(M),34,X(M),390,RED,1.6,"6 4");
  tx(X(M),404,"Margin +"+M,{fs:11.5,fw:600,fill:RED}); tx(X(0),404,"0",{fs:11.5,mono:true});
  for(var v=-R;v<=R;v+=(R>14?5:2)){ ln(X(v),390,X(v),395,MUT); tx(X(v),420,(v>0?"+":"")+v,{fs:10.5,mono:true,fill:MUT}); }
  /* this trial */
  var y=94; tx(20,y+4,"This trial",{a:"start",fs:12,fw:600});
  ln(X(lo),y,X(hi),y,col,4); SV("circle",{cx:X(dd),cy:y,r:7,fill:col},svg);
  tx(20,y+22,cls,{a:"start",fs:12.5,fw:600,fill:col});
  tx(20,y+42,(dd>0?"+":"")+dd.toFixed(1)+" ("+lo.toFixed(1)+" to "+hi.toFixed(1)+")",{a:"start",fs:11.5,mono:true,fill:MUT});
  /* reference patterns */
  var ref=[["A",-6,-1.5,"Superior"],["B",-2.5,M-0.8,"Non-inferior"],["C",0.6,M-0.6,"Non-inferior, but worse"],["D",-1.5,M+2.5,"Inconclusive"],["E",M+0.5,M+4,"Inferior"]];
  tx(20,170,"Reference patterns",{a:"start",fs:12,fw:600,fill:MUT});
  ref.forEach(function(r,i){ var yy=196+i*36, a=Math.max(-R,r[1]), b=Math.min(R,r[2]);
    tx(20,yy+4,r[0]+"  "+r[3],{a:"start",fs:11.5,fill:MUT}); ln(X(a),yy,X(b),yy,FAINT,3); SV("circle",{cx:X((a+b)/2),cy:yy,r:4.5,fill:FAINT},svg); });
  setRO(1,"ผลต่าง (ใหม่ − เดิม)",(dd>0?"+":"")+dd.toFixed(1)+"%",null);
  setRO(2,"95% CI",lo.toFixed(1)+" ถึง "+hi.toFixed(1),null);
  setRO(3,"ขอบบนเทียบ margin",hi.toFixed(1)+(hi<M?" < ":" ≥ ")+M,hi<M?"ok":"flag");
  setRO(4,"ข้อสรุป",cls,col===RED?"flag":col===TEAL?"ok":null);
  setRO(5,"Event ใหม่ / เดิม",(er*100).toFixed(1)+" / "+(cr*100).toFixed(1)+"%",null);
  var nNeed=Math.ceil(Math.pow(1.96+0.84,2)*(2*cr*(1-cr))/Math.pow(M/100,2));
  setRO(6,"n ต่อกลุ่มที่ต้องการ*",nNeed.toLocaleString("en-US"),n<nNeed?"flag":"ok");
  document.getElementById("steps").innerHTML='<ol class="steps"><li><b>SE = √(p1(1 − p1)/n + p2(1 − p2)/n)</b> = '+se.toFixed(2)+' percentage points</li><li><b>95% CI = difference ± 1.96 SE</b> = '+lo.toFixed(1)+' ถึง '+hi.toFixed(1)+'</li><li><b>Non-inferior เมื่อขอบบน &lt; margin</b> '+hi.toFixed(1)+(hi<M?' &lt; ':' ≥ ')+M+'</li><li><b>* n ต่อกลุ่ม</b> ถ้าผลต่างจริงเป็น 0 ที่ power 80% one-sided α 0.025 = (1.96 + 0.84)² × 2p(1 − p)/margin² = '+nNeed.toLocaleString("en-US")+'</li></ol>';
  var m,bad=false;
  if(cls==="Inconclusive"){ m="<b>Inconclusive</b> CI คร่อม margin สรุปว่า non-inferior ไม่ได้ ต้องเพิ่มขนาด (ต้องการราว "+nNeed.toLocaleString("en-US")+" ต่อกลุ่ม)"; bad=true; }
  else if(cls==="Inferior"){ m="<b>Inferior</b> ยาใหม่แย่กว่าเกิน margin ไม่ควรใช้แทนยาเดิม"; bad=true; }
  else if(cls==="Non-inferior, but worse"){ m="<b>Non-inferior แต่แย่กว่าอย่างมีนัยสำคัญ</b> ใช้เมื่อข้อดีอื่นคุ้มกับความแย่ที่เพิ่ม "+dd.toFixed(1)+"% และตรวจว่า margin สมเหตุสมผล"; }
  else if(cls==="Superior") m="<b>Superior</b> ทดสอบ superiority ได้ถ้ากำหนด hierarchy ไว้ล่วงหน้า ตรวจผล per-protocol ให้สอดคล้อง";

  act(m,bad);
}
/* ---------- Subgroup ---------- */
function rng(seed){ var s=seed%2147483647; if(s<=0) s+=2147483646; return function(){ s=s*16807%2147483647; return (s-1)/2147483646; }; }
function gauss(r){ var u=Math.max(1e-9,r()), v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function sg(){
  var hr=C.shr.get(), n=C.sn.get(), rate=C.rate.get()/100, het=C.het.get(), r=rng(SEED*131+17);
  var defs=[["Diabetes","Yes",0.45,"dm1"],["Diabetes","No",0.55,"dm0"],["eGFR","< 45",0.4,""],["eGFR","≥ 45",0.6,""],["Age","≥ 65",0.5,""],["Age","< 65",0.5,""]];
  var D=n*rate, se0=Math.sqrt(4/D), lhr=Math.log(hr), rows=[];
  var ob0=lhr;
  defs.forEach(function(d){ var Di=D*d[2], se=Math.sqrt(4/Di), t=lhr; if(d[3]==="dm1") t=lhr-0.55*Math.log(het); if(d[3]==="dm0") t=lhr+0.45*Math.log(het);
    var o=t+gauss(r)*se; rows.push({g:d[0],l:d[1],n:Math.round(n*d[2]),ev:Di,se:se,o:o}); });
  svg.innerHTML="";
  var X0=300,X1=500; function X(h){ var a=Math.log(0.25),b=Math.log(4); return X0+(Math.log(Math.max(0.25,Math.min(4,h)))-a)/(b-a)*(X1-X0); }
  tx(20,22,"Subgroup",{a:"start",fs:12,fw:600,fill:MUT}); tx(196,22,"n",{a:"end",fs:12,fw:600,fill:MUT}); tx(400,22,"HR (95% CI)",{fs:12,fw:600,fill:MUT}); tx(580,22,"p int",{a:"middle",fs:12,fw:600,fill:MUT});
  var y=52, minP=1, cross=0;
  for(var i=0;i<rows.length;i+=2){
    var a=rows[i], b=rows[i+1], zi=(a.o-b.o)/Math.sqrt(a.se*a.se+b.se*b.se), pint=2*(1-Phi(Math.abs(zi))); minP=Math.min(minP,pint);
    tx(20,y,a.g,{a:"start",fs:12,fw:600}); tx(580,y,pfmt(pint),{fs:11.5,mono:true,fill:pint<0.05?RED:MUT});
    y+=22;
    [a,b].forEach(function(s){ var lo=Math.exp(s.o-1.96*s.se), hi=Math.exp(s.o+1.96*s.se); if(lo<1&&hi>1) cross++;
      tx(34,y+4,s.l,{a:"start",fs:12}); tx(196,y+4,s.n.toLocaleString("en-US"),{a:"end",fs:11,mono:true,fill:MUT});
      ln(X(lo),y,X(hi),y,INK,1.6); var sz=Math.max(5,Math.min(13,Math.sqrt(s.ev)/2.2)); SV("rect",{x:X(Math.exp(s.o))-sz/2,y:y-sz/2,width:sz,height:sz,fill:INK},svg);
      tx(X1+12,y+4,Math.exp(s.o).toFixed(2)+" ("+lo.toFixed(2)+"–"+hi.toFixed(2)+")",{a:"start",fs:10.5,mono:true,fill:MUT});
      y+=24; });
    y+=8;
  }
  var w1=1/(rows[0].se*rows[0].se), w2=1/(rows[1].se*rows[1].se); ob0=(rows[0].o*w1+rows[1].o*w2)/(w1+w2); se0=Math.sqrt(1/(w1+w2));
  var olo=Math.exp(ob0-1.96*se0), ohi=Math.exp(ob0+1.96*se0);
  tx(20,y+4,"Overall",{a:"start",fs:12.5,fw:600}); tx(196,y+4,n.toLocaleString("en-US"),{a:"end",fs:11,mono:true,fill:MUT});
  SV("path",{d:"M"+X(olo)+" "+y+" L"+X(Math.exp(ob0))+" "+(y-8)+" L"+X(ohi)+" "+y+" L"+X(Math.exp(ob0))+" "+(y+8)+" Z",fill:ACC},svg);
  tx(X1+12,y+4,Math.exp(ob0).toFixed(2)+" ("+olo.toFixed(2)+"–"+ohi.toFixed(2)+")",{a:"start",fs:10.5,mono:true,fill:ACC});
  ln(X(1),36,X(1),y+14,MUT,1.2); ln(X(Math.exp(ob0)),36,X(Math.exp(ob0)),y+14,ACC,1,"4 4");
  var ay=y+30; ln(X0,ay,X1,ay,MUT);
  [0.25,0.5,1,2,4].forEach(function(h){ ln(X(h),ay,X(h),ay+5,MUT); tx(X(h),ay+18,String(h),{fs:10.5,mono:true,fill:MUT}); });
  tx(X(1)-6,ay+36,"Favors treatment",{a:"end",fs:11,fill:TEAL}); tx(X(1)+6,ay+36,"Favors control",{a:"start",fs:11,fill:RED});

  setRO(1,"Overall HR (95% CI)",Math.exp(ob0).toFixed(2)+" ("+olo.toFixed(2)+"–"+ohi.toFixed(2)+")",ohi<1?"ok":null);
  setRO(2,"Events รวม",Math.round(D).toLocaleString("en-US"),null);
  setRO(3,"Subgroup ที่ CI คร่อม 1",cross+" ใน 6",cross>0?"flag":null);
  setRO(4,"p interaction ต่ำสุด",pfmt(minP),minP<0.05?"flag":"ok");
  setRO(5,"True interaction",het<1.05?"ไม่มี":"x"+het.toFixed(2),null);

  document.getElementById("steps").innerHTML='<ol class="steps"><li><b>SE(ln HR) ของ subgroup ≈ √(4/events)</b> subgroup ที่เล็กจึงมี CI กว้าง</li><li><b>Test for interaction: z = (ln HR₁ − ln HR₂)/√(SE₁² + SE₂²)</b> แล้วแปลงเป็น p</li><li><b>อย่าเทียบ</b> ว่า subgroup หนึ่ง significant อีก subgroup ไม่ significant</li></ol>';
  var m,bad=false;

  else if(minP<0.05){ m="<b>p interaction < 0.05 แต่ไม่มี interaction จริง</b> เป็นผลจากการดูหลาย subgroup (false positive) ใช้ผล overall"; bad=true; }
  else if(cross>0){ m="<b>บาง subgroup CI คร่อม 1</b> แต่ p interaction ไม่ significant ไม่ใช่หลักฐานว่า subgroup นั้นไม่ได้ประโยชน์ ใช้ผล overall"; bad=true; }
  else m="<b>ผลสม่ำเสมอทุก subgroup</b> ใช้ผล overall กับผู้ป่วยทุกกลุ่ม ลองลด n หรือกดสุ่มใหม่เพื่อดูความแกว่งของ subgroup";
  act(m,bad);
}
