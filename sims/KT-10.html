<body>
<main class="sim" id="sim">
  <section class="bench">
    <div class="card">
      <h2 id="vt">Anti-A/B titer ก่อนและหลังปลูกถ่าย</h2>
      <div id="chart"></div>
      <div id="live"></div>
      <p class="hint no-present" id="vh"></p>
    </div>
    <div class="card">
      <div class="mode" id="mode"><button type="button" data-m="abo" aria-pressed="true">ABO-incompatible</button><button type="button" data-m="hla" aria-pressed="false">HLA-incompatible</button></div>
      <div class="ctls" id="ctls"></div>
      <div class="sel"><label for="sMod">Apheresis</label><select id="sMod"><option value="plex">Plasma exchange</option><option value="dfpp">Double-filtration plasmapheresis</option><option value="ia">Antigen-specific immunoadsorption</option></select></div>
      <div class="tools" id="tools"></div>
      <div class="readout">
        <div class="ro" id="r1"><b>-</b><span id="l1">Day 0</span></div>
        <div class="ro" id="r2"><b>-</b><span id="l2">เป้า</span></div>
        <div class="ro" id="r3"><b>-</b><span id="l3">Sessions</span></div>
        <div class="ro" id="r4"><b>-</b><span id="l4">Peak หลังผ่าตัด</span></div>
        <div class="ro" id="r5"><b>-</b><span id="l5">AMR risk</span></div>
        <div class="ro" id="r6"><b>-</b><span id="l6">Infection risk</span></div>
      </div>
      <div class="act" id="act"></div>
    </div>
  </section>
</main>
<script src="../core/shell.js"></script>
<script src="../core/plot.js"></script>
<script src="../core/live.js"></script>
<script>
(function(){
"use strict";
function D(o){ var d = {mode:"abo", t0:7, n:4, mod:"plex", rtx:true, ivig:true, tgt:3, mfi:6000, iml:false, hdivig:false}; Object.keys(o).forEach(function(k){ d[k] = o[k]; }); return d; }
var S = {
  abo:{name:"ABOi titer 1:128", p:D({mode:"abo", t0:7, n:4, mod:"plex", rtx:true, ivig:true, tgt:3}),
    rows:[["Pair","ผู้รับ group O donor group A titer anti-A IgG 1:128"],["Protocol","Rituximab วันที่ −14, PLEX 4 ครั้งวันเว้นวัน, IVIG หลัง session สุดท้าย"],["Target","Titer ≤ 1:8 ในวันผ่าตัด"],["หลังผ่าตัด","ตรวจ titer ทุกวันใน 2 สัปดาห์แรก"]],
    take:["แต่ละ session ของ PLEX ลด titer ราว 1 dilution step","Rituximab ลดการสร้าง antibody และ rebound หลังผ่าตัด","หลัง 2 สัปดาห์เกิด accommodation แม้ titer จะกลับขึ้น"]},
  abohi:{name:"ABOi titer 1:1024", p:D({mode:"abo", t0:10, n:5, mod:"plex", rtx:true, ivig:true, tgt:3}),
    rows:[["Pair","Titer เริ่มต้น 1:1024"],["Protocol","PLEX 5 ครั้งไม่พอ"],["Day 0","Titer ยังเกินเป้า"],["ทางเลือก","เพิ่ม session, ใช้ immunoadsorption หรือ paired exchange"]],
    take:["Titer สูงมากต้องใช้หลาย session และเสี่ยง AMR มากขึ้น","Antigen-specific immunoadsorption ลด titer ต่อ session ได้มากกว่า","ถ้า titer ไม่ถึงเป้าไม่ควรผ่าตัด"]},
  aborx:{name:"ไม่ให้ rituximab", p:D({mode:"abo", t0:7, n:5, mod:"plex", rtx:false, ivig:true, tgt:3}),
    rows:[["Protocol","PLEX 5 ครั้งโดยไม่มี rituximab"],["Day 0","ยังเกินเป้าเพราะ antibody ถูกสร้างใหม่ระหว่าง session"],["หลังผ่าตัด","Titer rebound เร็วในสัปดาห์แรก"],["ผล","เสี่ยง AMR ช่วง accommodation"]],
    take:["ไม่มี rituximab การสร้าง antibody ใหม่ทำให้ลด titer ให้ถึงเป้ายากขึ้น","Rebound หลังผ่าตัดเกิดจากการกระตุ้น B cell ด้วย antigen ของ graft","Rituximab ก่อนผ่าตัด 2–4 สัปดาห์ลดทั้งการสร้างและ rebound"]},
  aboia:{name:"Immunoadsorption", p:D({mode:"abo", t0:8, n:4, mod:"ia", rtx:true, ivig:false, tgt:3}),
    rows:[["Protocol","Antigen-specific immunoadsorption 4 ครั้ง"],["ข้อดี","ลบเฉพาะ anti-A/B ไม่ต้องใช้ plasma ทดแทน"],["Day 0","ถึงเป้าได้แม้ titer ปานกลาง"],["ข้อจำกัด","ราคาและการเข้าถึง"]],
    take:["Immunoadsorption ไม่ทำให้ coagulation factor และ IgG อื่นลดลง","ลด titer ต่อ session ได้มากกว่า PLEX","ไม่ต้องให้ IVIG ทดแทน"]},
  hla:{name:"HLAi: DSA 6,000", p:D({mode:"hla", mfi:6000, n:5, mod:"plex", rtx:true, ivig:true}),
    rows:[["Recipient","DSA anti-B62 MFI 6,000 FCXM บวก CDC ลบ"],["Protocol","PLEX + IVIG 100 mg/kg หลังทุก session + rituximab"],["Target","FCXM ลบหรือ MFI ต่ำกว่าราว 3,000"],["หลังผ่าตัด","DSA rebound สัปดาห์ที่ 1–2 เสี่ยง ABMR"]],
    take:["HLA-incompatible ทำได้แต่ ABMR สูงกว่าการปลูกถ่ายที่ compatible","ตั้งเป้าให้ crossmatch ลบในวันผ่าตัด","ถ้ามี donor ที่ compatible จาก paired exchange ควรเลือกก่อน"]},
  hlahi:{name:"HLAi: DSA 15,000", p:D({mode:"hla", mfi:15000, n:5, mod:"plex", rtx:true, ivig:true}),
    rows:[["Recipient","DSA MFI 15,000 CDC บวก"],["Protocol","PLEX 5 ครั้ง"],["Day 0","MFI ยังสูง crossmatch ยังบวก"],["ทางเลือก","Imlifidase หรือ paired exchange"]],
    take:["DSA สูงมากลดด้วย PLEX ได้ยาก","Imlifidase ตัด IgG ทั้งหมดภายในไม่กี่ชั่วโมง แต่ rebound ในวันถึงสัปดาห์","ต้องมีแผนรับมือ rebound หลังผ่าตัด"]},
  iml:{name:"Imlifidase", p:D({mode:"hla", mfi:15000, n:0, mod:"plex", rtx:true, ivig:false, iml:true}),
    rows:[["Recipient","Highly sensitized crossmatch บวกกับ deceased donor"],["Protocol","Imlifidase ก่อนผ่าตัด แล้วตรวจ crossmatch ซ้ำ"],["หลังผ่าตัด","IgG กลับขึ้นวันที่ 3–14 ต้องมี PLEX, IVIG, rituximab ตามมา"],["หมายเหตุ","IVIG และ ATG ต้องให้หลัง imlifidase หมดฤทธิ์ เพราะถูกตัดด้วย"]],
    take:["Imlifidase (IdeS) ตัด IgG ทำให้ crossmatch ลบได้ภายใน 6 ชม.","ให้ IVIG, ATG หรือ rituximab หลัง imlifidase ไม่งั้นยาถูกตัดไปด้วย","DSA rebound หลังผ่าตัดยังทำให้เกิด ABMR ได้"]}
};
var ORDER = ["abo","abohi","aborx","aboia","hla","hlahi","iml"];
var MODE = "abo", C = {}, F = {}, TG = {};
function sl(k, o){ o.id = "s" + k; o.onInput = function(){ update(true); }; C[k] = Sim.slider(o); document.getElementById("ctls").appendChild(C[k].el); }
sl("t0", {label:"Titer เริ่มต้น", min:3, max:11, step:1, value:7, unit:"", fmt:function(v){ return "1:" + Math.pow(2, v); }});
sl("mfi", {label:"DSA MFI เริ่มต้น", min:1000, max:20000, step:500, value:6000, unit:"", fmt:function(v){ return v.toLocaleString("en-US"); }});
sl("n", {label:"จำนวน session", min:0, max:10, step:1, value:4, unit:""});
sl("tgt", {label:"เป้า titer วันผ่าตัด", min:2, max:5, step:1, value:3, unit:"", fmt:function(v){ return "≤ 1:" + Math.pow(2, v); }});
var sMod = document.getElementById("sMod"); sMod.addEventListener("change", function(){ update(); });
[["rtx","Rituximab วันที่ −14"],["ivig","IVIG"],["iml","Imlifidase วันที่ 0"]].forEach(function(x){ F[x[0]] = false; TG[x[0]] = Sim.toggle(x[1], function(on){ F[x[0]] = on; update(); }, false); document.getElementById("tools").appendChild(TG[x[0]]); });
var mb = document.querySelectorAll("#mode button");
function setMode(m){ MODE = m; mb.forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.m === m ? "true" : "false"); });
  C.t0.el.classList.toggle("hide", m !== "abo"); C.tgt.el.classList.toggle("hide", m !== "abo"); C.mfi.el.classList.toggle("hide", m !== "hla"); TG.iml.classList.toggle("hide", m !== "hla");
  sMod.querySelector('option[value="ia"]').textContent = m === "abo" ? "Antigen-specific immunoadsorption" : "Protein A immunoadsorption"; }
mb.forEach(function(b){ b.addEventListener("click", function(){ setMode(b.dataset.m); update(); }); });

/* ---------- model ---------- */
var T0 = -28, T1 = 21, DT = 0.05;
function simulate(p){
  var abo = MODE === "abo";
  var start = abo ? Math.pow(2, p.t0) : p.mfi / (25000 - p.mfi);
  var fiv = abo ? 0.7 : 0.45; // intravascular fraction (IgM-rich isoagglutinin vs IgG)
  var rem = {plex:0.72, dfpp:0.62, ia:0.88}[p.mod];
  var kel = abo ? 0.03 : 0.033;
  var Ip = start * fiv, Ex = start * (1 - fiv), P0 = kel * start;
  var sess = []; for(var i = 0; i < p.n; i++) sess.push(-1 - 2 * i);
  var rtxDay = -14, out = [], marks = [], d0 = null, peakPost = 0, peakDay = 0;
  var ivigDone = false, imlT = 0;
  for(var it = 0; it <= (T1 - T0) / DT; it++){
    var t = T0 + it * DT;
    var supp = p.rtx && t >= rtxDay + 3 ? 0.12 + 0.88 * Math.exp(-(t - rtxDay - 3) / 4) : 1;
    var stim = t >= 0 ? (t < 3 ? 1 : 1 + (abo ? 2.5 : 3) * Math.exp(-(t - 6) * (t - 6) / 30)) : 1;
    var prod = P0 * supp * stim * (abo && t > 14 ? 1 : 1);
    var tot = Ip + Ex, eq = tot * fiv;
    Ip += ((eq - Ip) / 1.2 + prod * fiv - kel * Ip) * DT;
    Ex += ((tot * (1 - fiv) - Ex) / 1.2 + prod * (1 - fiv) - kel * Ex) * DT;
    sess.forEach(function(sd){ if(Math.abs(t - sd) < DT / 2){ Ip *= (1 - rem); marks.push(sd); } });
    if(p.ivig && !ivigDone && t >= (p.n ? -0.9 : -1)){ ivigDone = true; Ip *= abo ? 0.92 : 0.85; Ex *= abo ? 0.95 : 0.9; }
    if(!abo && p.iml && Math.abs(t - (-0.25)) < DT / 2){ Ip *= 0.04; Ex *= 0.3; imlT = t; }
    var meas = abo ? Ip / fiv : 25000 * (Ip / fiv) / (Ip / fiv + 1);
    if(Math.abs(t) < DT / 2) d0 = meas;
    if(t > 0.5 && meas > peakPost){ peakPost = meas; peakDay = t; }
    if(it % 4 === 0) out.push([+t.toFixed(2), abo ? Math.log2(Math.max(1, meas)) : meas]);
  }
  return {out:out, d0:d0, peakPost:peakPost, peakDay:peakDay, sess:sess, start:abo ? start : p.mfi};
}
function titreTxt(v){ var e = Math.max(0, Math.round(Math.log2(Math.max(1, v)))); return e === 0 ? "< 1:2" : "1:" + Math.pow(2, e); }

/* ---------- chart ---------- */
var A = Plot.colors;
var chart = Plot.chart(document.getElementById("chart"), {height:Sim.present ? 380 : 320, aria:"Antibody level before and after transplant during desensitization",
  x:{min:T0, max:T1, step:7, label:"Days relative to transplant"}, y:{min:0, max:11, step:1, label:"Anti-A/B IgG titer (log2)"},
  series:[{id:"ab", name:"Antibody", color:A.accent, data:[], width:2.6}], legend:false});
var live = Live.player(chart, {mount:"live"}), LAST = null;
function P(){ var p = {}; Object.keys(C).forEach(function(k){ p[k] = C[k].get(); }); Object.keys(F).forEach(function(k){ p[k] = F[k]; }); p.mod = sMod.value; return p; }
function update(deb){
  var p = P(), R = simulate(p), abo = MODE === "abo";
  var base = [{x:0, label:"Transplant"}].concat(p.rtx ? [{x:-14, label:"RTX"}] : []);
  if(abo){
    var tg = Math.pow(2, p.tgt);
    chart.update({y:{min:0, max:11, step:1, label:"Anti-A/B IgG titer", fmt:function(v){ return v < 1 ? "0" : "1:" + Math.pow(2, Math.round(v)); }}, hlines:[{y:p.tgt, label:"Target 1:" + tg, color:A.teal, dash:[4,3]}],
      bands:[{y0:0, y1:p.tgt, color:"rgba(31,122,114,.08)"}], xbands:[{x0:0, x1:14, label:"Accommodation window", color:"rgba(180,35,42,.06)"}]});
    document.getElementById("vt").textContent = "Anti-A/B titer ก่อนและหลังปลูกถ่าย";
    document.getElementById("vh").textContent = "แกนตั้งเป็น log2 ของ titer แต่ละ session ของ apheresis ลด titer แบบขั้นบันได แล้ว rebound บางส่วนจาก antibody นอกหลอดเลือดและการสร้างใหม่ แถบแดงอ่อนคือ 2 สัปดาห์แรกหลังผ่าตัดที่ titer rebound เสี่ยง AMR ก่อน accommodation";
  } else {
    var ymax = Math.max(12000, Math.ceil(R.start * 1.6 / 2000) * 2000);
    chart.update({y:{min:0, max:ymax, step:ymax > 20000 ? 5000 : 2000, label:"DSA MFI", fmt:function(v){ return v >= 1000 ? (v / 1000) + "k" : v; }}, hlines:[{y:10000, label:"Often CDC positive", color:A.red, dash:[4,3]},{y:3000, label:"Often FCXM positive", color:A.gold, dash:[4,3]}],
      bands:[], xbands:[{x0:0, x1:14, label:"Rebound window", color:"rgba(180,35,42,.06)"}]});
    document.getElementById("vt").textContent = "DSA MFI ก่อนและหลังปลูกถ่าย";
    document.getElementById("vh").textContent = "MFI ลดลงทีละ session ของ PLEX และกลับขึ้นจาก IgG นอกหลอดเลือด (IgG อยู่นอกหลอดเลือดราว 55%) imlifidase ตัด IgG ทันทีแต่ rebound ภายใน 1–2 สัปดาห์ เส้นประคือระดับ MFI ที่มักทำให้ crossmatch บวก (ขึ้นกับ lab)";
  }
  chart.setSeries("ab", R.out);
  var ev = [];
  if(p.rtx) ev.push({t:-14, kind:"rx", text:"Rituximab 200–375 mg/m²"});
  R.sess.slice().reverse().forEach(function(sd, i){ ev.push({t:sd, kind:"rx", text:(sMod.options[sMod.selectedIndex].textContent) + " ครั้งที่ " + (i + 1)}); });
  if(p.ivig) ev.push({t:-0.9, kind:"rx", text:"IVIG"});
  if(!abo && p.iml) ev.push({t:-0.25, kind:"rx", text:"Imlifidase: IgG ถูกตัด crossmatch ลบใน 6 ชม."});
  var d0 = R.d0, ok, risk, n = [], bad = false;
  if(abo){
    ok = d0 <= Math.pow(2, p.tgt) * 1.41;
    ev.push({t:0, kind:ok ? "ok" : "warn", text:"วันผ่าตัด titer " + titreTxt(d0) + (ok ? " ถึงเป้า" : " ยังเกินเป้า")});
    var pk = Math.log2(Math.max(1, R.peakPost));
    risk = !ok ? "High" : pk >= 6 ? "High" : pk >= 4.5 ? "Moderate" : "Low";
    if(pk >= 4) ev.push({t:R.peakDay, kind:"warn", text:"Titer rebound " + titreTxt(R.peakPost) + " หลังผ่าตัด"});
    if(!ok){ bad = true; n.push("Titer วันผ่าตัดยังเกินเป้า เลื่อนผ่าตัดและเพิ่ม session หรือเปลี่ยนเป็น immunoadsorption ถ้า titer สูงมากพิจารณา paired kidney exchange"); }
    else n.push("ผ่าตัดได้ ตรวจ titer ทุกวันหรือวันเว้นวันใน 2 สัปดาห์แรก ถ้า titer ขึ้นเกินราว 1:16–1:32 ร่วม Cr ขึ้นให้ PLEX และ biopsy");
    if(!p.rtx) n.push("ไม่มี rituximab rebound หลังผ่าตัดสูง พิจารณาให้ rituximab ก่อนผ่าตัด 2–4 สัปดาห์");
  } else {
    ok = d0 < 3000;
    var xm = d0 >= 10000 ? "CDC positive" : d0 >= 3000 ? "FCXM positive" : "Crossmatch negative";
    ev.push({t:0, kind:ok ? "ok" : "warn", text:"วันผ่าตัด MFI " + Math.round(d0).toLocaleString("en-US") + " (" + xm + ")"});
    risk = d0 >= 3000 ? "High" : R.peakPost >= 5000 ? "High" : R.peakPost >= 2500 ? "Moderate" : "Low";
    if(R.peakPost >= 3000) ev.push({t:R.peakDay, kind:"warn", text:"DSA rebound MFI " + Math.round(R.peakPost).toLocaleString("en-US")});
    if(!ok){ bad = true; n.push(d0 >= 10000 ? "Crossmatch ยังบวกแบบ CDC ห้ามผ่าตัด พิจารณา imlifidase หรือ paired exchange" : "FCXM ยังบวก เพิ่ม session หรือเลือก donor อื่น ถ้าผ่าตัดต้องยอมรับ ABMR risk สูงมาก"); }
    else n.push("Crossmatch ลบในวันผ่าตัด ให้ ATG induction, IVIG และติดตาม DSA ทุก 1–2 วันในสัปดาห์แรก biopsy เมื่อ Cr ขึ้น");
    if(p.iml) n.push("ระยะห่างหลัง imlifidase: IVIG ≥ 12 ชม., rituximab หรือ basiliximab ≥ 4 วัน, rabbit ATG ≥ 1 สัปดาห์ (equine ATG ให้พร้อมกันได้) เตรียม PLEX + IVIG สำหรับ rebound");
  }
  var inf = (p.rtx ? 1 : 0) + p.n * 0.25 + (p.iml ? 1 : 0) + (MODE === "hla" ? 1 : 0);
  LAST = {p:p, R:R, ok:ok, risk:risk, inf:inf, abo:abo, act:"<b>Next step:</b> " + n.join(" "), bad:bad};
  live.load({tMin:T0, tMax:T1, unit:"วัน", ms:7000, debounce:deb === true, num:function(x){ return x.toFixed(1); }, events:ev.sort(function(a, b){ return a.t - b.t; }), onFrame:onFrame, baseVlines:base,
    cursorLabel:function(t){ return "Day " + (t >= 0 ? "+" : "") + t.toFixed(0); }});
}
function onFrame(t, done){
  var M = LAST, R = M.R, abo = M.abo;
  document.getElementById("l1").textContent = abo ? "Titer วันผ่าตัด" : "MFI วันผ่าตัด";
  document.getElementById("l2").textContent = abo ? "ถึงเป้า" : "Crossmatch วันผ่าตัด";
  document.getElementById("l4").textContent = abo ? "Peak titer หลังผ่าตัด" : "Peak MFI หลังผ่าตัด";
  var past0 = t >= 0;
  Sim.ro("r1", past0 ? (abo ? titreTxt(R.d0) : Math.round(R.d0).toLocaleString("en-US")) : "…", past0 ? (M.ok ? "ok" : "flag") : null);
  Sim.ro("r2", past0 ? (abo ? (M.ok ? "ใช่" : "ไม่") : (R.d0 >= 10000 ? "CDC+" : R.d0 >= 3000 ? "FCXM+" : "Neg")) : "…", past0 ? (M.ok ? "ok" : "flag") : null);
