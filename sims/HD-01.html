<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[HD-01] AV Access PE and Doppler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../core/core.css">
<style>
/* HD-01 page-specific styles only. Shared layout comes from core/core.css */
svg#circ{min-width:560px}
canvas#dop{width:100%;height:200px;display:block;background:#05060f;border-radius:8px}
.dopctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tog.sound[aria-pressed="true"]{background:var(--peach);border-color:#e7b56b}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}
.readout{grid-template-columns:repeat(4,1fr)}
@media (max-width:760px){.readout{grid-template-columns:repeat(2,1fr)}}
/* presentation: circuit left, Doppler right */
body.present .bench{grid-template-columns:1.35fr 1fr}
body.present svg#circ{min-width:0}
body.present canvas#dop{height:230px}
body.present .find{grid-template-columns:1fr}
body.present .find .card{display:none}
</style>
</head>
<body>
<main class="sim" id="sim">
  <section class="bench one">
    <div class="card">
      <h2 id="circTitle">Access circuit</h2>
      <div class="svgwrap">
        <svg id="circ" viewBox="0 0 900 320" role="img" aria-label="Animated access circuit">
          <defs>
            <radialGradient id="cell" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#b4232a"/></radialGradient>
          </defs>
          <g id="armShape"></g>
          <g id="vessels"></g>
          <g id="cells"></g>
          <g id="marks"></g>
          <g id="labels" font-family="IBM Plex Sans Thai, sans-serif" font-size="13" fill="#5b5b6b">
            <text x="40" y="150">Feeding artery</text>
            <text x="198" y="146" text-anchor="middle">Anastomosis</text>
            <text x="450" y="98" text-anchor="middle">Draining vein (cannulation zone)</text>
            <text x="760" y="146" text-anchor="middle">Central vein</text>
            <text x="862" y="214" text-anchor="middle">Heart</text>
            <text x="92" y="306" text-anchor="middle">Hand</text>
          </g>
          <g id="hud" font-family="IBM Plex Sans Thai, sans-serif"></g>
        </svg>
      </div>
      <div class="tools">
        <button class="tog" type="button" id="tElev" aria-pressed="false">ยกแขน 90° (arm elevation)</button>
        <button class="tog" type="button" id="tAug" aria-pressed="false">กด vein เหนือ anastomosis (augmentation)</button>
        <button class="tog" type="button" id="tOcc" aria-pressed="false">กด access ทั้งเส้น (occlusion)</button>
        <button class="tog sound no-present" type="button" id="tSnd" aria-pressed="false">ฟัง bruit</button>
      </div>
      <div class="key">
        <span><i class="sw" style="background:#b4232a"></i>stenosis / clot</span>
        <span><i class="sw" style="background:#FFDE59"></i>thrill (สั่นตลอด = continuous, สั่นเป็นจังหวะ = systolic only)</span>
        <span><i class="sw" style="background:#7fb1d6"></i>segment ตึง pulsatile</span>
      </div>
      <p class="hint secondary" id="maneuverNote">กดปุ่มด้านบนเพื่อทำ maneuver ผลจะแสดงทั้งในภาพและตารางด้านล่าง</p>
    </div>

    <div class="card">
      <h2>Spectral Doppler</h2>
      <div class="dopctl">
        <label for="site">Sample volume ที่</label>
        <select id="site"></select>
      </div>
      <canvas id="dop" width="1100" height="240" aria-label="Spectral Doppler waveform"></canvas>
      <div class="readout">
        <div class="ro" id="roPSV"><b>-</b><span>PSV (cm/s)</span></div>
        <div class="ro" id="roEDV"><b>-</b><span>EDV (cm/s)</span></div>
        <div class="ro" id="roQa"><b>-</b><span>Qa brachial (mL/min)</span></div>
        <div class="ro" id="roPSR"><b>-</b><span>PSV ratio</span></div>
      </div>
      <p class="hint secondary" id="dopNote"></p>
    </div>
  </section>
</main>

<script src="../core/shell.js"></script>

function pulse(ph){return ph<.32? Math.sin(Math.PI*ph/.32):0;}

function width(key,ph){
  var s=S[cur];var base=s.seg[key]||10;var a=(s.amp[key]||0);
  var col=(s.collapse[key]!==undefined)?s.collapse[key]:1;
  var w=base;
  if(st.elev && !s.graft && key!=="art"){ w = base*col; }
  if(st.occ && key!=="art" && !s.accessory){ w = base*1.05; a = (s.clot?0:0.2); }
  if(st.aug && (key==="jux")){ var g={strong:.35,weak:.05,na:.18,none:0}[s.aug]; a = g; w = base*(s.aug==="weak"?1:1.15); }
  if(st.aug && (key==="v1"||key==="v2"||key==="c")){ w=base*0.6; a=0.01; }

}

function wave(sh,psv,edv,ph){
  switch(sh){
    case "low": return ph<.12? edv+(psv-edv)*(ph/.12) : ph<.3? psv-(psv-edv)*0.45*((ph-.12)/.18) : edv+(psv-edv)*0.55*Math.exp(-(ph-.3)*4);
    case "high": return ph<.1? edv+(psv-edv)*(ph/.1) : ph<.25? psv-(psv-edv)*((ph-.1)/.15)*0.9 : edv+ (psv-edv)*0.1*Math.exp(-(ph-.25)*6);
    case "tardus": var r=ph<.28? Math.sin(Math.PI/2*ph/.28) : Math.exp(-(ph-.28)*2.2); return edv+(psv-edv)*r;
    case "jet": return ph<.1? edv+(psv-edv)*(ph/.1) : edv+(psv-edv)*Math.exp(-(ph-.1)*3.2);
    case "vein": return edv+(psv-edv)*0.5*(1+Math.sin(2*Math.PI*ph-1.2));
    case "retro": return ph<.12? edv+(psv-edv)*(ph/.12) : edv+(psv-edv)*Math.exp(-(ph-.12)*4);
    case "tri": if(ph<.1)return psv*(ph/.1); if(ph<.2)return psv*(1-(ph-.1)/.1); if(ph<.3)return edv*Math.sin(Math.PI*(ph-.2)/.1); if(ph<.42)return 12*Math.sin(Math.PI*(ph-.3)/.12); return 0;
    case "none": return 0;
  }

}

    else if(k==="radial") o={psv:60,edv:-8,sh:"tri"};
    else o={psv:0,edv:0,sh:"none"};
  }
  return o;
}
var dopX=0, lastT=0;
function drawDoppler(now){
  var W=cv.width,H=cv.height,base=H*0.62,scale=(H*0.55)/520;
  var dt = lastT? (now-lastT):16; lastT=now;
  var step = Math.min(200, Math.max(1, Math.round(dt/1000*160*(reduce?.4:1))));
  var o=siteParams();
  for(var i=0;i<step;i++){
    var tt = now - (step-i)*(1000/160);
    var ph=phase(tt-t0); var v=wave(o.sh,o.psv,o.edv,ph);
    var x=dopX;
    cx.fillStyle="#05060f"; cx.fillRect(x,0,3,H);
    cx.fillStyle="rgba(255,255,255,0.10)"; for(var g=-100;g<=500;g+=100){cx.fillRect(x,base-g*scale,1,1);}
    cx.fillStyle="rgba(255,255,255,0.55)"; cx.fillRect(x,base,1,1);
    if(o.sh!=="none"){
      var broad = (o.sh==="jet")? 0.95 : (o.sh==="vein"?0.5:0.35);
      var top=base-v*scale, inner=base-v*(1-broad)*scale;
      var y1=Math.min(top,inner), y2=Math.max(top,inner);
      if(o.sh!=="jet" && v>0){ y2 = base - v*(1-broad)*scale; }
      for(var y=y1;y<=y2;y+=1){ var a = 0.35+0.65*Math.random(); var hot=(o.sh==="jet")? "255,"+(180+Math.floor(Math.random()*60))+",80" : "200,230,255"; cx.fillStyle="rgba("+hot+","+a.toFixed(2)+")"; cx.fillRect(x,y,1,1); }
      cx.fillStyle="#ffffff"; cx.fillRect(x,top,1,1.5);
      if(o.sh==="jet"){ for(var n=0;n<3;n++){cx.fillStyle="rgba(255,120,120,"+(Math.random()*.6).toFixed(2)+")";cx.fillRect(x, base-Math.random()*v*scale,1,1);} }
    }
    dopX=(dopX+1)%W;
  }
  cx.fillStyle="#05060f";cx.fillRect(dopX+1,0,10,H);
  cx.fillStyle="#FFDE59";cx.fillRect(dopX,0,1,H);
  cx.fillStyle="#05060f";cx.fillRect(0,0,46,H);
  cx.fillStyle="rgba(255,255,255,0.75)";cx.font="12px Geist Mono, monospace";
  [-100,0,100,200,300,400,500].forEach(function(g){cx.fillText(String(g),4,base-g*scale+4);});
}
function updateReadout(){
  var s=S[cur], o=siteParams(), k=siteSel.value;
  Sim.ro("roPSV", o.sh==="none"?"0":String(o.psv), o.psv>=400);
  Sim.ro("roEDV", o.sh==="none"?"0":String(o.edv), o.edv<0);
  var qa = (st.occ&&!s.accessory)?0:s.qa;
  Sim.ro("roQa", Sim.fmt(qa), qa<500 || qa>1500);
  var psr="-";
  if(s.sites.lesion && s.sites.pre && !(st.occ&&!s.accessory)){psr=(s.sites.lesion.psv/s.sites.pre.psv).toFixed(1);}
  Sim.ro("roPSR", psr, psr!=="-" && parseFloat(psr)>2);
  var notes = {
    brach:"Brachial artery ใช้วัด Qa เพราะเกือบทั้งหมดของ flow ไหลเข้า access และเส้นตรง laminar",
    pre:"ใช้เป็นตัวหารของ PSV ratio (PSV ตรง lesion / PSV upstream 2 cm)",
    lesion:"Jet: PSV สูง spectral broadening และ aliasing PSR > 2 ถึง 3 ร่วมกับ diameter reduction > 50% = significant",
    vein:"Venous flow ใน access เป็น pulsatile turbulent ไม่ใช้วัด Qa",
    branch:"Flow ส่วนหนึ่งเลี้ยวเข้า accessory branch",
    radial:"Distal radial: ปกติ antegrade ใน steal จะ retrograde (อยู่ใต้ baseline) และกลับ antegrade เมื่อกด access แต่ retrograde flow อย่างเดียวพบได้บ่อยใน access ที่ไม่มีอาการ (physiologic steal) การวินิจฉัย steal syndrome ต้องมีอาการ ischemia ร่วม"
  };
  var extra = "";
  if(st.occ && !s.accessory) extra=" | ขณะกด access: brachial กลับเป็น high-resistance triphasic";
  if(cur==="thrombosis") extra=" | thrombosed: brachial high-resistance triphasic ไม่มี flow ใน access";
  document.getElementById("dopNote").textContent=(notes[k]||"")+extra;
}

// ---------- sound (synthesised bruit) ----------
var ac=null, src=null, filt=null, gain=null, sndTimer=null;
function startSound(){
  try{
    var s=S[cur];
    if(!ac){ var AC=window.AudioContext||window.webkitAudioContext; ac=new AC(); }
    if(ac.state==="suspended") ac.resume();
    stopNodes();
    if(!s.bruit || (st.occ && !s.accessory)) return;
    var len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    filt=ac.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=s.bruit.f; filt.Q.value=s.bruit.sys?6:2.5;
    gain=ac.createGain(); gain.gain.value=0;
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination); src.start();
    var per=60/HR;
    var beat = function(){ if(!gain) return; var t=ac.currentTime; gain.gain.cancelScheduledValues(t);
      var peak = s.bruit.sys?0.9:0.7, floor = s.bruit.sys?0.0:0.35;
      gain.gain.setValueAtTime(floor,t); gain.gain.linearRampToValueAtTime(peak,t+0.08); gain.gain.linearRampToValueAtTime(floor,t+per*0.4); gain.gain.setValueAtTime(floor,t+per*0.99);
    };
    beat(); sndTimer=setInterval(beat, per*1000);
  }catch(e){ document.getElementById("maneuverNote").textContent="เบราว์เซอร์นี้เล่นเสียงไม่ได้ ดู thrill marker แทน"; }
}
function stopNodes(){ if(sndTimer){clearInterval(sndTimer);sndTimer=null;} try{ if(src){src.stop();src.disconnect();} }catch(e){} src=null; filt=null; if(gain){try{gain.disconnect();}catch(e){}} gain=null; }
function stopSound(){ stopNodes(); }

Sim.mount({
  code:"HD-01", title:"AV Access PE and Doppler",
  lead:"เลือก lesion แล้วลองยกแขน กด augmentation กด access หรือฟัง bruit ดูว่า pulse, thrill และ Doppler waveform เปลี่ยนอย่างไร",
  scenarios:S, order:ORDER, captureMs:7300,
  onChange:function(k,s){
    cur=k; hudKey="";
    document.getElementById("circTitle").textContent="Access circuit: "+s.name;
    buildVessels(); fillSites(); dopX=0; cx.fillStyle="#05060f"; cx.fillRect(0,0,cv.width,cv.height); updateReadout(); updateNote();
    if(st.snd) startSound();
  },
  refs:[
    "Lok CE, Huber TS, Lee T, et al. KDOQI Clinical Practice Guideline for Vascular Access: 2019 Update. Am J Kidney Dis 2020, 75(4 Suppl 2): S1-S164",
    "Asif A, Leon C, Orozco-Vargas LC, et al. Accuracy of physical examination in the detection of arteriovenous fistula stenosis. Clin J Am Soc Nephrol 2007, 2(6): 1191-4",
    "Malik J, Lomonte C, Meola M, et al. The role of Doppler ultrasonography in vascular access surveillance: controversies continue. J Vasc Access 2021, 22(1 Suppl): 63-70",
    "Haskal ZJ, Trerotola S, Dolmatch B, et al. Stent graft versus balloon angioplasty for failing dialysis-access grafts (FLAIR). N Engl J Med 2010, 362(6): 494-503",
    "Dixon BS, Beck GJ, Vazquez MA, et al. Effect of dipyridamole plus aspirin on hemodialysis graft patency (DAC). N Engl J Med 2009, 360(21): 2191-201"
  ],
  note:"ค่า PSV, EDV และ Qa ในหน้านี้เป็นค่าตัวอย่างเพื่อการสอน cut-off ที่ใช้จริง: Qa < 500 mL/min (AVF) หรือ < 600 (AVG), Qa ลด > 25%, diameter reduction > 50% ร่วมกับ PSV ratio > 2 ถึง 3, high flow > 1,500 ถึง 2,000 mL/min หรือ Qa/CO > 0.3"
});
setInterval(updateReadout, 400);
requestAnimationFrame(frame);
})();
