.sel{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px}

.tools{margin-top:12px}

  castTx:{name:"Bortezomib เร็ว + hydration", p:P({mode:"cast",flc:6000,cr0m:2.5,rx:["chemo","hyd"]}),
    rows:[["รักษา","bortezomib-based ทันทีที่สงสัย + hydration, แก้ Ca"],["ผล","FLC ลด > 60% ภายในวันที่ 21"],["ไต","มีโอกาสหลุดจาก dialysis สูงขึ้น"]],
    take:["หัวใจของการรักษาคือลด FLC เร็วด้วย bortezomib-based regimen","การลด FLC มากและเร็วในช่วง 3 สัปดาห์แรกสัมพันธ์กับการฟื้นตัวของไต","Kidney biopsy ช่วยยืนยันเมื่อ FLC ไม่สูงมากหรือสงสัย MGRS อื่น"]},
  castHco:{name:"เพิ่ม high cut-off HD", p:P({mode:"cast",flc:9000,cr0m:4.5,rx:["chemo","hyd","hco"]}),
    rows:[["เพิ่ม","HCO-HD เอา FLC ออกระหว่างฟอก"],["ผล","FLC ลดเร็วขึ้นในช่วงแรก มี rebound ระหว่างรอบ"],["หลักฐาน","ไม่ได้ผลดีชัดเจนกว่า chemotherapy อย่างเดียวในการหลุด dialysis ที่ 3 เดือน"]],

};
var ORDER=["tlsNone","tlsAllo","tlsRas","tlsAlk","tlsG6","castNo","castTx","castHco"];
var box=document.getElementById("ctls"), C={};
var ms=Sim.h("select",{id:"mode"},[Sim.h("option",{value:"tls",text:"Tumor lysis syndrome"}),Sim.h("option",{value:"cast",text:"Myeloma cast nephropathy"})]);
ms.addEventListener("change",function(){ setMode(ms.value); update(); });
box.appendChild(Sim.h("div",{class:"sel"},[Sim.h("label",{"for":"mode",text:"ภาวะ"}),ms]));

sl("burden",{label:"Tumor burden",min:1,max:3,step:1,value:2,unit:"",fmt:function(v){ return ["","low","intermediate","high"][v]; }},"tls");

sl("cr0m",{label:"Cr ตอนวินิจฉัย",min:1.2,max:8,step:0.1,value:2.5,unit:" mg/dL",fmt:function(v){ return v.toFixed(1); }},"cast");

mk(RXT,"tls"); mk(RXM,"cast");

var chart=Plot.chart(document.getElementById("chart"),{height:Sim.present?270:290,aria:"Laboratory values over time",x:{min:0,max:5,step:1,label:"Days"},y:{min:0,max:20,label:"mg/dL"},series:[],legend:true});
var live=Live.player(chart,{mount:"live"}), LAST=null;
function setMode(m){
  mode=m; ms.value=m;
  Object.keys(C).forEach(function(k){ C[k].el.classList.toggle("hide",C[k].el.dataset.grp!==m); });

  var lab=m==="tls"?["Urate สูงสุด","K สูงสุด","P สูงสุด","Ca ต่ำสุด","Cr วันที่ 5","Classification"]:["FLC ลดลงวันที่ 21","FLC วันที่ 30","Cr สูงสุด","Cr วันที่ 30","Cast risk","Dialysis independence"];

    series:[{id:"u",name:"Urate",color:A.accent,data:[],width:2.6},{id:"p",name:"Phosphate",color:A.gold,data:[],width:2.2},{id:"k",name:"K",color:A.red,data:[],width:1.8,axis:"y2",dash:[4,3]}],
    hlines:[{y:8,label:"Urate 8",color:A.accent,dash:[2,3]},{y:4.5,label:"P 4.5",color:A.gold,dash:[2,3]},{y:6,label:"K 6",color:A.red,dash:[2,3],axis:"y2"}]});
  else chart.update({x:{min:0,max:30,step:5,label:"Days"},y:{min:50,max:20000,log:true,label:"Serum FLC (mg/L)"},y2:{min:0,max:10,step:2,label:"Creatinine (mg/dL)"},
    series:[{id:"f",name:"Involved FLC",color:A.accent,data:[],width:2.6},{id:"c",name:"Cr",color:A.red,data:[],width:2,axis:"y2"}],

function tlsModel(){
  var b=C.burden.get(), cr0=C.cr0.get(), hyd=C.hyd.get();
  var allo=on("allo")||on("feb"), ras=on("ras"), alk=on("alk"), g6=on("g6pd"), hd=on("hd");
  var R={1:[0.02,0.03,0.06],2:[0.05,0.08,0.16],3:[0.12,0.16,0.26]}[b]; /* K, P, urate per hour at peak */
  var u=6.5+(b-1)*1.2, k=4.1, p=3.8, ca=9.2, gfr0=100/Math.pow(cr0,1.1), gfr=gfr0, cr=cr0, xan=0, hb=12;
  var U=[],K=[],PH=[],ev=[], umax=0,kmax=0,pmax=0,camin=99, hdOn=false, hdAt=null, hemol=false, crit={u:null,k:null,p:null,ca:null};
  var flow=Math.min(1.3,hyd/3)*(gfr0/100<0.5?0.8:1);
  if(ras&&g6){ hemol=true; }
  for(var h=0;h<=120;h++){
    var t=h/24, f=(h/30)*Math.exp(1-h/30); /* release profile peak 30 h */
    var gf=gfr/100, fl=flow*Math.max(0.3,gf*1.2);
    var prodU=R[2]*f*(allo?0.25:1)+0.01; if(allo) xan+=R[2]*f*0.75;
    if(ras){ prodU=0; u=Math.max(0.5,u*Math.exp(-0.7)); }
    u+=prodU-0.035*gf*fl*Math.max(0,u-3);
    k+=R[0]*f-0.05*gf*Math.max(0,k-4)-(hdOn?0.25*(k-4):0);
    p+=R[1]*f-0.035*gf*Math.max(0,p-3.5)-(hdOn?0.12*(p-3.5):0);
    var prod=ca*p; ca=Math.max(5.5,9.2-0.42*Math.max(0,p-4.5)*(alk?1.2:1));
    /* kidney injury */
    var uInj=Math.max(0,u-10)*(alk?0.4:1)/Math.max(0.5,fl), cpInj=Math.max(0,prod-(alk?40:55))*(alk?1.8:1)/Math.max(0.5,fl)/20, xInj=xan>25?0.02*(xan-25):0, hInj=hemol&&h>4&&h<30?0.6:0;
    gfr=Math.max(8,gfr-Math.min(3,(0.08*uInj+0.18*cpInj+xInj+hInj))*gfr/100*1.5);
    if(!hdOn&&hd&&(k>=6.5||p>=10||gfr<gfr0*0.3)&&h>6){ hdOn=true; hdAt=t; ev.push({t:t,kind:"rx",text:"เริ่ม HD: "+(k>=6.5?"K "+k.toFixed(1):p>=10?"P "+p.toFixed(1):"TLS-AKI oliguria")}); }
    var tgt=cr0*gfr0/gfr; cr+=(tgt-cr)/30;
    umax=Math.max(umax,u); kmax=Math.max(kmax,k); pmax=Math.max(pmax,p); camin=Math.min(camin,ca);
    if(crit.u===null&&u>=8) crit.u=t; if(crit.k===null&&k>=6) crit.k=t; if(crit.p===null&&p>=4.5) crit.p=t; if(crit.ca===null&&ca<=7) crit.ca=t;
    if(h%2===0){ U.push([t,u]); K.push([t,k]); PH.push([t,p]); }
  }
  var nlab=["u","k","p","ca"].filter(function(x){ return crit[x]!==null; }).length;
  var cls=nlab>=2?(cr>=1.5*Math.max(1,cr0)||kmax>=7?"Clinical TLS":"Laboratory TLS"):"No TLS";
  if(crit.u!==null) ev.push({t:crit.u,kind:"warn",text:"Urate ≥ 8 mg/dL"});
  if(crit.k!==null) ev.push({t:crit.k,kind:"warn",text:"K ≥ 6 mmol/L ทำ ECG"});
  if(crit.p!==null) ev.push({t:crit.p,kind:"warn",text:"Phosphate ≥ 4.5 mg/dL"});
  if(crit.ca!==null) ev.push({t:crit.ca,kind:"warn",text:"Ca ≤ 7 mg/dL (ไม่ให้ Ca ถ้าไม่มีอาการ)"});
  if(ras) ev.push({t:0.05,kind:"rx",text:"Rasburicase 0.2 mg/kg urate ลดภายใน 4 ชม."+(g6?" แต่ผู้ป่วยเป็น G6PD deficiency":"")});
  if(allo) ev.push({t:0,kind:"rx",text:"Xanthine oxidase inhibitor เริ่มก่อนเคมีบำบัด ลดการสร้าง urate ใหม่"});
  if(hemol) ev.push({t:0.2,kind:"warn",text:"Hemolysis + methemoglobinemia จาก rasburicase ใน G6PD deficiency"});
  if(alk) ev.push({t:0.1,kind:"warn",text:"Urine pH > 7: CaP และ xanthine ละลายน้อยลง"});
  if(allo&&xan>25) ev.push({t:2,kind:"warn",text:"Xanthine สะสมสูง เสี่ยง xanthine crystal nephropathy"});
  ev.push({t:0,kind:"phys",text:"เริ่มเคมีบำบัด tumor burden "+["","low","intermediate","high"][b]+" IV fluid "+hyd+" L/m²/วัน"});
  ev.push({t:5,kind:cls==="No TLS"?"ok":"warn",text:"วันที่ 5: "+cls+" Cr "+cr.toFixed(1)});
  return {U:U,K:K,PH:PH,ev:ev,umax:umax,kmax:kmax,pmax:pmax,camin:camin,cr:cr,cr0:cr0,cls:cls,nlab:nlab,ras:ras,g6:g6,alk:alk,allo:allo,hyd:hyd,b:b,hdOn:hdOn,xan:xan};
}
function castModel(){
  var f0=C.flc.get(), cr0=C.cr0m.get();
  var chemo=on("chemo"), hco=on("hco"), hyd=on("hyd"), fur=on("fur"), hca=on("ca"), ctr=on("ctr");
  var gfr0=100/Math.pow(cr0,1.1)*1.0, gfr=gfr0, krr=0.25, kr=0.6;
  var prod0=f0*(krr+kr*gfr0/100), f=f0, cr=cr0, F=[], Cc=[], ev=[], f21=null, crmax=cr0;
  var prec=1+0.5*(fur?1:0)+0.6*(hca?1:0)+0.4*(ctr?1:0)-(hyd?0.35:0); prec=Math.max(0.4,prec);
  if(chemo) ev.push({t:0,kind:"rx",text:"Bortezomib + dexamethasone เริ่มทันที"});
  if(hyd) ev.push({t:0,kind:"rx",text:"Hydration ให้ UO > 3 L/วัน (ถ้าไม่มีน้ำเกิน)"});
  if(fur) ev.push({t:0,kind:"warn",text:"Furosemide เพิ่ม Na และ Cl ที่ TAL เร่ง FLC-uromodulin aggregation"});
  if(hca) ev.push({t:0,kind:"warn",text:"Hypercalcemia ลด GFR และส่งเสริม cast ให้ fluid + bisphosphonate/denosumab ปรับขนาดตาม GFR"});
  if(ctr) ev.push({t:0,kind:"warn",text:"Contrast/NSAID เป็น precipitant"});
  var dt=0.05;
  for(var n=0;n<=30/dt;n++){
    var t=n*dt;
    var prod=prod0*(chemo?Math.max(0.03,Math.exp(-t/4.5)):1);
    var hdK=0; if(hco&&t>=1&&t<=21&&Math.floor(t)%2===1&&(t%1)<0.25) hdK=7.0; /* 6 h sessions on alternate days */
    f+=(prod-(krr+kr*gfr/100+hdK)*f)*dt;
    var dmg=Math.min(1.5,Math.max(0,(f-500)/3000))*prec, rec=f<500?1:0;
    gfr=Math.max(9,Math.min(gfr0*1.8,gfr+(-dmg*gfr*0.07+rec*(gfr0*1.8-gfr)*0.05)*dt));
    var tgt=cr0*gfr0/gfr; cr+=(tgt-cr)*dt/1.2; crmax=Math.max(crmax,cr);
    if(n%5===0){ F.push([+t.toFixed(2),f]); Cc.push([+t.toFixed(2),cr]); }
    if(Math.abs(t-21)<dt/2) f21=f;
  }
  var red=(1-f21/f0)*100;
  var x5=Live.cross(F,500,-1); if(x5!==null) ev.push({t:x5,kind:"ok",text:"FLC ต่ำกว่า 500 mg/L cast formation ลดลง"});
  ev.push({t:21,kind:red>=60?"ok":"warn",text:"วันที่ 21: FLC ลดลง "+red.toFixed(0)+"%"+(red>=60?" สัมพันธ์กับโอกาสฟื้นตัวของไตที่ดีขึ้น":"")});
  if(hco) ev.push({t:1,kind:"rx",text:"High cut-off HD 6 ชม. วันเว้นวัน (rebound ระหว่างรอบ)"});
  var risk=prec*Math.min(3,f0/2000);
  return {F:F,Cc:Cc,ev:ev,red:red,f30:f,crmax:crmax,cr:cr,cr0:cr0,risk:risk,chemo:chemo,hco:hco,fur:fur,hca:hca,ctr:ctr,hyd:hyd,f0:f0};
}
function cbBadges(M,t){
  var el=document.getElementById("cb"); el.innerHTML="";
  if(mode!=="tls") return;
  var i=Math.min(M.U.length-1,Math.round(t*12)), u=0,k=0,p=0; for(var j=0;j<=i;j++){ u=Math.max(u,M.U[j][1]); k=Math.max(k,M.K[j][1]); p=Math.max(p,M.PH[j][1]); }
  var ca=9.2-0.42*Math.max(0,p-4.5)*(M.alk?1.2:1);
  [["Urate ≥ 8",u>=8],["K ≥ 6",k>=6],["P ≥ 4.5",p>=4.5],["Ca ≤ 7",ca<=7]].forEach(function(x){ el.appendChild(Sim.h("span",{class:x[1]?"on":"",text:x[0]})); });
}
function onFrame(t,done){
  var M=LAST;
  if(mode==="tls"){ cbBadges(M,t);
    Sim.ro("r1",done?M.umax.toFixed(1):"…",done?(M.umax>=8?"flag":"ok"):null); Sim.ro("r2",done?M.kmax.toFixed(1):"…",done?(M.kmax>=6?"flag":"ok"):null);
    Sim.ro("r3",done?M.pmax.toFixed(1):"…",done?(M.pmax>=4.5?"flag":"ok"):null); Sim.ro("r4",done?Math.max(5.5,M.camin).toFixed(1):"…",done?(M.camin<=7?"flag":"ok"):null);
    Sim.ro("r5",done?M.cr.toFixed(1):"…",done?(M.cr>=1.5*M.cr0?"flag":"ok"):null); Sim.ro("r6",done?M.cls:"…",done?(M.cls==="No TLS"?"ok":"flag"):null);
  } else {
    Sim.ro("r1",t>=21?M.red.toFixed(0)+"%":"…",t>=21?(M.red>=60?"ok":"flag"):null); Sim.ro("r2",done?M.f30.toFixed(0):"…",done?(M.f30<500?"ok":"flag"):null);
    Sim.ro("r3",done?M.crmax.toFixed(1):"…","flag"); Sim.ro("r4",done?M.cr.toFixed(1):"…",done?(M.cr<M.cr0?"ok":"flag"):null);
    Sim.ro("r5",M.risk>2?"high":M.risk>1?"moderate":"low",M.risk>1?"flag":"ok"); Sim.ro("r6",done?(M.red>=60&&M.cr<M.cr0*1.1?"likely":"unlikely"):"…",done?(M.red>=60&&M.cr<M.cr0*1.1?"ok":"flag"):null);
  }
  var a=document.getElementById("act");
  if(done){ a.innerHTML=M.act; a.className=M.actCls; } else { a.innerHTML="<b>กำลังจำลอง</b> วันที่ "+t.toFixed(1); a.className="act"; }
}
function update(deb){
  var M, m, bad=true;
  if(mode==="tls"){
    M=tlsModel();
    chart.update({y:{min:0,max:Math.max(16,Math.ceil(Math.max(M.umax,M.pmax)*1.15/4)*4),step:4,label:"Urate, phosphate (mg/dL)"}});
    chart.setSeries("u",M.U); chart.setSeries("p",M.PH); chart.setSeries("k",M.K);
    if(M.ras&&M.g6) m="<b>หยุด rasburicase ทันที</b> ใช้ allopurinol แทน รักษา hemolysis ตรวจ methemoglobin ห้ามให้ methylene blue ให้ O2 และพิจารณา transfusion";
    else if(M.alk) m="<b>หยุด bicarbonate</b> alkalinization เพิ่ม CaP precipitation ใช้ isotonic saline ให้ UO 80–100 mL/m²/h ลด phosphate ด้วย binder และ HD ถ้า P สูงมาก";
    else if(M.cls==="Clinical TLS") m="<b>Clinical TLS</b> ECG monitoring, รักษา hyperK, phosphate binder, rasburicase ถ้า urate สูง (ตรวจ G6PD) ปรึกษา nephrology เรื่อง KRT (ข้อบ่งชี้: K ดื้อการรักษา, P สูงมาก, hypocalcemia มีอาการ, oliguria, น้ำเกิน)"+(M.hdOn?" HD เริ่มแล้ว อาจต้อง CRRT/ฟอกถี่เพราะ release ยังต่อเนื่อง":"");
    else if(M.cls==="Laboratory TLS") m="<b>Laboratory TLS</b> เพิ่ม IV fluid, ตรวจ electrolyte ทุก 6–8 ชม. ปรับ prophylaxis "+(M.allo&&M.umax>=8?"เปลี่ยนเป็น rasburicase (ตรวจ G6PD)":"ตามความเสี่ยง")+" หลีกเลี่ยง K และ P ใน IV fluid";
    else if(M.b===3&&!M.ras) m="<b>ความเสี่ยงสูง</b> ใช้ rasburicase (ตรวจ G6PD ก่อน) + hydration 3 L/m²/วัน monitor ใน ward ที่ตรวจ lab ได้ทุก 6 ชม.";
    else { bad=false; m="<b>ไม่เกิด TLS</b> ให้ hydration และ prophylaxis ต่อ ตรวจ lab ทุก 8–12 ชม. ใน 72 ชม. แรก"; }
  } else {
    M=castModel();
    chart.setSeries("f",M.F); chart.setSeries("c",M.Cc);
    chart.update({y2:{min:0,max:Math.max(6,Math.ceil(M.crmax*1.2)),step:2,label:"Creatinine (mg/dL)"}});
    if(!M.chemo) m="<b>เริ่ม bortezomib-based therapy ทันที</b> ไม่ต้องรอ biopsy ถ้า FLC > 1,500 mg/L และ clinical เข้าได้ หยุด precipitant ทั้งหมด"+(M.fur?" หยุด furosemide":"")+(M.hca?" แก้ hypercalcemia":"");
    else if(M.fur||M.hca||M.ctr) m="<b>ยังมี precipitant</b> หยุด loop diuretic, contrast, NSAID แก้ hypercalcemia และให้ hydration";
    else if(M.red>=60){ bad=M.cr>M.cr0; m="<b>FLC ลด "+M.red.toFixed(0)+"% ที่วันที่ 21</b> ทำ chemotherapy ต่อ ติดตาม FLC ทุกรอบ และ Cr"+(M.hco?" HCO-HD หยุดได้เมื่อ FLC ต่ำ ไม่จำเป็นต้องใช้ routine":""); }
    else m="<b>FLC ลดไม่พอ</b> ปรึกษา hematology เปลี่ยนหรือเพิ่ม regimen (เช่น daratumumab) พิจารณา biopsy ยืนยัน"+(M.hco?"":" HCO-HD เป็นทางเลือกในศูนย์ที่มี แต่หลักฐานไม่แน่น");
  }
  M.act="<b>Next step:</b> "+m; M.actCls="act"+(bad?" bad":"");
  LAST=M;
  var tMax=mode==="tls"?5:30;
  live.load({tMax:tMax,unit:"วัน",ms:8000,debounce:deb===true,num:function(x){ return x.toFixed(1); },events:M.ev.sort(function(a,b){ return a.t-b.t; }),onFrame:onFrame,
    cursorLabel:function(t){ return mode==="tls"?"Urate "+Live.valueAt(M.U,t).toFixed(1):"FLC "+Live.valueAt(M.F,t).toFixed(0); }});
}

});
