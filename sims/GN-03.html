<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[GN-03] Nephritic vs Nephrotic: Serology Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../core/core.css">
<style>
.bench{grid-template-columns:1.25fr 1fr}
@media (max-width:900px){.bench{grid-template-columns:1fr}}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px}
@media (max-width:520px){.tests{grid-template-columns:1fr}}
.tests label{display:grid;grid-template-columns:minmax(84px,1fr) minmax(0,1.3fr);gap:8px;align-items:center}
.tests label span{font-weight:500}
select{max-width:100%;min-width:0;width:100%}
select.pos{border-color:var(--red);color:var(--red)}
select.neg{border-color:var(--teal);color:var(--teal)}
.sel{display:grid;grid-template-columns:minmax(100px,140px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px;margin:0 0 12px}
.sel label{font-weight:500}
.nb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px}
.nb .t{font:600 16px var(--display)}
.nb .s{color:#C9CAE6;margin-top:4px}
.act{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--canvas);font-size:14px}
.act b{font-weight:600}
.urgent{margin-top:10px;padding:10px 14px;border-radius:12px;background:#F9EAEA;color:var(--red);font-size:14px;font-weight:500}
body.present .bench{grid-template-columns:1.2fr 1fr}
body.present .find .card{display:none}
body.present .find{grid-template-columns:1fr}
body.present .hint,body.present .act{display:none}
body.present .card{padding:14px 18px}
body.present #bars{max-height:215px;width:auto!important;margin:0 auto}
body.present #heat{max-height:225px;width:auto!important;margin:0 auto}
body.present .tests{gap:4px 12px;font-size:12.5px}
body.present .nb{margin-top:8px;padding:8px 12px}
</style>
</head>
<body>
<main class="sim" id="sim">
  <section class="bench">
    <div class="card">
      <h2>Differential ที่เหลือ</h2>
      <div class="svgwrap"><svg id="bars" viewBox="0 0 640 260" role="img" aria-label="Ranked differential diagnosis"></svg></div>
      <div class="svgwrap" style="margin-top:10px"><svg id="heat" viewBox="0 0 640 300" role="img" aria-label="Serology fingerprint of leading diagnoses"></svg></div>
      <p class="hint no-present">แถบบนคือความน่าจะเป็นสัมพัทธ์ของแต่ละโรคหลังรวม presentation และผล serology ที่เลือก ตารางล่างคือ serology ที่คาดว่าจะพบในโรคที่นำอยู่ (สีเข้ม = มักพบ) ช่องที่ขอบแดงคือผลจริงที่ขัดกับโรคนั้น</p>
    </div>
    <div class="card">
      <h2>Presentation และ serology</h2>
      <div class="sel"><label for="sPres">Presentation</label><select id="sPres">
        <option value="nephritic">Nephritic (hematuria, RBC cast, HT, AKI)</option>
        <option value="rpgn">RPGN (Cr ขึ้นเร็วในวันถึงสัปดาห์)</option>
        <option value="nephrotic">Nephrotic (proteinuria ≥ 3.5 g, albumin ต่ำ)</option>
        <option value="mixed">Mixed nephritic-nephrotic</option>
        <option value="hematuria">Isolated glomerular hematuria</option></select></div>
      <div class="tests" id="tests"></div>
      <div class="urgent" id="urg" hidden></div>
      <div class="nb" id="nb"></div>
      <div class="act" id="act"></div>
    </div>
  </section>
</main>
<script src="../core/shell.js"></script>
<script>
(function(){
"use strict";
/* Naive Bayes teaching model: posterior = prior x P(presentation | disease) x product of P(test result | disease).
   Likelihoods are rounded teaching estimates from review literature, not a validated calculator.
   Next best test = the test not yet sent with the largest expected reduction in entropy of the differential. */
var F = ["c3","c4","mpo","pr3","gbm","pla2r","dsdna","cryo","hcv","hbv","inf","mprot","dm"];
var FL = {c3:"C3 low", c4:"C4 low", mpo:"MPO", pr3:"PR3", gbm:"Anti-GBM", pla2r:"PLA2R", dsdna:"dsDNA", cryo:"Cryo", hcv:"HCV", hbv:"HBsAg", inf:"Infection", mprot:"M-protein", dm:"DM + DR"};
function Dz(name, prior, pres, v){ var o = {name:name, prior:prior, pres:{nephritic:pres[0], rpgn:pres[1], nephrotic:pres[2], mixed:pres[3], hematuria:pres[4]}, p:{}}; F.forEach(function(f, i){ o.p[f] = v[i]; }); return o; }
//                                   pres: nephritic rpgn nephrotic mixed hematuria   c3   c4   mpo  pr3  gbm  pla2r dsdna cryo hcv  hbv  inf  mprot dm
var D = {
  pign:Dz("Post-infectious GN", .06, [.70,.10,.05,.10,.05], [.90,.15,.03,.02,.01,.02,.03,.05,.03,.03,.85,.03,.10]),
  lnp:Dz("Lupus nephritis III/IV", .07, [.45,.20,.10,.20,.05], [.75,.70,.05,.02,.01,.02,.85,.10,.03,.02,.10,.03,.05]),
  lnv:Dz("Lupus nephritis V", .03, [.05,.02,.75,.13,.05], [.30,.30,.02,.01,.01,.05,.50,.05,.02,.02,.05,.03,.05]),
  iga:Dz("IgA nephropathy", .14, [.35,.08,.07,.10,.40], [.05,.03,.03,.02,.01,.02,.03,.03,.03,.03,.35,.03,.10]),
  anca:Dz("ANCA GN (pauci-immune)", .08, [.30,.60,.02,.05,.03], [.08,.05,.60,.32,.08,.02,.05,.03,.02,.02,.10,.05,.15]),
  gbm:Dz("Anti-GBM disease", .02, [.15,.80,.01,.02,.02], [.05,.03,.30,.05,.97,.01,.03,.02,.02,.02,.10,.02,.10]),
  c3g:Dz("C3 glomerulopathy", .02, [.35,.10,.15,.30,.10], [.80,.05,.02,.01,.01,.02,.03,.03,.03,.02,.30,.20,.10]),
  mpgn:Dz("IC-MPGN / cryo (HCV)", .03, [.30,.10,.15,.40,.05], [.60,.85,.03,.01,.01,.02,.05,.80,.70,.10,.10,.40,.10]),
  irgn:Dz("Endocarditis / shunt GN", .03, [.50,.25,.05,.15,.05], [.65,.30,.10,.20,.01,.02,.05,.20,.20,.05,.95,.03,.20]),
  hbv:Dz("HBV-associated MN/MPGN", .03, [.10,.03,.60,.25,.02], [.40,.30,.02,.01,.01,.05,.03,.10,.05,.95,.05,.03,.10]),
  mn:Dz("Primary membranous", .09, [.02,.01,.90,.05,.02], [.03,.03,.02,.01,.01,.75,.03,.02,.02,.03,.05,.05,.15]),
  mcd:Dz("Minimal change disease", .07, [.02,.01,.92,.03,.02], [.03,.03,.02,.01,.01,.01,.03,.02,.02,.02,.10,.05,.10]),
  fsgs:Dz("FSGS", .10, [.05,.02,.70,.20,.03], [.03,.03,.02,.01,.01,.01,.03,.02,.04,.03,.05,.05,.20]),
  dkd:Dz("Diabetic kidney disease", .12, [.02,.01,.75,.20,.02], [.03,.03,.02,.01,.01,.02,.03,.02,.03,.03,.05,.06,.95]),
  al:Dz("AL amyloid / MGRS", .04, [.02,.01,.85,.10,.02], [.05,.05,.02,.01,.01,.02,.03,.03,.02,.02,.05,.90,.15]),
  fgn:Dz("Fibrillary GN", .01, [.15,.08,.30,.45,.02], [.20,.10,.03,.02,.02,.02,.05,.05,.10,.03,.05,.15,.15]),
  alp:Dz("Alport / thin GBM", .03, [.05,.005,.05,.20,.70], [.03,.03,.02,.01,.01,.01,.03,.02,.02,.02,.05,.03,.10])
};
var KEYS = Object.keys(D);
var TESTS = [["c3","C3",["ต่ำ","ปกติ"]],["c4","C4",["ต่ำ","ปกติ"]],["anca","ANCA",null],["gbm","Anti-GBM",["บวก","ลบ"]],["pla2r","Anti-PLA2R",["บวก","ลบ"]],["dsdna","ANA/dsDNA",["บวก","ลบ"]],
  ["cryo","Cryoglobulin",["บวก","ลบ"]],["hcv","Anti-HCV",["บวก","ลบ"]],["hbv","HBsAg",["บวก","ลบ"]],["inf","Recent infection/ASO",["มี","ไม่มี"]],["mprot","SPEP, FLC, IFE",["Monoclonal","ปกติ"]],["dm","DM + retinopathy",["มี","ไม่มี"]]];
var box = document.getElementById("tests"), SEL = {};
TESTS.forEach(function(t){
  var s = Sim.h("select", {id:"t_" + t[0]});
  var opts = t[2] ? [["", "ยังไม่ส่ง"], ["pos", t[2][0]], ["neg", t[2][1]]] : [["", "ยังไม่ส่ง"], ["neg", "ลบ"], ["mpo", "MPO-ANCA"], ["pr3", "PR3-ANCA"]];
  opts.forEach(function(o){ s.appendChild(Sim.h("option", {value:o[0], text:o[1]})); });
  s.addEventListener("change", update);
  SEL[t[0]] = s;
  box.appendChild(Sim.h("label", {}, [Sim.h("span", {text:t[1]}), s]));
});
var pres = document.getElementById("sPres"); pres.addEventListener("change", update);
function obs(){ // feature -> true/false/undefined
  var o = {};
  TESTS.forEach(function(t){ var v = SEL[t[0]].value; SEL[t[0]].className = v === "" ? "" : v === "neg" ? "neg" : "pos";
    if(t[0] === "anca"){ if(v === "neg"){ o.mpo = false; o.pr3 = false; } else if(v === "mpo"){ o.mpo = true; o.pr3 = false; } else if(v === "pr3"){ o.pr3 = true; o.mpo = false; } }
    else if(v) o[t[0]] = v === "pos"; });
  return o;
}
function posterior(pr, o){
  var w = {}, s = 0;
  KEYS.forEach(function(k){ var d = D[k], x = d.prior * d.pres[pr];
    F.forEach(function(f){ if(o[f] === true) x *= d.p[f]; else if(o[f] === false) x *= 1 - d.p[f]; });
    w[k] = x; s += x; });
  KEYS.forEach(function(k){ w[k] /= s || 1; });
  return w;
}
function H(w){ var h = 0; KEYS.forEach(function(k){ if(w[k] > 0) h -= w[k] * Math.log2(w[k]); }); return h; }
function bestTest(pr, o){
  var w = posterior(pr, o), h0 = H(w), best = null;
  TESTS.forEach(function(t){
    if(SEL[t[0]].value) return;
    var outs = t[0] === "anca" ? [{mpo:false, pr3:false}, {mpo:true, pr3:false}, {mpo:false, pr3:true}] : [{}, {}];
    if(t[0] !== "anca"){ outs[0][t[0]] = true; outs[1][t[0]] = false; }
    var eh = 0;
    outs.forEach(function(oo){ var o2 = Object.assign({}, o, oo), pO = 0;
      KEYS.forEach(function(k){ var l = 1; for(var f in oo) l *= oo[f] ? D[k].p[f] : 1 - D[k].p[f]; pO += w[k] * l; });
      eh += pO * H(posterior(pr, o2)); });
    var gain = h0 - eh;
    if(!best || gain > best.gain) best = {t:t, gain:gain};
  });
  return best;
}
var bars = document.getElementById("bars"), heat = document.getElementById("heat");
var FT = "IBM Plex Sans Thai, sans-serif", MO = "Geist Mono, monospace";
function drawBars(rank, w){
  bars.innerHTML = "";
  var top = rank.slice(0, 8), x0 = 210, x1 = 590;
  top.forEach(function(k, i){
    var y = 12 + i * 31, p = w[k], wd = Math.max(2, p * (x1 - x0));
    Sim.svg("text", {x:x0 - 10, y:y + 15, "text-anchor":"end", "font-family":FT, "font-size":13, fill:"#0B0B1F", "font-weight":i === 0 ? 600 : 400, text:D[k].name}, bars);
    Sim.svg("rect", {x:x0, y:y + 2, width:x1 - x0, height:20, rx:6, fill:"#F4F5F9"}, bars);
    Sim.svg("rect", {x:x0, y:y + 2, width:wd, height:20, rx:6, fill:i === 0 ? "#5B4BFF" : p > 0.1 ? "#A69DFF" : "#D3D5E2"}, bars);
    Sim.svg("text", {x:Math.min(x1 + 4, x0 + wd + 6), y:y + 16, "font-family":MO, "font-size":11.5, fill:"#5E6075", text:(p * 100).toFixed(p < 0.1 ? 1 : 0) + "%"}, bars);
  });
}
function drawHeat(rank, o){
  heat.innerHTML = "";
  var top = rank.slice(0, 7), x0 = 196, cw = (596 - x0) / F.length, y0 = 80, rh = 29;
  F.forEach(function(f, j){
    var x = x0 + j * cw + cw / 2;
    Sim.svg("text", {x:x, y:y0 - 26, "text-anchor":"start", transform:"rotate(-40 " + x + " " + (y0 - 26) + ")", "font-family":FT, "font-size":11, fill:"#0B0B1F", text:FL[f]}, heat);
    var v = o[f];
    Sim.svg("circle", {cx:x, cy:y0 - 10, r:6.5, fill:v === true ? "#B4232A" : v === false ? "#1F7A72" : "#FFFFFF", stroke:v === undefined ? "#D3D5E2" : "none"}, heat);
    if(v !== undefined) Sim.svg("text", {x:x, y:y0 - 6.5, "text-anchor":"middle", "font-family":MO, "font-size":9.5, fill:"#FFFFFF", text:v ? "+" : "−"}, heat);
  });
  top.forEach(function(k, i){
    var y = y0 + i * rh;
    Sim.svg("text", {x:x0 - 10, y:y + 19, "text-anchor":"end", "font-family":FT, "font-size":12, fill:"#0B0B1F", text:D[k].name}, heat);
    F.forEach(function(f, j){
      var p = D[k].p[f], x = x0 + j * cw, v = o[f];
      var clash = (v === true && p < 0.15) || (v === false && p > 0.7);
      Sim.svg("rect", {x:x + 2, y:y + 3, width:cw - 4, height:rh - 6, rx:5, fill:"rgba(91,75,255," + (0.06 + 0.9 * p).toFixed(2) + ")", stroke:clash ? "#B4232A" : "none", "stroke-width":2.2}, heat);
    });
  });
  Sim.svg("text", {x:8, y:y0 - 6, "font-family":FT, "font-size":11, fill:"#5E6075", text:"Your results"}, heat);
  Sim.svg("text", {x:8, y:296, "font-family":FT, "font-size":10.5, fill:"#9A9CB2", text:"Cell shade = how often the finding occurs in that disease. Red outline = conflicts with the result."}, heat);
}
var NEXT = {

  neph0:["Nephrotic ผู้ใหญ่: serology แรกที่ให้ข้อมูลมากที่สุดมักเป็น PLA2R, DM และ M-protein","Complement ต่ำใน nephrotic ชี้ lupus, HBV, cryo หรือ C3G แต่ complement ปกติไม่ได้ตัด secondary cause","ผู้สูงอายุ nephrotic ต้องหา monoclonal protein เสมอ"],

  irgn:["Endocarditis ทำให้ PR3-ANCA บวกและ C3 ต่ำได้","ต้องตัด endocarditis ก่อนให้ immunosuppression ใน ANCA ที่มี low complement","Blood culture และ echo คือ next step"]

var S = {
  pign:{name:"Nephritic + low C3", p:{pres:"nephritic", t:{c3:"pos", c4:"neg", inf:"pos", dsdna:"neg", anca:"neg"}}, rows:[["Clinical","ชาย 19 ปี ตาบวม ปัสสาวะสีโคล่า 2 สัปดาห์หลังคออักเสบ"],["Pattern","Nephritic, low C3 normal C4"],["Clue","Infection นำมาก่อน ระยะ latent"]], take:TAKE.pign},

  neph0:{name:"Nephrotic ยังไม่ส่ง serology", p:{pres:"nephrotic", t:{}}, rows:[["Clinical","ชาย 55 ปี บวมทั้งตัว proteinuria 8 g/d albumin 2.0"],["Pattern","Nephrotic ยังไม่ส่ง serology"],["Task","ดูกล่อง next best test แล้วส่งทีละตัว"]], take:TAKE.neph0},
  mn:{name:"Nephrotic + PLA2R", p:{pres:"nephrotic", t:{pla2r:"pos", c3:"neg", c4:"neg", dm:"neg", hbv:"neg", dsdna:"neg"}}, rows:[["Clinical","ชาย 55 ปี nephrotic eGFR 85"],["Pattern","Nephrotic complement ปกติ"],["Clue","Anti-PLA2R บวก"]], take:TAKE.mn},
  cryo:{name:"Mixed + HCV cryo", p:{pres:"mixed", t:{c3:"pos", c4:"pos", cryo:"pos", hcv:"pos", dsdna:"neg"}}, rows:[["Clinical","ชาย 50 ปี purpura ขา ปวดข้อ hematuria proteinuria 4 g"],["Pattern","Mixed nephritic-nephrotic, C4 ต่ำมาก"],["Clue","Cryoglobulin + anti-HCV บวก"]], take:TAKE.mpgn},
  endo:{name:"ANCA + low C3 + fever", p:{pres:"nephritic", t:{c3:"pos", anca:"pr3", inf:"pos"}}, rows:[["Clinical","ชาย 40 ปี ไข้ 3 สัปดาห์ murmur ใหม่ AKI hematuria"],["Pattern","Nephritic, low C3, PR3-ANCA"],["Clue","สงสัย infective endocarditis"]], take:TAKE.irgn}
};
function update(){
  var o = obs(), pr = pres.value, w = posterior(pr, o);
  var rank = KEYS.slice().sort(function(a, b){ return w[b] - w[a]; });
  drawBars(rank, w); drawHeat(rank, o);
  var lead = rank[0], nb = document.getElementById("nb"), b = bestTest(pr, o);
  nb.innerHTML = "";
  nb.appendChild(Sim.h("div", {class:"t", text:"นำ: " + D[lead].name + " (" + Math.round(w[lead] * 100) + "%)"}));
  nb.appendChild(Sim.h("div", {class:"s", text:"รองลงมา: " + rank.slice(1, 3).map(function(k){ return D[k].name + " " + Math.round(w[k] * 100) + "%"; }).join(", ")}));
  if(b && b.gain > 0.05) nb.appendChild(Sim.h("div", {class:"s", style:"color:#FFDE59", text:"Test ถัดไปที่แยกได้มากที่สุด: " + b.t[1] + " (ลด uncertainty " + b.gain.toFixed(2) + " bit)"}));
  else nb.appendChild(Sim.h("div", {class:"s", style:"color:#B8FFB0", text:"Serology ที่เหลือแยกได้น้อย ขั้นต่อไปคือ kidney biopsy หรือ test เฉพาะโรค"}));
  var urg = document.getElementById("urg");
  var rp = pr === "rpgn" && (SEL.anca.value === "" || SEL.gbm.value === "");
  urg.hidden = !(pr === "rpgn" || o.gbm === true);
  urg.textContent = pr === "rpgn" ? (rp ? "RPGN: ส่ง ANCA และ anti-GBM แบบด่วนพร้อมกันและเตรียม biopsy อย่ารอผลถ้าอาการหนัก (DAH, Cr ขึ้นเร็ว)" : "RPGN: เป็นภาวะฉุกเฉิน เริ่มการรักษาตามผล serology ได้ก่อนผล biopsy") : "Anti-GBM บวก: เริ่ม PLEX ทันที";
  document.getElementById("act").innerHTML = "<b>Next step สำหรับโรคที่นำ:</b> " + NEXT[lead];
}
Sim.mount({code:"GN-03", title:"Nephritic vs Nephrotic: Serology Navigator",
  lead:"เลือก presentation แล้วใส่ผล serology ทีละตัว ดูว่า differential หดลงอย่างไร serology fingerprint ของแต่ละโรคเป็นแบบไหน และ test ใดควรส่งต่อเพื่อแยกโรคได้มากที่สุด",
  scenarios:S, order:["pign","lupus","mpo","double","neph0","mn","cryo","endo"], captureMs:900,
  onChange:function(k, s){ pres.value = s.p.pres; TESTS.forEach(function(t){ SEL[t[0]].value = s.p.t[t[0]] || ""; }); update(); },
  refs:["KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021, 100(4S): S1-S276",
        "Sethi S, Fervenza FC. Standardized classification and reporting of glomerulonephritis. Nephrol Dial Transplant 2019, 34(2): 193-199",
        "Bomback AS, Appel GB. Pathogenesis of the C3 glomerulopathies and reclassification of MPGN. Nat Rev Nephrol 2012, 8(11): 634-642",
        "Nasr SH, Radhakrishnan J, D'Agati VD. Bacterial infection-related glomerulonephritis in adults. Kidney Int 2013, 83(5): 792-803",
        "McAdoo SP, Tanna A, Hrušková Z, et al. Patients double-seropositive for ANCA and anti-GBM antibodies have varied renal survival, frequency of relapse, and outcomes compared to single-seropositive patients. Kidney Int 2017, 92(3): 693-702",
        "Bobart SA, De Vriese AS, Pawar AS, et al. Noninvasive diagnosis of primary membranous nephropathy using phospholipase A2 receptor antibodies. Kidney Int 2019, 95(2): 429-438",
        "Bele D, Kojc N, Perše M, et al. Diagnostic and treatment challenge of unrecognized subacute bacterial endocarditis associated with ANCA-PR3 positive immunocomplex glomerulonephritis. BMC Nephrol 2020, 21(1): 40"],
  note:"ความน่าจะเป็นมาจาก naive Bayes ที่สมมติว่าแต่ละ test เป็นอิสระต่อกันและใช้ likelihood ประมาณจากวรรณกรรม ใช้สอนการคิด differential ไม่ใช่เครื่องมือวินิจฉัยจริง โรคที่ไม่มีในรายการ (เช่น thrombotic microangiopathy, AIN) ไม่ถูกคำนวณ"
});
})();
