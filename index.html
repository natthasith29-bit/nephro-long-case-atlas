<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nephro Long Case Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Plan: spruce-teal command bar with coral signal accent, hub of tiles then detail views. Layout: sticky top bar, content column max 1120px, bottom tab bar on phones. */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --ink:#0F221F; --muted:#56706A; --line:#D8E4E1;
  --accent:#0E7C6B; --accent-soft:#E2F3EF; --coral:#E8534F; --coral-soft:#FDECEB; --amber:#C9861F; --amber-soft:#FBF1DF;
  --bar1:#0A2723; --bar2:#0D5A50; --bar3:#13A089;
  --shadow:0 1px 2px rgba(10,39,35,.06),0 6px 18px rgba(10,39,35,.07);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Sarabun","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08130F; --surface:#0F1F1B; --ink:#E3F0EC; --muted:#8DA7A0; --line:#1D3530;
    --accent:#33D1B2; --accent-soft:#12302A; --coral:#FF7B74; --coral-soft:#3A1A19; --amber:#F2B65A; --amber-soft:#34270F;
    --bar1:#04100D; --bar2:#0A3B34; --bar3:#0F7A69; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08130F; --surface:#0F1F1B; --ink:#E3F0EC; --muted:#8DA7A0; --line:#1D3530;
  --accent:#33D1B2; --accent-soft:#12302A; --coral:#FF7B74; --coral-soft:#3A1A19; --amber:#F2B65A; --amber-soft:#34270F;
  --bar1:#04100D; --bar2:#0A3B34; --bar3:#0F7A69; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-bottom:72px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:linear-gradient(115deg,var(--bar1) 0%,var(--bar2) 55%,var(--bar3) 100%);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.brand b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{opacity:.72;font-size:.75rem}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{color:#fff;text-decoration:none;padding:7px 12px;border-radius:999px;font-size:.9rem;opacity:.85}
.tabs a.on{background:rgba(255,255,255,.16);opacity:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.modesw{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.2)}
.modesw button{border:0;background:transparent;color:#fff;padding:5px 12px;border-radius:999px;font-size:.82rem;opacity:.8}
.modesw button.on{background:var(--coral);opacity:1;font-weight:600}
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .modesw{margin-left:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;padding:4px 0;display:grid;gap:2px;justify-items:center}
  .bnav a.on{color:var(--accent);font-weight:600}
  .bnav svg{width:22px;height:22px}
}

main{max-width:1120px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.85em}
.eyebrow{font-size:.75rem;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}

/* search */
.search{position:relative}
.search input{width:100%;padding:13px 14px 13px 44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:1rem}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.results{display:grid;gap:6px;margin-top:8px}
.res{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.res:hover{border-color:var(--accent)}
.res .k{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:stretch}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.5rem,3.2vw,2.1rem)}
.hero p{margin:6px 0 0;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;border-top:3px solid var(--accent);text-decoration:none;color:var(--ink)}
.tile .n{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.tile.coral{border-top-color:var(--coral)}.tile.coral .n{color:var(--coral)}
.tile.amber{border-top-color:var(--amber)}.tile.amber .n{color:var(--amber)}
.tile small{color:var(--muted)}
a.tile:hover{border-color:var(--accent)}

/* groups */
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:760px){.groups{grid-template-columns:1fr}}
.group h2{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.group .gi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.group p{margin:4px 0 10px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink);font-size:.88rem}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.ph{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--muted)}
.ph.p1{background:var(--coral-soft);color:var(--coral)}
.ph.p2{background:var(--accent-soft);color:var(--accent)}
.ph.p3{background:var(--amber-soft);color:var(--amber)}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:860px){.road{grid-template-columns:repeat(2,1fr)}}
.step{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);display:grid;gap:4px}
.step b{font-family:var(--f-display)}
.step .st{font-size:.72rem;font-weight:700;width:max-content;padding:1px 8px;border-radius:999px}
.st.done{background:var(--accent);color:#fff}
.st.next{background:var(--coral);color:#fff}
.st.plan{background:var(--line);color:var(--muted)}
.bar-prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--accent)}

/* page heads */
.phead{display:grid;gap:6px}
.phead h1{font-size:clamp(1.35rem,3vw,1.8rem)}
.crumbs{font-size:.85rem;color:var(--muted)}
.crumbs a{text-decoration:none}

/* template sections */
.secs{display:grid;gap:12px}
.sec{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:var(--accent-soft);color:var(--accent)}
.sec h3{font-size:1.05rem}
.sec ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.say{margin-top:8px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:.95rem}
.say .eyebrow{color:var(--accent)}
.tip{margin-top:8px;border-left:3px solid var(--amber);background:var(--amber-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:.92rem}
.trap{margin-top:8px;border-left:3px solid var(--coral);background:var(--coral-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:.92rem}

/* checklist */
.cl-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:.88rem}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cl-group h3{font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.cl-item{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.cl-item:last-child{border-bottom:0}
.cl-item input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.cl-item label{cursor:pointer}
.cl-item .why{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}
.cl-item.done label>span:first-child{text-decoration:line-through;color:var(--muted)}
.cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}

/* node page */
.node-grid{display:grid;gap:12px}
.blk{display:grid;grid-template-columns:44px 1fr;gap:12px}
.blk .num{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.blk.ready .num{background:var(--accent-soft);color:var(--accent);border:0}
.pending{font-size:.88rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;background:var(--bg)}
.frame{overflow-x:auto;margin-top:8px}
.frame table{border-collapse:collapse;width:100%;min-width:520px;font-size:.86rem}
.frame th,.frame td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.frame th{background:var(--accent-soft);color:var(--accent);font-weight:600}
.frame td{color:var(--muted)}
.ddx{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ddx span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;background:var(--surface)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:.82rem;color:var(--muted);text-align:center}

/* phase 4-5 and flow */
:root{--violet:#5753C9;--violet-soft:#ECEBFA;--wire:#9FB8B1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--violet:#A9A6FF;--violet-soft:#24224A;--wire:#35574F}}
:root[data-theme="dark"]{--violet:#A9A6FF;--violet-soft:#24224A;--wire:#35574F}
.ph.p4{background:var(--violet-soft);color:var(--violet)}
.ph.p5{background:var(--line);color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg-step{background:var(--bg);border:1.5px solid var(--line)}
.lg-nephro{background:var(--coral)}
.lg-adj{background:var(--amber)}
.flowwrap{overflow:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
.flow{display:inline-block;min-width:100%}
.flow ul{display:flex;justify-content:center;padding:22px 0 0;margin:0;position:relative}
.flow li{list-style:none;position:relative;padding:22px 5px 0;display:flex;flex-direction:column;align-items:center}
.flow li::before,.flow li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--wire)}
.flow li::after{right:auto;left:50%;border-left:2px solid var(--wire)}
.flow li:only-child::before{display:none}
.flow li:only-child::after{border-top:0}
.flow li:first-child::before,.flow li:last-child::after{border:0 none}
.flow li:last-child::before{border-right:2px solid var(--wire);border-radius:0 10px 0 0}
.flow li:first-child::after{border-radius:10px 0 0 0}
.flow li:only-child::after{border-radius:0}
.flow ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--wire);height:22px}
.flow>ul{padding-top:0;width:max-content;margin:0 auto}
.flow>ul>li{padding-top:0}
.flow>ul>li::before,.flow>ul>li::after{display:none}
.tnw{display:flex;flex-direction:column;align-items:center;gap:4px}
.tn{display:flex;flex-direction:column;gap:3px;min-width:116px;max-width:184px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:.84rem;line-height:1.3;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tn:hover{transform:translateY(-1px);border-color:var(--accent)}
.tn.step{background:var(--bg);font-weight:600}
.tn.root{background:linear-gradient(120deg,var(--bar2),var(--bar3));color:#fff;border-color:transparent;font-family:var(--f-display);font-size:1rem;min-width:160px;text-align:center;align-items:center}
.tn.nephro{border-left:5px solid var(--coral)}
.tn.adj{border-left:5px solid var(--amber)}
.tn.sel{outline:2px solid var(--accent);outline-offset:2px}
.tn .cc{font-family:var(--f-mono);font-size:.66rem;color:var(--muted);font-weight:500}
.tn.root .cc{color:rgba(255,255,255,.8)}
.tg{width:24px;height:24px;border-radius:999px;border:1.5px solid var(--wire);background:var(--surface);color:var(--accent);font-weight:700;line-height:1;padding:0}
.outline ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--wire);margin-left:12px;display:grid;gap:6px}
.outline>ul{border-left:0;margin-left:0;padding-left:0}
.outline li{display:grid;gap:6px}
.outline .tnw{flex-direction:row;align-items:center;justify-content:flex-start}
.outline .tn{max-width:none;flex:1}
#tip{position:fixed;z-index:60;width:340px;max-width:calc(100vw - 24px);pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:.88rem}
#sheet{position:fixed;z-index:50;right:16px;top:86px;width:380px;max-width:calc(100vw - 32px);max-height:calc(100% - 110px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 12px 34px rgba(0,0,0,.2)}
@media (max-width:760px){#sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;max-height:72%;border-radius:18px 18px 0 0;padding-bottom:calc(84px + env(safe-area-inset-bottom))}}
.dt h3{font-size:1.02rem;margin:2px 0 4px}
.dt .tagl{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;display:inline-block}
.tagl.nephro{background:var(--coral-soft);color:var(--coral)}
.tagl.adj{background:var(--amber-soft);color:var(--amber)}
.tagl.step,.tagl.root{background:var(--accent-soft);color:var(--accent)}
.dt .lb{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.dt ul{margin:3px 0 0;padding-left:18px;display:grid;gap:2px}
.dt p{margin:3px 0 0}
.dt .std{margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:.85rem}
.dt .why{margin-top:6px;padding:6px 10px;border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 8px 8px 0;font-size:.86rem}
.sheet-x{float:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 9px}
.mustlist{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.stds{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stds span{font-size:.82rem;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}

/* KRT stratification */
.vsw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vsw button{font:inherit;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid #cfd6df;background:#fff;color:#223;cursor:pointer;display:grid;gap:2px}
.vsw button b{font-size:.95rem}
.vsw button span{font-size:.78rem;color:#667}
.vsw button.on{background:#14243D;border-color:#14243D;color:#fff}
.vsw button.on span{color:#cfe3e0}
.labpanel{border-left:4px solid #1F7A72;background:#f3f8f7;border-radius:10px;padding:10px 14px}
.algbox{border:1px solid #d5dde6;border-radius:10px;padding:10px 14px;background:#fff}
.algbox .lb{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:#14243D;font-weight:700}
.alg-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alg-l{font-size:.72rem;padding:2px 8px;border-radius:999px;font-weight:600}
.alg-g{background:#14243D;color:#fff}.alg-c{background:#1F7A72;color:#fff}.alg-r{background:#eef1f4;color:#445}
.alg-src{font-size:.82rem;color:#556;margin:6px 0 4px}
.algbox ol{margin:4px 0 0;padding-left:20px;font-size:.88rem}.algbox li{margin:2px 0}
.alg-n{font-size:.8rem;color:#667;margin:6px 0 0}
.bxf{border:1px solid #cfe3e0;background:#f3f8f7;border-radius:10px;padding:8px 10px;margin:8px 0}
.bxr{display:grid;grid-template-columns:34px 1fr;gap:6px;font-size:.84rem;margin:4px 0;line-height:1.45}
.bxr b{color:#1F7A72}
.bxk{margin-top:6px;font-size:.84rem;background:#14243D;color:#fff;border-radius:8px;padding:6px 8px;line-height:1.45}
.bxk b{color:#9fd8cf;margin-right:4px}
.gsims{margin:10px 0 4px}.gsims .lb{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:#1F7A72;font-weight:700;margin-bottom:6px}
.labpanel .lb{font-size:.72rem;letter-spacing:.6px;text-transform:uppercase;color:#1F7A72;font-weight:700}
.labpanel ul{margin:4px 0 0;padding-left:18px;font-size:.88rem}
.labpanel li{margin:2px 0}
@media (max-width:560px){.vsw{grid-template-columns:1fr}}
.krtbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.krtbar .lbk{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted,#667);margin-right:2px}
.krtbar button{font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid #cfd6df;background:#fff;color:#223;cursor:pointer}
.krtbar button.on{background:#14243D;border-color:#14243D;color:#fff}
.krtnote{font-size:.8rem;color:var(--muted,#667);margin:0}
.kb{display:inline-block;font-size:.66rem;font-weight:700;line-height:1;padding:3px 5px;border-radius:5px;margin-left:5px;vertical-align:middle;letter-spacing:.02em;border:1.5px solid currentColor;white-space:nowrap}
.kb.s{color:#fff}
.kb-hd{color:#1d4ed8}.kb-hd.s{background:#1d4ed8;border-color:#1d4ed8}
.kb-pd{color:#0f766e}.kb-pd.s{background:#0f766e;border-color:#0f766e}
.kb-kt{color:#7c3aed}.kb-kt.s{background:#7c3aed;border-color:#7c3aed}
.nd.kdim,.mh.kdim{opacity:.45}
.nd.khl{background:rgba(31,122,114,.16);border-radius:6px;box-shadow:inset 4px 0 0 #1F7A72;font-weight:600}
.mh.khl{box-shadow:inset 4px 0 0 #1F7A72}
.krctx{margin-top:8px;padding:8px 10px;border-radius:8px;background:#f3f5f8}
.krctx p{margin:4px 0 0}

/* imaging guide */

/* hero */
.hb-hero{background:radial-gradient(1200px 520px at 50% -10%,rgba(41,151,255,.14),transparent 60%),var(--hb-light);text-align:center;padding-top:clamp(90px,13vw,170px)}
.hb-hero .hb-eyebrow{color:var(--hb-mute);font-weight:600}
.hb-hero .hb-lede{margin:26px auto 0;max-width:46ch}
.hb-cta{display:flex;gap:14px 26px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:34px}
.hb-btn{display:inline-flex;align-items:center;padding:12px 24px;border-radius:999px;background:var(--hb-blue);color:#fff!important;text-decoration:none!important;font-size:1.05rem;font-weight:500;transition:background .2s,transform .2s}
.hb-btn:hover{background:#0077ed;transform:scale(1.02)}
.hb-btn.ghost{background:transparent;border:1px solid currentColor;color:#2997ff!important}
.hb-link{border:0;background:none;padding:0;color:var(--hb-blue);font-size:1.05rem;cursor:pointer;text-decoration:none;font-family:inherit}
.hb-link:hover{text-decoration:underline}
.hb-dark .hb-link{color:var(--hb-blue2)}
.hb-copy .hb-link{display:inline-block;margin-top:22px}
.hb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:clamp(56px,8vw,96px) auto 0;max-width:860px;border-top:1px solid var(--hb-line);padding-top:30px}
.hb-stats div{display:grid;gap:4px}
.hb-stats span{font-size:clamp(2rem,4.6vw,3.2rem);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hb-stats small{color:var(--hb-mute);font-size:.92rem}
@media (max-width:640px){.hb-stats{grid-template-columns:repeat(2,1fr);row-gap:26px}}

/* bento */
.hb-bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
@media (max-width:900px){.hb-bento{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.hb-bento{grid-template-columns:1fr}}
.hb-tool{display:grid;gap:10px;align-content:start;padding:28px 24px;border-radius:22px;background:var(--hb-gray);color:var(--hb-ink)!important;text-decoration:none!important;min-height:230px;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.hb-tool:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.08)}
.hb-tool b{font-size:1.45rem;letter-spacing:-.01em}
.hb-tool span:not(.hb-ic){color:var(--hb-mute);font-size:1rem;line-height:1.45}
.hb-tool em{font-style:normal;color:var(--hb-blue);margin-top:auto}
.hb-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2997ff,#8e5cf6);color:#fff}
.hb-ic svg{width:24px;height:24px}

/* split layouts */
.hb-split{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(36px,6vw,80px);align-items:center}
.hb-split.rev>:first-child{order:2}
@media (max-width:880px){.hb-split{grid-template-columns:1fr}.hb-split.rev>:first-child{order:0}}
.hb-feats{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px}
.hb-feats li{display:grid;gap:2px;color:#a1a1a6;font-size:.98rem}
.hb-feats b{color:#f5f5f7;font-weight:600}
.hb-feats .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 0;vertical-align:middle}
.dot.nephro,.hb-t-nephro i{background:#ff6b6b}
.dot.adj,.hb-t-adj i{background:#f5a623}

/* device mockups */
.hb-device{border-radius:20px;background:#1c1c1e;border:1px solid #2c2c2e;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.hb-chrome{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid #2c2c2e;background:#232325}
.hb-chrome i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.hb-chrome i:nth-child(2){background:#febc2e}.hb-chrome i:nth-child(3){background:#28c840}
.hb-chrome span{margin-left:10px;color:#8e8e93;font-size:.82rem}
.hb-flow{padding:26px 20px 28px;color:#f5f5f7}
.hb-root{margin:0 auto;width:max-content;padding:9px 22px;border-radius:999px;background:linear-gradient(90deg,#2997ff,#8e5cf6);font-weight:600}
.hb-trunk{width:1px;height:22px;background:#3a3a3c;margin:0 auto}
.hb-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;border-top:1px solid #3a3a3c;padding-top:14px}
.hb-br{display:grid;gap:6px;align-content:start}
.hb-bh{font-weight:600;font-size:.86rem;padding-bottom:4px}
.hb-leaf{display:flex;gap:7px;align-items:baseline;font-size:.8rem;color:#c7c7cc;line-height:1.3}
.hb-leaf i{flex:0 0 7px;height:7px;border-radius:50%;background:#636366;transform:translateY(-1px)}
.hb-more{font-size:.74rem;color:#8e8e93}

/* detail card */
.hb-card{border-radius:22px;background:var(--hb-light);border:1px solid var(--hb-line);box-shadow:0 24px 60px rgba(0,0,0,.08);padding:26px;display:grid;gap:18px}
.hb-card-top h4{margin:10px 0 4px;font-size:1.5rem;letter-spacing:-.01em}
.hb-card-top p{margin:0;color:var(--hb-mute)}
.hb-tag{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px;background:#ffe5e5;color:#d70015}
.hb-tag.adj{background:#fff1d6;color:#a05a00}
.hb-tag.step{background:#e8f2ff;color:#0058b0}
.hb-row{display:grid;gap:7px;font-size:.95rem}
.hb-row b{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--hb-mute)}
.hb-row ul{margin:0;padding-left:18px;display:grid;gap:4px}
.hb-chips{display:flex;flex-wrap:wrap;gap:6px}
.hb-chips span{font-size:.84rem;padding:5px 11px;border-radius:999px;background:var(--hb-gray)}
.hb-std{font-size:.76rem;color:var(--hb-mute);border-top:1px solid var(--hb-line);padding-top:12px}

/* presentation parts */
.hb-parts{list-style:none;margin:0;padding:8px 0;border-radius:22px;background:var(--hb-light);border:1px solid var(--hb-line)}
.hb-parts li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;padding:11px 22px;border-bottom:1px solid var(--hb-line)}
.hb-parts li:last-child{border-bottom:0}
.hb-n{font-variant-numeric:tabular-nums;color:var(--hb-mute);font-weight:600;font-size:.86rem}
.hb-pt{font-weight:500}
.hb-tm{font-size:.8rem;color:var(--hb-mute);white-space:nowrap}
.hb-parts.in li{animation:hbslide .6s cubic-bezier(.2,.7,.2,1) both}
.hb-parts.in li:nth-child(n){animation-delay:calc(var(--i,0)*40ms)}

/* checklist */
.hb-checks{list-style:none;margin:0;padding:12px 20px 18px;display:grid}
.hb-checks li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #2c2c2e;color:#e5e5ea;font-size:.92rem}
.hb-checks li:last-child{border-bottom:0}
.hb-box{flex:0 0 22px;height:22px;border-radius:7px;border:1.5px solid #48484a;position:relative;transition:background .3s,border-color .3s}
.hb-box::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .3s}
.hb-checks.in .hb-box{background:#30d158;border-color:#30d158;transition-delay:calc(var(--d)*260ms + 300ms)}
.hb-checks.in .hb-box::after{transform:rotate(45deg) scale(1);transition-delay:calc(var(--d)*260ms + 360ms)}

/* search */
.hb-search{max-width:640px;margin:34px auto 0;text-align:left}
.hb-search .search input{border-radius:16px;padding:16px 18px 16px 48px;font-size:1.05rem;background:var(--hb-gray);border:1px solid var(--hb-line);color:var(--hb-ink)}
.hb-search .results{text-align:left}
.hub kbd{font-family:inherit;font-size:.9em;padding:1px 8px;border-radius:6px;border:1px solid var(--hb-line);background:var(--hb-gray)}

/* steps */
.hb-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px}
@media (max-width:860px){.hb-steps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.hb-steps{grid-template-columns:1fr}}
.hb-steps div{border-top:2px solid var(--hb-ink);padding-top:18px}
.hb-steps span{font-size:.9rem;font-weight:600;color:var(--hb-mute)}
.hb-steps b{display:block;font-size:1.3rem;margin:8px 0;letter-spacing:-.01em}
.hb-steps p{margin:0;color:var(--hb-mute);line-height:1.5}

/* coverage */
.hb-covs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
@media (max-width:900px){.hb-covs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.hb-covs{grid-template-columns:1fr}}
.hb-cov{display:grid;gap:8px;align-content:start;padding:26px 22px;border-radius:22px;background:var(--hb-gray);color:var(--hb-ink)!important;text-decoration:none!important;transition:transform .3s}
.hb-cov:hover{transform:translateY(-3px)}
.hb-cov-n{font-size:2.8rem;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hb-cov b{font-size:1.1rem}
.hb-cov small{color:var(--hb-mute);font-size:.88rem;line-height:1.45}
.hb-bar{height:5px;border-radius:99px;background:var(--hb-line);overflow:hidden;margin-top:6px}
.hb-bar i{display:block;height:100%;background:linear-gradient(90deg,#2997ff,#8e5cf6);border-radius:99px}
.hb-cov em{font-style:normal;font-size:.85rem;color:var(--hb-blue);margin-top:6px}
.hb-phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:34px}
.hb-ph{display:grid;gap:3px;padding:14px 16px;border-radius:16px;border:1px solid var(--hb-line)}
.hb-ph span{font-size:.72rem;font-weight:600;color:var(--hb-mute);text-transform:uppercase;letter-spacing:.05em}
.hb-ph-done span{color:#248a3d}.hb-ph-next span{color:var(--hb-blue)}
.hb-ph small{color:var(--hb-mute)}

/* final */
.hb-final h2{font-size:clamp(2.4rem,6vw,4.4rem)}
.hb-fine{font-size:.85rem!important;color:#6e6e73!important;margin-top:40px!important}

/* reveal */
.hub .rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.hub .rv.in{opacity:1;transform:none}
@keyframes hbslide{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.hub .rv{opacity:1;transform:none;transition:none}.hb-checks .hb-box,.hb-checks .hb-box::after{transition:none}}

/* ===== Disease library and simulator links ===== */
.dsum{margin:0;color:var(--muted);font-size:1.02rem;max-width:70ch}
.dkey p{margin:6px 0 0;line-height:1.6}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.dsec h2,.dkey h2,.dviva h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.dsec h2,.dkey h2,.dviva h2{padding-bottom:8px;margin-bottom:2px;border-bottom:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.dviva-h{border-bottom:2px solid color-mix(in srgb,var(--accent) 35%,transparent);padding-bottom:8px}
.dviva-h h2{border-bottom:0;padding-bottom:0}
.dsec ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;line-height:1.55}
.dev li{font-variant-numeric:tabular-nums}
.dpearl{border-left:3px solid var(--accent)}
.dlink{display:inline-block;margin:2px 0 6px;font-size:.84rem;font-weight:600}
.dt h3 a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.lb-ic{display:inline-flex;align-items:center;flex:none;margin-left:8px;padding:1px 7px;border-radius:999px;font:600 .66rem/1.5 var(--f-body);letter-spacing:.02em;font-style:normal;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);vertical-align:1px;white-space:nowrap}
.lb-ic::before{content:"Library"}
.legend i.lb-ic{margin:0 6px 0 0;width:auto;height:auto;border:0}
.nd.haslib{cursor:pointer}
.dnav-bar{position:sticky;top:64px;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 0 12px;background:var(--bg,#f5f5f7);scrollbar-width:none}
.dnav-bar::-webkit-scrollbar{display:none}
.djump{flex:none;font:inherit;font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.djump:hover{border-color:var(--accent);color:var(--accent)}
.dviva-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.sm{padding:6px 12px;font-size:.8rem}
details.viva{border-top:1px solid var(--line);padding:10px 2px}
details.viva summary{cursor:pointer;font-weight:600;line-height:1.5;list-style:none;padding-right:22px;position:relative}
details.viva summary::-webkit-details-marker{display:none}
details.viva summary::after{content:"+";position:absolute;right:2px;top:0;color:var(--accent);font-weight:700}
details.viva[open] summary::after{content:"–"}
details.viva p{margin:8px 0 2px;line-height:1.6;color:var(--ink)}
.dsec,.dkey,.dviva{scroll-margin-top:120px}
.simchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.simc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:.88rem;line-height:1.35;transition:border-color .15s,transform .15s}
.simc b{font-size:.72rem;letter-spacing:.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.simc i{font-style:normal;color:var(--muted)}
.simc:hover{border-color:var(--accent);transform:translateY(-1px)}
.tpl-sim{margin-top:12px}
.tpl-sim .simchips{margin-top:6px}
</style>
<style id="tpl-guide">
.catwrap{min-width:0;max-width:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.gtabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
#app{grid-template-columns:minmax(0,1fr)}
#app>*{min-width:0}
.hero>.panel{min-width:0}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)!important}.hero h1 .rot{white-space:normal}}

.std-foot{margin:14px 2px 4px;font-size:.74rem;line-height:1.5;color:var(--muted)}
.std-foot b{font-weight:600;margin-right:4px;text-transform:uppercase;letter-spacing:.05em;font-size:.68rem}

/* full presentation guide */
.tpl-intro{display:grid;gap:10px}
.tpl-prin{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tpl-prin>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.tpl-prin b{font-family:var(--f-display);color:var(--accent)}
.tpl-prin span{font-size:.92rem}
.tpl-case{margin:0;font-size:.92rem;color:var(--muted)}
.tpl-case b{color:var(--ink);margin-right:4px}
.tpl-nav{position:sticky;top:62px;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:12px 0;background:var(--bg);scrollbar-width:thin}
.tpl-jump{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.tpl-jump span{display:grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.75rem}
.tpl-jump:hover{border-color:var(--accent)}
.tpl-list{display:grid;gap:14px;margin-bottom:14px}
.tpl-card{display:grid;gap:12px;scroll-margin-top:140px}
.tpl-head{display:flex;gap:12px;align-items:center}
.tpl-ht{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.tpl-ht h3{margin:0;font-size:1.12rem}
.tpl-time{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber);font-weight:600}
.tpl-goal{margin:0;display:grid;gap:2px;font-size:.95rem}
.tpl-goal b{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tpl-chips{display:flex;flex-wrap:wrap;gap:6px}
.tpl-chips span{font-size:.8rem;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.tpl-grid{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}
@media (max-width:820px){.tpl-grid{grid-template-columns:1fr}}
.tpl-box{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tpl-box ol,.tpl-box ul{margin:6px 0 0;padding-left:20px;display:grid;gap:6px;font-size:.93rem}
.tpl-avoid{background:var(--coral-soft);border-color:transparent}
.tpl-avoid .eyebrow{color:var(--coral)}
.tpl-card .say p{margin:4px 0}
.tpl-card .say,.tpl-card .tip{margin-top:0}
.tpl-qa{display:grid;gap:6px}
.tpl-qa details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.tpl-qa summary{cursor:pointer;font-weight:600;font-size:.93rem}
.tpl-qa details p{margin:8px 0 2px;font-size:.92rem}
.tpl-check>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tpl-check span{font-size:.82rem;padding:3px 10px 3px 8px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.tpl-check span::before{content:"\2610";margin-right:5px}
@media print{.tpl-nav,.bar,.modesw{display:none!important}.tpl-qa details{break-inside:avoid}.tpl-card{break-inside:avoid-page}}
</style>
<style id="detail-only">.modesw{display:none!important}</style>

function searchBox(){
  return `<div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <label for="q" class="eyebrow" hidden>Search</label>
    <input id="q" type="search" placeholder="Search complaints, diseases or sections" autocomplete="off">
    <div class="results" id="qres"></div></div>`;
}
function doSearch(q){
  const box = document.getElementById("qres"); if(!box) return;
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML=""; return; }
  const out = [];
  NODES.forEach(n=>{
    const hay = (n.en+" "+n.th+" "+n.al+" "+n.ddx.join(" ")).toLowerCase();
    if(hay.includes(q)) out.push(`<a class="res" href="#n-${n.id}"><span class="k">Approach</span><span>${esc(n.en)}</span></a>`);
  });
  (window.DLIB||[]).forEach(d=>{
    if((d.name+" "+d.al.join(" ")).toLowerCase().includes(q)) out.unshift(`<a class="res" href="#d-${d.id}"><span class="k">Disease</span><span>${esc(d.name)}</span></a>`);
  });
  TEMPLATE.forEach((s,i)=>{
    const hay = (s.h+" "+s.goal+" "+s.t.join(" ")+" "+s.how.join(" ")+" "+s.avoid.join(" ")+" "+s.say.join(" ")+" "+s.ask.map(x=>x.q+" "+x.a).join(" ")).toLowerCase();
    if(hay.includes(q)) out.push(`<a class="res" href="#template"><span class="k">Present</span><span>${i+1}. ${esc(s.h)}</span></a>`);
  });
  CHECK.forEach(g=>g.items.forEach(it=>{
    if((it[0]+" "+it[1]).toLowerCase().includes(q)) out.push(`<a class="res" href="#checklist"><span class="k">Must-ask</span><span>${esc(it[0])}</span></a>`);
  }));
  box.innerHTML = out.length ? out.slice(0,12).join("") : `<div class="muted" style="padding:6px 2px">No match. Try another term.</div>`;
}

function bindHub(){
  const hub = document.querySelector(".hub"); if(!hub) return;
  const red = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const els = hub.querySelectorAll(".rv,.hb-checks,.hb-stats,.hb-covs");
  const run = el => {
    el.classList.add("in");
    el.querySelectorAll("[data-count]").forEach(c=>{ if(c.dataset.done||red) return; c.dataset.done="1"; const to=+c.dataset.count, t0=performance.now();
      (function f(t){ const p=Math.min(1,Math.max(0,(t-t0)/1100)); c.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); })(t0); });
  };
  if(red || !("IntersectionObserver" in window)){ els.forEach(run); return; }
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ run(e.target); io.unobserve(e.target); } }),{threshold:.15});
  els.forEach(el=>io.observe(el));
}

  document.querySelectorAll("[data-info]").forEach(b=>b.addEventListener("click",()=>showSheet(b.dataset.info)));
  document.querySelectorAll("[data-tg]").forEach(b=>b.addEventListener("click",()=>{ const id=b.dataset.tg; COLL[tid].has(id)?COLL[tid].delete(id):COLL[tid].add(id); rerender(); }));
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{ TV=b.dataset.view; rerender(); }));
  document.querySelectorAll("[data-all]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.all==="open") COLL[tid].clear();
    else (function w(n,d){ if(d>=1 && n.k.length) COLL[tid].add(n._id); n.k.forEach(c=>w(c,d+1)); })(TREES[tid].tree,0);
    rerender(); }));
}
function rerender(){ const y=window.scrollY; route(); window.scrollTo(0,y); if(SEL && IDX[SEL] && !document.getElementById("sheet").hidden) showSheet(SEL); }

function viewTemplate(){
  const nav = TEMPLATE.map((s,i)=>`<button type="button" class="tpl-jump" data-jump="tpl${i+1}"><span>${i+1}</span>${esc(s.h.replace(" with pertinent ROS",""))}</button>`).join("");
  const secs = TEMPLATE.map((s,i)=>`<article class="panel tpl-card" id="g-tpl${i+1}">
    <header class="tpl-head"><div class="num">${i+1}</div><div class="tpl-ht"><h3>${esc(s.h)}</h3><span class="tpl-time">${esc(s.time)}</span></div></header>
    <p class="tpl-goal"><b>What the examiner scores</b>${esc(s.goal)}</p>
    <div class="tpl-chips">${s.t.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    <div class="tpl-grid">
      <div class="tpl-box"><div class="eyebrow">How to build it</div><ol>${s.how.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
      <div class="tpl-box tpl-avoid"><div class="eyebrow">Common mistakes</div><ul>${s.avoid.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <div class="say"><div class="eyebrow">Say it like this</div>${s.say.map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <div class="tpl-qa"><div class="eyebrow">Examiner may ask</div>${s.ask.map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join("")}</div>
    <div class="tip"><b>Exam tip</b> ${esc(s.tip)}</div>
    ${TPL_SIMS[i]?`<div class="tpl-sim"><div class="eyebrow">Simulate it</div>${simChips(TPL_SIMS[i])}</div>`:""}
    <div class="tpl-check"><div class="eyebrow">Self-check before you move on</div><div>${s.check.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>
  </article>`).join("");
  return `<div class="phead"><div class="crumbs"><a href="#home">Hub</a> / Present</div>
    <h1>The 11-part presentation</h1>
    <p class="muted" style="margin:0">A complete guide for each section: what the examiner scores, how to build it, model script, common mistakes, likely questions and a self-check.</p></div>
    <section class="panel tpl-intro">
      <div class="eyebrow">Core principles</div>
      <div class="tpl-prin">${TPL_PRINCIPLES.map(p=>`<div><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join("")}</div>
      <p class="tpl-case"><b>Running case</b> ${esc(TPL_CASE.replace(/^Running case /,""))}</p>
    </section>
    <nav class="tpl-nav" aria-label="Sections">${nav}<button type="button" class="tpl-jump" data-jump="tpldisc"><span>+</span>Handling the discussion</button></nav>
    <section class="tpl-list">${secs}</section>
    <section class="panel tpl-card" id="g-tpldisc">
      <header class="tpl-head"><div class="num">+</div><div class="tpl-ht"><h3>Handling the discussion</h3><span class="tpl-time">ตลอดการสอบ</span></div></header>
      <div class="tpl-prin">${TPL_DISCUSS.map(p=>`<div><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join("")}</div>
    </section>`;
}

function viewChecklist(){
  const groups = CHECK.filter(g=>CL_FILTER==="all"||g.type===CL_FILTER);
  const total = CHECK.reduce((a,g)=>a+g.items.length,0);
  const done = Object.values(CHECKED).filter(Boolean).length;
  return `<div class="phead"><div class="crumbs"><a href="#home">Hub</a> / Must-ask</div>
    <h1>Must-ask and must-examine</h1>
    <p class="muted" style="margin:0">Tick as you rehearse. Each item shows why it matters.</p></div>
    <div class="cl-top">
      <div class="seg" role="group" aria-label="กรอง">
        <button type="button" data-f="all" class="${CL_FILTER==="all"?"on":""}">All</button>
        <button type="button" data-f="ask" class="${CL_FILTER==="ask"?"on":""}">Must-ask</button>
        <button type="button" data-f="exam" class="${CL_FILTER==="exam"?"on":""}">Must-examine</button>
      </div>
      <span class="cnt">${done}/${total}</span>
      <button type="button" class="btn" id="clreset">Reset</button>
    </div>
    ${groups.map(g=>`<section class="panel cl-group"><h3><span>${esc(g.name.replace("ทุกเคส","every case"))}</span><span class="cnt">${g.items.filter((_,i)=>CHECKED[g.id+"-"+i]).length}/${g.items.length}</span></h3>
      ${g.items.map((it,i)=>{const key=g.id+"-"+i; const on=!!CHECKED[key];
        return `<div class="cl-item ${on?"done":""}"><input type="checkbox" id="c-${key}" data-k="${key}" ${on?"checked":""}><label for="c-${key}"><span>${esc(it[0])}</span>${MODE==="d"&&it[1]?`<span class="why">${esc(it[1])}</span>`:""}</label></div>`;}).join("")}
    </section>`).join("")}`;
}


function route(){
  const h = (location.hash||"#home").slice(1);
  const r = h.startsWith("n-") ? "browse" : (h.startsWith("d-")||h==="roadmap") ? "library" : h;
  let html;
  if(h.startsWith("n-")) html = viewNode(h.slice(2));
  else if(h==="browse") html = viewBrowse();
  else if(h==="template") html = viewTemplate();
  else if(h==="checklist") html = viewChecklist();
  else if(h==="library" || h==="roadmap") html = viewLibrary();
  else if(h.startsWith("d-")) html = viewDisease(h.slice(2));
  else html = viewHub();
  document.getElementById("app").innerHTML = html;
  document.querySelectorAll("[data-r]").forEach(a=>a.classList.toggle("on", a.dataset.r===(["browse","template","checklist","library"].includes(r)?r:"home")));
  bind();
}
function setMode(m){ MODE=m; save(); document.getElementById("m-t").classList.toggle("on",m==="t"); document.getElementById("m-d").classList.toggle("on",m==="d"); rerender(); }
function bind(){
  const q=document.getElementById("q"); if(q) q.addEventListener("input",e=>doSearch(e.target.value));
  document.querySelectorAll(".djump").forEach(b=>b.addEventListener("click",()=>{ const t=document.getElementById(b.dataset.jump); if(t){ const y=t.getBoundingClientRect().top+window.scrollY-120; window.scrollTo({top:y,behavior:"smooth"}); } }));
  const va=document.getElementById("vivaAll"); if(va) va.addEventListener("click",()=>{ const ds=[...document.querySelectorAll("details.viva")]; const open=!ds.every(x=>x.open); ds.forEach(x=>x.open=open); va.textContent=open?"Hide all answers":"Show all answers"; });
  const lq=document.getElementById("lq"); if(lq) lq.addEventListener("input",e=>{ LIBQ=e.target.value; const pos=e.target.selectionStart; route(); const n=document.getElementById("lq"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } });
  document.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{CL_FILTER=b.dataset.f; route();}));
  document.querySelectorAll(".cl-item input").forEach(c=>c.addEventListener("change",()=>{CHECKED[c.dataset.k]=c.checked; save(); const y=window.scrollY; route(); window.scrollTo(0,y);}));
  const r=document.getElementById("clreset"); if(r) r.addEventListener("click",()=>{CHECKED={}; save(); route();});
  document.querySelectorAll("[data-hg]").forEach(b=>b.addEventListener("click",()=>{ HUBG=b.dataset.hg; try{localStorage.setItem("atlas-hubg",HUBG);}catch(e){} const y=window.scrollY; route(); window.scrollTo(0,y); }));
  document.querySelectorAll("[data-from]").forEach(a=>a.addEventListener("click",()=>{ LASTTREE=a.dataset.from; }));
  document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{ const t=document.getElementById("g-"+b.dataset.jump); if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-130,behavior:"smooth"}); }));
  bindTree();
  bindHub();
}
document.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.m)));
let BACKTO=null;
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("[data-back]"); if(a) BACKTO=a.dataset.back;},true);
window.addEventListener("hashchange",()=>{SEL=null; if(!(location.hash||"").startsWith("#d-")) LASTTREE=null; document.getElementById("sheet").hidden=true; document.getElementById("tip").hidden=true; route(); window.scrollTo(0,0); if(BACKTO){const t=document.getElementById("g-"+BACKTO); BACKTO=null; if(t) window.scrollTo(0,t.getBoundingClientRect().top+window.scrollY-130);}});
setMode("d");
</script>
<script>
(function(){
  var W=["edema","hematuria","rising creatinine","hypokalemia","cloudy effluent","graft dysfunction","prolonged fever","hyponatremia"],i=0;
  var red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setInterval(function(){var el=document.getElementById("rotw"); if(!el||red) return; el.classList.add("out"); setTimeout(function(){i=(i+1)%W.length; el.textContent=W[i]; el.classList.remove("out");},360);},2400);
  function count(){document.querySelectorAll(".hero .tile .n").forEach(function(el){ if(el.dataset.fx) return; el.dataset.fx="1"; var txt=el.textContent; if(red||!/^\d+$/.test(txt)) return; var to=+txt,t0=performance.now(); (function f(t){var p=Math.min(1,Math.max(0,(t-t0)/900)); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f);})(t0);});}
  var app=document.getElementById("app"); if(app){ new MutationObserver(count).observe(app,{childList:true}); count(); }
  document.addEventListener("pointermove",function(e){var el=e.target&&e.target.closest?e.target.closest(".tile,.hero>.panel"):null; if(!el) return; var r=el.getBoundingClientRect(); el.style.setProperty("--mx",(e.clientX-r.left)+"px"); el.style.setProperty("--my",(e.clientY-r.top)+"px");});
  var pg=document.createElement("div"); pg.id="prog"; document.body.appendChild(pg);
  window.addEventListener("scroll",function(){var h=document.documentElement.scrollHeight-window.innerHeight; pg.style.width=(h>0?window.scrollY/h*100:0)+"%";},{passive:true});
  window.addEventListener("keydown",function(e){ if(e.key!=="/"||e.metaKey||e.ctrlKey||e.altKey) return; var t=e.target; if(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName)) return; var q=document.getElementById("q"); if(q){e.preventDefault(); q.focus();}});
})();
</script>
