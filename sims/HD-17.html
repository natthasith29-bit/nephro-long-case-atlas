<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[HD-17] Therapeutic Plasma Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../core/core.css">
<style>
.ctl{grid-template-columns:minmax(120px,160px) 1fr 104px}
.sel{display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px}
.sel label{font-weight:500}
select{max-width:100%;width:100%}
.readout{grid-template-columns:repeat(3,1fr)}
.pgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
@media (max-width:860px){.pgrid{grid-template-columns:1fr}}
body.present .pgrid{grid-template-columns:1.2fr 1fr;gap:12px}
body.present .find .card{display:none}
body.present .find{grid-template-columns:1fr}
body.present #plexsvg{max-height:300px}
</style>
</head>
<body>
<main class="sim" id="sim">
  <section class="bench one">
    <div class="card">
      <div class="pgrid"><div>
        <h2>Antibody ในพลาสมาตลอด course</h2>
        <div id="chart"></div>
        <div class="svgwrap no-present" style="margin-top:8px"><svg id="plexsvg" aria-label="Membrane plasma exchange circuit"></svg></div>
      </div><div>
        <h2>Prescription</h2>
        <div class="ctls" id="ctls"></div>
        <div class="readout">
          <div class="ro" id="roPV"><b>-</b><span>Plasma volume (L)</span></div>
          <div class="ro" id="roEx"><b>-</b><span>Exchange ต่อครั้ง (L)</span></div>
          <div class="ro" id="roOne"><b>-</b><span>เอาออกต่อครั้ง (%)</span></div>
          <div class="ro" id="roEnd"><b>-</b><span>เหลือท้าย course (%)</span></div>
          <div class="ro" id="roFib"><b>-</b><span>Fibrinogen nadir (mg/dL)</span></div>
          <div class="ro" id="roCa"><b>-</b><span>Citrate / Ca</span></div>
        </div>
        <p class="hint secondary" id="note"></p>
      </div></div>
    </div>
  </section>
</main>
<script src="../core/shell.js"></script>
<script src="../core/plot.js"></script>
<script src="../core/circuit.js"></script>
<script>
(function(){
"use strict";
var TGT={igg:{name:"IgG autoantibody (เช่น anti-GBM)",f:0.45},igm:{name:"IgM paraprotein (Waldenström)",f:0.76},vwf:{name:"ULVWF / anti-ADAMTS13",f:0.6}};
function P(o){ var d={tgt:"igg",w:65,hct:30,pv:1.0,n:14,every:1,rep:"alb",supp:0.8,fib:350}; for(var k in o) d[k]=o[k]; return d; }
var S = {
  antiGBM:{name:"Anti-GBM disease", p:P({}),
    rows:[["Regimen","PLEX 1 PV ทุกวัน 14 ครั้ง หรือจน anti-GBM ลบ ร่วมกับ cyclophosphamide และ steroid"],["Replacement","5% albumin ใช้ FFP บางส่วนถ้ามี DAH หรือเพิ่งทำ biopsy"],["Kinetics","IgG อยู่ในหลอดเลือดราว 45% จึง rebound ระหว่าง session ต้องทำหลายครั้ง"]],
    take:["ข้อบ่งชี้ชัด: anti-GBM ที่มี DAH หรือยังไม่ต้องฟอก","Dialysis-dependent ที่ไม่มี DAH และ crescent 100% ประโยชน์น้อย","1 PV เอาออกราว 63%, 1.5 PV ราว 78% เพิ่มเกินนี้คุ้มน้อยลง"],
    quiz:[{q:"ผู้ป่วย anti-GBM disease Cr 4.2 ไม่ต้องฟอก มี hemoptysis ข้อใดเหมาะที่สุด",opts:["Steroid อย่างเดียว","PLEX ทุกวันร่วมกับ cyclophosphamide และ steroid","Rituximab อย่างเดียว","รอผล biopsy ก่อนเริ่มรักษา"],ans:1,why:"anti-GBM มี DAH หรือยังไม่ dialysis-dependent เป็นข้อบ่งชี้ PLEX ทันทีร่วม immunosuppression ไม่ควรรอ biopsy"}]},
  ttp:{name:"iTTP", p:P({tgt:"vwf",pv:1.25,n:7,every:1,rep:"ffp",supp:0.6}),
    rows:[["Regimen","PLEX ทุกวัน 1–1.5 PV ด้วย FFP จน platelet > 150,000 สองวันติด"],["กลไก","เอา anti-ADAMTS13 ออกและเติม ADAMTS13 จาก FFP"],["ร่วมกับ","steroid, rituximab, caplacizumab"]],
    take:["iTTP ต้องใช้ FFP (หรือ cryo-poor plasma) เป็น replacement ไม่ใช่ albumin","เริ่ม PLEX ทันทีเมื่อสงสัย ไม่รอผล ADAMTS13","Caplacizumab ช่วยให้ platelet กลับปกติเร็วขึ้นและลด recurrence"],
    quiz:[{q:"ผู้ป่วยสงสัย iTTP (platelet 12,000 schistocyte, PLASMIC score 7) ระหว่างรอผล ADAMTS13 ข้อใดเหมาะที่สุด",opts:["รอผล ADAMTS13 ก่อน","เริ่ม PLEX ด้วย FFP ทันทีร่วมกับ steroid","PLEX ด้วย 5% albumin","Platelet transfusion"],ans:1,why:"iTTP เป็น emergency เริ่ม PLEX ด้วย plasma ทันที albumin ไม่มี ADAMTS13"}]},
  hypervisc:{name:"Hyperviscosity IgM", p:P({tgt:"igm",pv:1.0,n:2,every:1,supp:0.3}),
    rows:[["ผู้ป่วย","Waldenström ปวดศีรษะ ตามัว retinal vein engorgement"],["Kinetics","IgM อยู่ในหลอดเลือดราว 75% PLEX 1–2 ครั้งลด viscosity ได้มาก"],["ต่อด้วย","chemotherapy ควบคุม clone"]],
    take:["IgM เอาออกด้วย PLEX ได้ดีกว่า IgG เพราะอยู่ในหลอดเลือดมาก","Viscosity ลดมากเมื่อ IgM ลดเล็กน้อย (ความสัมพันธ์ไม่เป็นเส้นตรง)","Symptomatic hyperviscosity เป็นข้อบ่งชี้ชัดของ PLEX"],
    quiz:[{q:"ทำไม PLEX ลด IgM ได้เร็วกว่า IgG ต่อจำนวนครั้งเท่ากัน",opts:["IgM เล็กกว่า","IgM ส่วนใหญ่อยู่ใน intravascular space","IgM สร้างช้ากว่า","IgM จับ albumin"],ans:1,why:"ราว 75% ของ IgM อยู่ในหลอดเลือด rebound จาก extravascular จึงน้อย"}]},
  pexivas:{name:"ANCA vasculitis (PEXIVAS)", p:P({pv:1.0,n:7,every:2,supp:0.8}),
    rows:[["Regimen","PLEX 7 ครั้งใน 14 วัน (60 ml/kg)"],["Evidence","PEXIVAS (n 704): PLEX ไม่ลด death หรือ ESKD (HR 0.86, 95% CI 0.65–1.13)"],["การใช้ปัจจุบัน","พิจารณาเฉพาะราย เช่น Cr > 3.4 mg/dL, ต้องฟอก หรือ Cr ขึ้นเร็ว, DAH ร่วม hypoxemia หรือ double positive anti-GBM"]],
    take:["PLEX ไม่ลด death หรือ ESKD ในภาพรวม จึงไม่ทำ routine ใน ANCA vasculitis","อาจลด ESKD ระยะสั้นในกลุ่ม Cr สูงมาก แต่เพิ่ม infection พิจารณาเป็นรายๆ","Double positive (ANCA + anti-GBM) รักษาแบบ anti-GBM"],
    quiz:[{q:"ผู้ป่วย MPO-ANCA vasculitis Cr 2.1 ไม่มี DAH ข้อใดเหมาะที่สุด",opts:["PLEX ทุกราย","Induction ด้วย rituximab หรือ cyclophosphamide ร่วม steroid ไม่ต้อง PLEX routine","PLEX อย่างเดียว","IVIG"],ans:1,why:"PEXIVAS ไม่พบประโยชน์ของ PLEX ต่อ death หรือ ESKD ในภาพรวม"}]},
  fsgs:{name:"Recurrent FSGS หลัง KT", p:P({tgt:"igg",pv:1.0,n:10,every:2,supp:0.5}),
    rows:[["ผู้ป่วย","proteinuria 8 g/d ภายในสัปดาห์แรกหลัง KT ชิ้นเนื้อเป็น podocytopathy"],["Regimen","PLEX วันเว้นวันร่วมกับ rituximab"],["เป้า","ลด circulating permeability factor (เช่น anti-nephrin)"]],
    take:["Recurrent FSGS หลัง KT เป็นข้อบ่งชี้ชัดของ PLEX","เริ่มเร็วให้ผลดีกว่า","บางศูนย์ทำ pre-emptive PLEX ในผู้ที่เคย recur ใน graft ก่อน"],
    quiz:[{q:"ผู้รับไตที่โรคเดิมเป็น primary FSGS มี proteinuria 9 g/d วันที่ 5 หลัง KT ข้อใดเหมาะที่สุด",opts:["ติดตามต่อ","เริ่ม PLEX ร่วมกับ rituximab และ RAAS blockade","เพิ่ม tacrolimus อย่างเดียว","ตัดไตออก"],ans:1,why:"recurrent FSGS early ควรเริ่ม PLEX เร็ว"}]}
};
var ORDER=["antiGBM","ttp","hypervisc","pexivas","fsgs"];

var box=document.getElementById("ctls"), C={};
var tSel=Sim.h("select",{id:"sT"},Object.keys(TGT).map(function(k){ return Sim.h("option",{value:k,text:TGT[k].name}); }));
var rSel=Sim.h("select",{id:"sR"},[["alb","5% albumin"],["ffp","FFP"],["mix","Albumin + FFP 1 L ท้าย"]].map(function(x){ return Sim.h("option",{value:x[0],text:x[1]}); }));
tSel.addEventListener("change",update); rSel.addEventListener("change",update);
box.appendChild(Sim.h("div",{class:"sel"},[Sim.h("label",{"for":"sT",text:"Target"}),tSel]));
box.appendChild(Sim.h("div",{class:"sel"},[Sim.h("label",{"for":"sR",text:"Replacement"}),rSel]));
function sl(k,o){ o.id="s"+k; o.onInput=update; C[k]=Sim.slider(o); box.appendChild(C[k].el); return C[k]; }
sl("pv",{label:"Exchange",min:0.5,max:2,step:0.25,value:1,unit:"PV",fmt:function(v){return v.toFixed(2);}});
sl("n",{label:"จำนวนครั้ง",min:1,max:14,step:1,value:14,unit:"ครั้ง"});
sl("every",{label:"ทุก",min:1,max:3,step:1,value:1,unit:"วัน"});
sl("supp",{label:"Immunosuppression",min:0,max:1,step:0.1,value:0.8,unit:"%",fmt:function(v){return Math.round(v*100);}});
sl("w",{label:"น้ำหนัก",min:40,max:110,step:1,value:65,unit:"kg"}).el.classList.add("secondary");
sl("hct",{label:"Hct",min:20,max:50,step:1,value:30,unit:"%"}).el.classList.add("secondary");

var A=Plot.colors, chart=Plot.chart(document.getElementById("chart"),{height:240,aria:"Antibody level during plasma exchange course",
  x:{min:0,max:30,step:5,label:"Day"}, y:{min:0,max:110,step:20,label:"% of baseline"},
  series:[{id:"ab",name:"Plasma level",color:A.accent,data:[],width:2.4},{id:"fib",name:"Fibrinogen",color:A.gold,data:[],width:1.6,dash:[5,4]}],legend:true});
var pc=Circuit.preset.plex(document.getElementById("plexsvg"));

function update(){
  var t=TGT[tSel.value], w=C.w.get(), hct=C.hct.get()/100, pvL=0.07*w*(1-hct), npv=C.pv.get(), n=C.n.get(), ev=C.every.get(), supp=C.supp.get(), rep=rSel.value;
  var f=t.f, I=f, E=1-f, data=[], fibD=[], fib=100, sess=[], k=1/30, prod=0.0012*(1-supp), cat=0.0012, fibMin=100;
  for(var i=0;i<n;i++) sess.push(i*ev*24);
  var days=Math.max(30, (n-1)*ev+10); var hrs=days*24;
  for(var h=0;h<=hrs;h++){
    if(h%4===0){ data.push([h/24,(I/f)*100]); fibD.push([h/24,fib]); }
    if(sess.indexOf(h)>=0){ data.push([h/24+0.01,(I/f)*100*Math.exp(-npv)]);  var r=Math.exp(-npv); I*=r; if(rep==="alb") fib*=r; else if(rep==="mix") fib=fib*r+ (100-fib*r)*0.25; }
    var ci=I/f, ce=E/(1-f), x=k*(ce-ci)*f*(1-f);
    I+=x+prod*f-cat*I; E+=-x+prod*(1-f)-cat*E;
    fib+=(100-fib)/40; if(fib<fibMin) fibMin=fib;
  }
  chart.update({x:{min:0,max:days,step:days>30?10:5,label:"Day"},vlines:sess.slice(0,1).map(function(s){return {x:0,label:"Start"};})});
  chart.setSeries("ab",data); chart.setSeries("fib",rep==="ffp"?[]:fibD);
  var endIdx=Math.min(data.length-1,Math.round(((n-1)*ev*24+24)/4)), endV=data[endIdx][1];
  var fibNadir=Math.round(3.5*fibMin), caRisk=rep!=="alb"?"สูง (citrate ใน FFP)":"ปานกลาง";
  pc.setReplacement(rep==="alb"?"albumin":"plasma"); pc.setFlows({Qb:100,Qp:Math.round(npv*pvL*1000/120),Qr:Math.round(npv*pvL*1000/120)});
  Sim.ro("roPV",Sim.fmt(pvL,2));
  Sim.ro("roEx",Sim.fmt(pvL*npv,1));
  Sim.ro("roOne",Sim.fmt((1-Math.exp(-npv))*100,0));
  Sim.ro("roEnd",Sim.fmt(endV,0),endV>40?"flag":"ok");
  Sim.ro("roFib",rep==="ffp"?"คงที่":Sim.fmt(fibNadir,0),(rep!=="ffp"&&fibNadir<100)?"flag":"ok");
  Sim.ro("roCa",caRisk,rep!=="alb"?"flag":false);
  var note=document.getElementById("note");
  note.textContent="PV = 0.07 × น้ำหนัก × (1 − Hct) = "+Sim.fmt(pvL,2)+" L, เอาออกต่อครั้ง = 1 − e^(−"+npv.toFixed(2)+") = "+Sim.fmt((1-Math.exp(-npv))*100,0)+"%"+(tSel.value==="vwf"&&rep==="alb"?" iTTP ต้องใช้ plasma replacement":"");
  if(tSel.value==="vwf"&&rep==="alb") pc.alarm({text:"iTTP: use FFP, not albumin"}); else if(rep==="alb"&&fibNadir<100) pc.alarm({text:"Low fibrinogen, avoid procedures",level:"amber"}); else pc.alarm(null);
}
Sim.mount({code:"HD-17", title:"Therapeutic Plasma Exchange", lead:"ปรับ exchange volume จำนวนครั้ง ความถี่ และ replacement แล้วดู antibody kinetics, rebound และ fibrinogen",
  scenarios:S, order:ORDER, captureMs:2000,
  onChange:function(k,s){ var p=s.p; tSel.value=p.tgt; rSel.value=p.rep; ["pv","n","every","supp","w","hct"].forEach(function(x){ C[x].set(p[x]); }); update(); },
  refs:["Connelly-Smith L, Alquist CR, Aqui NA, et al. Guidelines on the use of therapeutic apheresis in clinical practice: evidence-based approach from the Writing Committee of the American Society for Apheresis (ninth special issue). J Clin Apher 2023, 38(2): 77-278",
        "Walsh M, Merkel PA, Peh CA, et al (PEXIVAS). Plasma exchange and glucocorticoids in severe ANCA-associated vasculitis. N Engl J Med 2020, 382(7): 622-631",
        "Scully M, Cataland SR, Peyvandi F, et al (HERCULES). Caplacizumab treatment for acquired thrombotic thrombocytopenic purpura. N Engl J Med 2019, 380(4): 335-346",
        "Kaplan AA. Therapeutic plasma exchange: a technical and operational review. J Clin Apher 2013, 28(1): 3-10",
        "Kidney Disease: Improving Global Outcomes (KDIGO) Glomerular Diseases Work Group. KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021, 100(4S): S1-S276",
        "Kidney Disease: Improving Global Outcomes (KDIGO) ANCA Vasculitis Work Group. KDIGO 2024 Clinical Practice Guideline for the Management of Antineutrophil Cytoplasmic Antibody (ANCA)-Associated Vasculitis. Kidney Int 2024, 105(3S): S71-S116"],
  note:"Model เพื่อการสอน: removal ต่อครั้ง 1 − e^(−PV exchanged), redistribution จาก extravascular time constant ราว 30 ชั่วโมง, synthesis ลดตาม immunosuppression, fibrinogen ฟื้นราว 40 ชั่วโมง"
});
})();
</script>
</body>
</html>
