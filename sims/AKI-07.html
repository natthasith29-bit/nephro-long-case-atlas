<link rel="stylesheet" href="../core/core.css">
<style>
@media (min-width:901px){.bench{grid-template-columns:1fr 1.1fr}}
.sel{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr);gap:12px;align-items:center;font-size:14px}
.sel label{font-weight:500}
select{max-width:100%;min-width:0;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sites{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sites span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--faint)}
.sites span.on{border-color:var(--ink);color:#fff;background:var(--ink)}
table.card2{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
table.card2 th{text-align:left;font-weight:500;color:var(--muted);width:30%;padding:7px 8px 7px 0;vertical-align:top;border-top:1px solid var(--line)}
table.card2 td{padding:7px 0;border-top:1px solid var(--line)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:12px;font-size:13px}
.meter .bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold),var(--red))}
.tools{margin-top:10px}
.act{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--canvas);font-size:14px}
.act b{font-weight:600}
.act.bad{background:var(--pink)}
body.present .find .card{display:none}
body.present .find{grid-template-columns:1fr}
body.present .hint,body.present .legend{display:none}
body.present .card{padding:14px 18px}
body.present .card h2{margin-bottom:6px}
body.present .svgwrap svg{max-height:400px}
body.present table.card2{font-size:12px}
body.present table.card2 th,body.present table.card2 td{padding:4px 0}
body.present .tog{padding:4px 9px;font-size:12px}
body.present .act{margin-top:6px;padding:7px 12px;font-size:12.5px}
</style>
</head>

      <div class="act" id="act"></div>
    </div>
  </section>
</main>

  var list=Object.keys(D).filter(function(k){ return D[k].seg.indexOf(seg)>=0; }).map(function(k){ return D[k].n; });
  var a=document.getElementById("act"); a.className="act";
  a.innerHTML="<b>"+seg+":</b> "+(list.length?list.join(", "):"ไม่มียาในรายการที่เด่นที่ segment นี้");
}
function update(){
  var k=ds.value, d=D[k];
  M.highlight(d.seg,"#FFDE59"); overlay(d);
  var st=document.getElementById("sites"); st.innerHTML="";
  Object.keys(SITE).forEach(function(s){ st.appendChild(Sim.h("span",{class:d.site.indexOf(s)>=0?"on":"",text:SITE[s]})); });
  var tbl=document.getElementById("dcard"); tbl.innerHTML="";
  [["กลไก",d.mech],["เวลาเกิด",d.on],["Clue",d.clue],["ป้องกัน",d.prev],["รักษา",d.mgmt]].forEach(function(r){ tbl.appendChild(Sim.h("tr",{},[Sim.h("th",{text:r[0]}),Sim.h("td",{text:r[1]})])); });
  var n=Object.keys(RF).filter(on).length, base={hemo:1,glom:0.6,tma:0.6,pt:1.2,distal:0.8,cd:0.6,crystal:1,ain:0.5};
  var b=d.site.reduce(function(a,s){ return Math.max(a,base[s]); },0.5);
  var r=Math.min(1,0.12+b*0.18+n*0.16+(on("vol")&&(d.site.indexOf("crystal")>=0||d.site.indexOf("hemo")>=0)?0.15:0));
  document.getElementById("rbar").style.width=Math.round(r*100)+"%";
  document.getElementById("rtxt").textContent=r<0.35?"low":r<0.65?"moderate":"high";
  var a=document.getElementById("act"), m;
  if(d.site.indexOf("crystal")>=0) m="ส่ง urine microscopy ดู crystal หยุดหรือลดยา hydration และปรับ urine pH ตามชนิดยา";
  else if(d.site.indexOf("ain")>=0&&d.site.length<=2) m="หยุดยาที่สงสัย ดู urine WBC/WBC casts ถ้า Cr ไม่ลดใน 3–5 วันหรือรุนแรง biopsy แล้วพิจารณา steroid";
  else if(d.site.indexOf("tma")>=0) m="ตรวจ BP, UPCR, LDH, haptoglobin, smear ถ้าสงสัย TMA จำกัดที่ไตพิจารณา biopsy hold ยา";
  else if(d.site.indexOf("pt")>=0) m="ปรับ dose ตาม GFR และ drug level หลีกเลี่ยง nephrotoxin อื่นพร้อมกัน ตรวจ Mg, K, P, urine glucose";
  else m="Hold ยาเมื่อ volume ลด แก้ volume แล้วประเมิน Cr ใหม่";
  if(r>=0.65) m+=" ความเสี่ยงสูง: พิจารณายาทางเลือกที่ไม่เป็นพิษต่อไต และติดตาม Cr ทุก 24–48 ชม. (nephrotoxin stewardship)";
  a.innerHTML="<b>Next step:</b> "+m; a.className="act"+(r>=0.65?" bad":"");
}

        "Seethapathy H, Zhao S, Chute DF, et al. The incidence, causes, and risk factors of acute kidney injury in patients receiving immune checkpoint inhibitors. Clin J Am Soc Nephrol 2019, 14(12): 1692-1700",
        "Izzedine H, Perazella MA. Anticancer drug-induced acute kidney injury. Kidney Int Rep 2017, 2(4): 504-514"],

});
