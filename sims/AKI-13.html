<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[AKI-13] Drug-Induced Kidney Disease: Mechanism by Phenotype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../core/core.css">
<style>
@media (min-width:901px){.bench{grid-template-columns:1.6fr 1fr}}
.readout{grid-template-columns:1fr}
.readout .ro b{font-size:20px;line-height:1.25}
#vis,#mapA{width:100%;height:auto;display:block}
.svgwrap{overflow-x:auto}
@media (max-width:820px){#vis,#mapA{min-width:700px}}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.dchips button{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13.5px var(--body);cursor:pointer}
.dchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.dchips button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.ctlnote{font-size:13px;color:var(--muted);margin:-4px 0 10px}
#vis .dot{pointer-events:none}
.sel{display:grid;grid-template-columns:minmax(70px,110px) minmax(0,1fr);gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.sel label{font-weight:500}
select{max-width:100%;min-width:0;width:100%}
table.syn{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.syn th,table.syn td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.syn th{font-weight:600;color:var(--muted);font-size:12.5px}
table.syn tr{cursor:pointer}
table.syn tr.on td{background:var(--accent-soft)}
table.syn td.n{font-family:var(--mono);width:26px}
table.syn .q{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
[hidden]{display:none!important}
body.present .hint{display:none}
body.present .card{padding:12px 16px}
body.present .take ul{columns:3;column-gap:22px}
body.present .take li{font-size:13px;line-height:1.4;break-inside:avoid}
body.present .take h3{margin-bottom:4px}
body.present .takeaway{font-size:14px;padding:6px 12px;margin-top:6px}
body.present .readout .ro b{font-size:17px}
body.present .ro{padding:6px 10px}
body.present .dchips{margin-bottom:6px}
body.present .find .card{display:none}
body.present .find{grid-template-columns:1fr}
body.present #vis{max-height:420px}
body.present #mapA{max-height:300px}
body.present table.syn{font-size:11.5px}
body.present table.syn td,body.present table.syn th{padding:3px 5px}
body.present table.syn td div{display:none}
body.present #atlasView table.syn tr:nth-child(n+7){display:none}
body.present #mapA{max-height:270px}
body.present .dchips button{padding:4px 10px;font-size:12.5px}
</style>
</head>
<body>
<main class="sim" id="sim">
  <section class="bench">
    <div class="card">
      <h2 id="h2L">-</h2>
      <div id="mechView">
        <div class="svgwrap"><svg id="vis" viewBox="0 0 760 420" role="img" aria-label="Mechanism"></svg><div id="pathoBox" hidden></div></div>
        <p class="takeaway" id="tk"></p>
      </div>
      <div id="atlasView" hidden>
        <div class="svgwrap"><svg id="mapA" viewBox="0 0 760 430" role="img" aria-label="Nephron compartments for the selected drug"></svg></div>
        <p class="takeaway" id="tkA"></p>
        <table class="syn" id="synT"></table>
        <details class="more"><summary>ตำแหน่งตาม KDIGO 2026 (function x damage)</summary><div class="more-body"><svg id="quadA" viewBox="0 0 300 250" style="max-width:340px;width:100%" role="img" aria-label="Function and damage quadrant"></svg></div></details>
      </div>
    </div>
    <div class="card">
      <h2 id="h2R">เลือกยาและปรับ</h2>
      <div id="mechCtl"><div class="dchips" id="dchips" role="group" aria-label="Drug"></div><p class="ctlnote" id="dnote"></p><div class="ctls" id="ctls"></div></div>
      <div id="atlasCtl" hidden>
        <div class="sel"><label for="clsS">กลุ่มยา</label><select id="clsS"></select></div>
        <div class="sel"><label for="drugS">ยา</label><select id="drugS"></select></div>
      </div>
      <div class="readout">
        <div class="ro" id="ro1"><b>-</b><span>-</span></div>
        <div class="ro" id="ro2"><b>-</b><span>-</span></div>
        <div class="ro" id="ro3"><b>-</b><span>-</span></div>
      </div>
    </div>
  </section>
</main>
<script src="../core/shell.js"></script>
<script src="../core/patho.js"></script>
<script>
(function(){
"use strict";
var FONT="IBM Plex Sans Thai, sans-serif", MONO="Geist Mono, monospace";
var C={ink:"#0B0B1F",acc:"#5B4BFF",acc2:"#19C8E6",soft:"#EFEDFF",line:"#E6E7F0",line2:"#D3D5E2",muted:"#5E6075",faint:"#9A9CB2",red:"#B4232A",teal:"#1F7A72",gold:"#A8842C",canvas:"#F4F5F9"};
function SV(t,a,p){ var o={}; for(var k in a){ if(a[k]!==null && a[k]!==undefined) o[k]=a[k]; } return Sim.svg(t,o,p); }
function cl(x,a,b){ return x<a?a:(x>b?b:x); }
function uniq(a){ return a.filter(function(x,i){return a.indexOf(x)===i;}); }
function roSet(id,val,label,state){ var e=document.getElementById(id); e.querySelector("span").textContent=label; Sim.ro(id,val,state); e.querySelector("b").style.fontSize=String(val).length>22?"16px":""; }
/* ================= drawing helpers ================= */
var ANIM=!(Sim.reduce||Sim.capture);
function T(p,x,y,t,o){ o=o||{}; return SV("text",{x:x,y:y,"font-family":o.mono?MONO:FONT,"font-size":o.fs||12,"font-weight":o.fw||null,fill:o.c||C.ink,"text-anchor":o.a||null,text:t},p); }
function pill(p,x,y,w,label,st,sub){
  var fill={n:"#fff",b:"#FBE9EA",g:"#E3F3F1",f:"#FBE9EA",d:C.soft}[st]||"#fff";
  var stroke={n:C.line2,b:C.red,g:C.teal,f:C.red,d:C.acc}[st]||C.line2;
  SV("rect",{x:x-w/2,y:y-14,width:w,height:28,rx:14,fill:fill,stroke:stroke,"stroke-width":st==="n"?1.5:2.4,"stroke-dasharray":st==="f"?"4 3":null},p);
  T(p,x,y+4,label,{a:"middle",fs:11.5,fw:600,c:(st==="b"||st==="f")?C.red:(st==="g"?C.teal:(st==="d"?C.acc:C.ink))});
  if(st==="b"||st==="f"){ var bx=x+w/2+10;
    SV("circle",{cx:bx,cy:y-8,r:9,fill:C.red},p);
    SV("rect",{x:bx-5,y:y-9.6,width:10,height:3.2,rx:1.6,fill:"#fff"},p); }
  if(st==="g") SV("path",{d:"M"+(x+w/2+3)+" "+(y-1)+" l8 -13 l8 13 z",fill:C.teal},p);
  if(sub) T(p,x,y+27,sub,{a:"middle",fs:10,c:C.muted});
}
function dots(p,d,n,dur,col,r){
  var path=SV("path",{d:d,fill:"none",stroke:"none"},p), L=path.getTotalLength();
  for(var i=0;i<n;i++){
    var c=SV("circle",{r:r||4,fill:col,"class":"dot"},p);
    if(ANIM && dur>0){ SV("animateMotion",{dur:dur+"s",repeatCount:"indefinite",begin:(-dur*i/n)+"s",path:d},c); }
    else { var pt=path.getPointAtLength(L*(i+.5)/n); c.setAttribute("cx",pt.x); c.setAttribute("cy",pt.y); }
  }
}
function arrow(p,x1,y1,x2,y2,col,w){
  var a=Math.atan2(y2-y1,x2-x1), h=9;
  SV("line",{x1:x1,y1:y1,x2:x2-Math.cos(a)*h*.8,y2:y2-Math.sin(a)*h*.8,stroke:col,"stroke-width":w||2.5,"stroke-linecap":"round"},p);
  SV("path",{d:"M"+x2+" "+y2+" L"+(x2-h*Math.cos(a-.45))+" "+(y2-h*Math.sin(a-.45))+" L"+(x2-h*Math.cos(a+.45))+" "+(y2-h*Math.sin(a+.45))+" Z",fill:col},p);
}
function cellFrame(p,title,cellFill){
  SV("rect",{x:14,y:44,width:150,height:340,rx:16,fill:"#F2F8FB"},p);
  T(p,89,66,"Tubular lumen",{a:"middle",fs:12,fw:600,c:C.muted});
  SV("rect",{x:600,y:44,width:146,height:340,rx:16,fill:"#FBF1F1"},p);
  T(p,673,66,"Blood",{a:"middle",fs:12,fw:600,c:C.muted});
  SV("rect",{x:178,y:52,width:408,height:324,rx:28,fill:cellFill||"#fff",stroke:C.line2,"stroke-width":2},p);
  T(p,382,30,title,{a:"middle",fs:14,fw:600});
}
function badgeRow(p,y,items){
  var x=20;
  items.forEach(function(it){
    var w=it[0].length*7.4+24, col=it[1]==="up"?C.red:(it[1]==="down"?"#0E7FA0":C.teal);
    SV("rect",{x:x,y:y-15,width:w,height:25,rx:12,fill:"#fff",stroke:col,"stroke-width":1.8},p);
    T(p,x+w/2,y+3,it[0],{a:"middle",fs:12,fw:600,c:col}); x+=w+8;
  });
}
/* ================= Scenes ================= */
var SC={};

/* ---------- 1 Haemodynamic ---------- */
SC.hemo={
  h2:"ยาเปลี่ยน tone ของ afferent และ efferent แล้ว GFR เปลี่ยนตาม",
  drugs:[["nsaid","NSAID"],["acei","ACEi / ARB"],["diu","Diuretic"],["cni","CNI"],["sglt2","SGLT2i"]], multi:true,
  init:{sel:{nsaid:true,acei:true,diu:true},vol:true},
  note:"กดเลือกยาได้หลายตัวพร้อมกัน",
  ctls:function(P){ return [Sim.h("div",{"class":"tools"},[Sim.toggle("Volume depletion (ท้องเสีย กินได้น้อย)",function(v){P.vol=v;redraw();},P.vol)])]; },
  draw:function(svg,P){
    var s=P.sel, vol=P.vol;
    var MAP=(vol?76:92)-(s.diu?4:0);
    var Ra=(vol&&!s.nsaid?.78:1)*(s.nsaid?1.15:1)*(s.cni?1.3:1)*(s.sglt2?1.08:1);
    var Re=vol?(s.acei?.8:1.4):(s.acei?.88:1);
    var Q=(MAP-8)/(Ra+Re), PGC=8+Q*Re, Q0=42;
    var gfr=Math.max(4,cl((PGC-32)/18,0,1.2)*Math.pow(Q/Q0,.25)*100);
    var wa=cl(32/Math.pow(Ra,2.1),8,46), we=cl(26/Math.pow(Re,2.1),7,46);
    T(svg,382,26,"Glomerular hemodynamics",{a:"middle",fs:14,fw:600});
    SV("path",{d:"M24 206 L286 206",stroke:"#E7B9BC","stroke-width":wa,"stroke-linecap":"round"},svg);
    SV("path",{d:"M478 206 L736 206",stroke:"#E7B9BC","stroke-width":we,"stroke-linecap":"round"},svg);
    T(svg,30,206-wa/2-14,"Afferent arteriole",{fs:12.5,fw:600});
    T(svg,730,206-we/2-14,"Efferent arteriole",{fs:12.5,fw:600,a:"end"});
    SV("circle",{cx:382,cy:206,r:100,fill:"#fff",stroke:C.line2,"stroke-width":2},svg);
    var pc=cl((PGC-30)/25,0,1);
    for(var i=0;i<7;i++){ var an=i/7*Math.PI*2; SV("circle",{cx:382+42*Math.cos(an),cy:206+42*Math.sin(an),r:22,fill:"rgba(180,35,42,"+(.1+.42*pc)+")",stroke:"#d9a7aa"},svg); }
    T(svg,382,200,"PGC",{a:"middle",fs:12,c:C.muted});
    T(svg,382,224,Math.round(PGC)+" mmHg",{a:"middle",fs:16,fw:600,mono:1});
    dots(svg,"M24 206 L286 206 L478 206 L736 206",14,cl(6*Q0/Q,2.5,14),"#B4232A",4);
    arrow(svg,382,310,382,368,C.acc,cl(gfr/100*16,2.5,18));
    T(svg,398,356,"GFR "+Math.round(gfr)+"%",{fs:16,fw:600,c:C.acc,mono:1});
    var aL=[], eL=[];
    if(vol&&!s.nsaid) aL.push(["PGE2 and PGI2 still dilating",C.teal]);
    if(s.nsaid) aL.push(["NSAID: prostaglandin dilation lost",C.red]);
    if(s.cni) aL.push(["CNI: endothelin, TXA2, less NO",C.red]);
    if(s.sglt2) aL.push(["SGLT2i: NaCl at macula densa, TGF",C.gold]);
    if(vol&&!s.acei) eL.push(["Angiotensin II still constricting",C.teal]);
    if(s.acei) eL.push(["ACEi/ARB: Ang II tone lost",C.red]);
    if(s.diu) eL.push(["Diuretic: less effective volume",C.gold]);
    aL.forEach(function(l,i){ T(svg,30,262+i*20+wa/2,l[0],{fs:12,c:l[1],fw:600}); });
    eL.forEach(function(l,i){ T(svg,730,262+i*20+we/2,l[0],{fs:12,c:l[1],fw:600,a:"end"}); });
    T(svg,24,410,"MAP "+MAP+" mmHg"+(vol?"   volume depleted":""),{fs:13,c:C.muted,mono:1});
    T(svg,736,410,"Afferent "+(Ra>1.05?"constricted":(Ra<.95?"dilated":"normal"))+"   /   Efferent "+(Re>1.05?"constricted":(Re<.95?"dilated":"normal")),{fs:13,c:C.muted,a:"end"});
    var trip=s.nsaid&&s.acei&&(s.diu||vol);
    var tk;
    if(gfr<45) tk="<b>"+(trip?"Triple whammy":"Afferent หดพร้อม efferent ขยาย")+"</b> PGC ตกเหลือ "+Math.round(PGC)+" mmHg GFR เหลือ <span class=\"num\">"+Math.round(gfr)+"%</span> ทั้งที่ tubule ยังไม่เสียหาย urine จึง bland แก้ volume และหยุด NSAID แล้วฟื้นได้";
    else if(gfr<90) tk="GFR เหลือ <span class=\"num\">"+Math.round(gfr)+"%</span> จากการเปลี่ยน tone เป็น dysfunction without damage ถ้าเป็น dip ที่คาดไว้จาก RASi หรือ SGLT2i ไม่ต้องหยุดยา";
    else tk="ไตยังรักษา PGC ไว้ที่ "+Math.round(PGC)+" mmHg เพราะ prostaglandin ขยาย afferent และ angiotensin II หด efferent ชดเชยกันอยู่";
    return {ro:[[Math.round(gfr)+"%","GFR เทียบปกติ",gfr<60?"flag":"ok"],
      [Math.round(PGC)+" mmHg","Glomerular capillary pressure",PGC<44?"flag":null],
      [trip?"Triple whammy":(gfr<60?"Hemodynamic AKI":"ยังชดเชยได้"),"Phenotype",gfr<60?"flag":"ok"]],tk:tk};
  },
  rows:[["กลไก","Afferent ขยายด้วย prostaglandin efferent หดด้วย angiotensin II เมื่อ volume ต่ำไตต้องพึ่งทั้งสองอย่าง"],
   ["ยาที่หด afferent","NSAID, COX-2i, CNI, SGLT2i (TGF), iodinated contrast"],
   ["ยาที่ขยาย efferent","ACEi, ARB, ARNI, aliskiren"],
   ["Urine","bland FENa ต่ำ (ไม่น่าเชื่อถือถ้าได้ diuretic)"]],
  take:["Hemodynamic AKI คือ dysfunction without damage ฟื้นใน 24–72 ชม. หลังแก้ volume และหยุด NSAID",
   "NSAID + RASi + diuretic เสี่ยงสูงสุดในเดือนแรกของการใช้ร่วมกัน",
   "Cr ขึ้นไม่เกิน 30% หลังเริ่ม RASi หรือ dip เล็กน้อยจาก SGLT2i เป็นสิ่งที่คาดไว้ ไม่ต้องหยุดยา",
   "อันตรายที่ใหญ่กว่าคือหยุดยาที่ปกป้องหัวใจและไตแล้วไม่ได้เริ่มใหม่"]
};
/* ---------- 2 Pseudo-AKI ---------- */
var PSD={
 tmp:{n:"Trimethoprim",oct:.8,mate:.8,note:"บล็อก OCT2 และ MATE (และบล็อก ENaC ทำ K สูงแยกกัน)"},
 cim:{n:"Cimetidine",oct:.7,mate:.7,note:"บล็อก OCT2 และ MATE"},
 dtg:{n:"Dolutegravir",oct:.55,note:"บล็อก OCT2 iohexol GFR ไม่เปลี่ยน"},
 cobi:{n:"Cobicistat",mate:.65,note:"บล็อก MATE1 และยังเพิ่ม exposure ของ tenofovir"},
 cdk:{n:"CDK4/6 inhibitor",oct:.6,mate:.6,note:"abemaciclib, ribociclib Cr ขึ้นแล้ว plateau"},
 tzp:{n:"Pip-tazo + vancomycin",oat:.5,note:"แย่ง OAT1/3 vancomycin ลดการแสดงออกของ transporter"},
 none:{n:"ไม่มียา",note:"creatinine ถูกกรองและ secrete ตามปกติ"}
};
SC.pseudo={
  h2:"Cr ขึ้นเพราะ secretion ถูกบล็อก แต่ GFR ไม่ได้ลด",
  drugs:Object.keys(PSD).map(function(k){return [k,PSD[k].n];}),
  init:{sel:"tmp",gfr:60},
  noteF:function(P){ return PSD[P.sel].note; },
  ctls:function(P){ return [Sim.slider({id:"pg",label:"GFR จริงของผู้ป่วย",min:15,max:110,step:5,value:P.gfr,unit:"mL/min",onInput:function(v){P.gfr=v;redraw();}}).el]; },
  draw:function(svg,P){
    var d=PSD[P.sel];
    var sec=.1+.3*cl(1-P.gfr/100,0,1);
    var block=Math.max(d.oct||0,d.mate||0,d.oat||0);
    var rise=1/(1-sec*block)-1;
    SV("rect",{x:14,y:40,width:150,height:258,rx:16,fill:"#F2F8FB"},svg);
    T(svg,89,62,"Tubular lumen",{a:"middle",fs:12,fw:600,c:C.muted});
    SV("rect",{x:600,y:40,width:146,height:258,rx:16,fill:"#FBF1F1"},svg);
    T(svg,673,62,"Blood",{a:"middle",fs:12,fw:600,c:C.muted});
    SV("rect",{x:178,y:48,width:408,height:242,rx:28,fill:"#fff",stroke:C.line2,"stroke-width":2},svg);
    T(svg,382,28,"Proximal tubule cell: how creatinine leaves the blood",{a:"middle",fs:14,fw:600});
    T(svg,89,86,"Filtered Cr (unchanged)",{a:"middle",fs:11,c:C.muted});
    dots(svg,"M89 98 L89 290",5,6,"#9A9CB2",4);
    pill(svg,586,120,96,"OCT2",d.oct?"b":"n","uptake");
    pill(svg,586,208,96,"OAT1/3",d.oat?"b":"n","uptake");
    pill(svg,178,164,108,"MATE1/2-K",d.mate?"b":"n","efflux to urine");
    var flow=1-block, path="M702 120 L586 120 L380 150 L178 164 L56 164";
    SV("path",{d:path,fill:"none",stroke:block>.3?"#E3C4C6":C.line2,"stroke-width":2,"stroke-dasharray":block>.3?"6 5":null},svg);
    if(flow>.15) dots(svg,path,Math.max(2,Math.round(7*flow)),7,"#7a6cff",4.5);
    else { dots(svg,"M702 120 L632 120",3,3,"#7a6cff",4.5); T(svg,660,152,"stopped",{a:"middle",fs:11.5,c:C.red,fw:600}); }
    T(svg,382,250,"Secretion = "+Math.round(sec*100)+"% of creatinine clearance at GFR "+P.gfr,{a:"middle",fs:12,c:C.muted});
    T(svg,382,272,block?("Drug blocks "+Math.round(block*100)+"% of that secretion"):"Nothing blocked",{a:"middle",fs:12.5,fw:600,c:block?C.red:C.teal});
    var bx=200, bw=420, y0=334;
    [["True GFR",0,C.teal],["Serum Cr",rise,C.red],["Cystatin C",0,C.teal]].forEach(function(m,i){
      var y=y0+i*28;
      T(svg,bx-10,y+5,m[0],{a:"end",fs:12.5,fw:600});
      SV("rect",{x:bx,y:y-9,width:bw*.52,height:18,rx:9,fill:"#E6E7F0"},svg);
      SV("rect",{x:bx,y:y-9,width:bw*.52*(1+m[1]),height:18,rx:9,fill:m[1]>0?m[2]:"#C9CBD8"},svg);
      T(svg,bx+bw*.52*(1+m[1])+10,y+5,m[1]>0?("+"+Math.round(m[1]*100)+"%"):"no change",{fs:12.5,fw:600,mono:m[1]>0,c:m[1]>0?m[2]:C.muted});
    });
    T(svg,bx,y0-20,"What the lab shows",{fs:12,fw:600,c:C.muted});
    var cr0=P.gfr>=95?.9:Math.round(90/P.gfr*.9*100)/100, dd=cr0*rise;
    var tk=block?("ยาบล็อก secretion ทำให้ Cr ขึ้น <span class=\"num\">"+Math.round(rise*100)+"%</span> (ราว +"+dd.toFixed(2)+" mg/dL จาก "+cr0.toFixed(2)+") ขณะที่ GFR และ cystatin C คงเดิม ยิ่ง GFR ต่ำ secretion ยิ่งมีสัดส่วนมาก Cr จึงขึ้นมากกว่า")
      :"ไม่มียาบล็อก secretion Cr จึงสะท้อน GFR ตามปกติ";
    return {ro:[["+"+Math.round(rise*100)+"%","Serum Cr เปลี่ยนจาก baseline",rise>.1?"flag":"ok"],
      ["ไม่เปลี่ยน","Cystatin C และ true GFR","ok"],
      [block?"Pseudo-AKI":"ปกติ","Phenotype",block?"flag":"ok"]],tk:tk};

drugS.addEventListener("change",function(){ HI=null; drawAtlas(); });
function drawAtlas(){
  var a=AT[+drugS.value]; if(!a) return;
  var marks={}, qs=[];
  a[2].forEach(function(r,i){ marks[r[0]]=marks[r[0]]||[]; marks[r[0]].push({q:r[1],no:i+1}); if(qs.indexOf(r[1])<0) qs.push(r[1]); });
  drawMap(document.getElementById("mapA"),marks,HI!=null?a[2][HI][0]:null);
  drawQuad(document.getElementById("quadA"),qs);
  var T=document.getElementById("synT"); T.innerHTML="";
  T.appendChild(Sim.h("tr",{},[Sim.h("th",{text:"#"}),Sim.h("th",{text:"Syndrome"}),Sim.h("th",{text:"Manifestation"}),Sim.h("th",{text:"Onset"})]));
  a[2].forEach(function(r,i){
    var tr=Sim.h("tr",{class:HI===i?"on":"",on:{click:function(){ HI=(HI===i?null:i); drawAtlas(); }}},[
      Sim.h("td",{class:"n",text:String(i+1)}),
      Sim.h("td",{},[Sim.h("span",{class:"q",style:"background:"+QCOL[r[1]]}),r[2],Sim.h("div",{style:"font-size:12px;color:var(--muted)",text:SITE[r[0]]})]),
      Sim.h("td",{text:r[3]}),Sim.h("td",{text:r[4]})]);
    T.appendChild(tr);
  });
  var sites=uniq(a[2].map(function(r){return r[0];}));
  var both=a[2].filter(function(r){return r[1]==="B";}).length;
  document.getElementById("tkA").innerHTML="<b>"+a[1]+"</b> ทำได้ <span class=\"num\">"+a[2].length+"</span> syndrome ใน <span class=\"num\">"+sites.length+"</span> ตำแหน่ง ("+sites.map(function(s){return SITE[s].split(" (")[0];}).join(", ")+")"+(both?" มี "+both+" แบบที่เป็นทั้ง dysfunction และ damage":" ไม่มีแบบที่ทำให้ GFR ลดพร้อม damage");
  roSet("ro1",a[2].length+" syndrome ใน "+sites.length+" ตำแหน่ง","ขอบเขตของพิษจากยานี้",null);
  roSet("ro2",a[2][0][4],"Onset ของ syndrome แรก",null);
  roSet("ro3",a[2].some(function(r){return r[1]==="N"&&r[0]==="sec";})?"มี":"ไม่มี","Pseudo-AKI (secretion block)",null);
}

/* ================= scenario wiring ================= */
var ORDER=[], S={};
function buildScenarios(){
  Object.keys(SC).forEach(function(k){
    var sc=SC[k];
    S[k]={name:sc.name,rows:sc.rows,take:sc.take,key:k};
    ORDER.push(k);
  });
  S.atlas={name:"Drug atlas: ยาทีละตัว",mode:"atlas",
    rows:[["วิธีใช้","เลือกกลุ่มยาและยา เพื่อดูทุก syndrome ที่ยานั้นทำได้ วางบนตำแหน่งในไต"],
      ["สี","แดง = dysfunction + damage, ทอง = dysfunction อย่างเดียว, ม่วง = damage อย่างเดียว, เทา = pseudo หรือนอกไต"],
      ["ตาราง","แตะแถวเพื่อเน้นตำแหน่งในภาพ"]],
    take:["ยาตัวเดียวทำได้หลาย phenotype ในหลายตำแหน่ง ให้คิดตาม compartment",
      "Phenotype ที่เข้ากับ latency คือหลักฐานหลักของ causality",
      "Pseudo-AKI ไม่ใช่ injury อย่าหยุดยาที่จำเป็นเพราะ Cr อย่างเดียว"]};
  ORDER.push("atlas");
}

var P=null, CURK=null, svg=document.getElementById("vis");
var chipBox=document.getElementById("dchips"), noteEl=document.getElementById("dnote"), ctlBox=document.getElementById("ctls");

function redraw(){
  var sc=SC[CURK]; if(!sc) return;
  svg.innerHTML="";
  Array.prototype.forEach.call(chipBox.children,function(b){
    var k=b.getAttribute("data-k");
    b.setAttribute("aria-pressed", sc.multi ? (P.sel[k]?"true":"false") : (P.sel===k?"true":"false"));
  });
  noteEl.textContent = sc.noteF ? sc.noteF(P) : (sc.note||"");
  noteEl.hidden = !noteEl.textContent;
  var r=sc.draw(svg,P)||{ro:[],tk:""};
  (r.ro||[]).forEach(function(x,i){ roSet("ro"+(i+1),x[0],x[1],x[2]); });
  for(var i=(r.ro||[]).length;i<3;i++){ roSet("ro"+(i+1),"-","",null); }
  document.getElementById("tk").innerHTML=r.tk||"";
}

function buildScene(k){
  var sc=SC[k]; CURK=k;
  P=JSON.parse(JSON.stringify(sc.init||{}));
  chipBox.innerHTML=""; ctlBox.innerHTML="";
  (sc.drugs||[]).forEach(function(d){
    chipBox.appendChild(Sim.h("button",{type:"button","data-k":d[0],"aria-pressed":"false",text:d[1],on:{click:function(){
      if(sc.multi){ P.sel[d[0]]=!P.sel[d[0]]; } else { P.sel=d[0]; if(sc.onPick) sc.onPick(P); }
      redraw();
    }}}));
  });
  if(sc.ctls) sc.ctls(P).forEach(function(e){ ctlBox.appendChild(e); });
  document.getElementById("h2L").textContent=sc.h2;
  document.getElementById("h2R").textContent=sc.h2R||"เลือกยาและปรับ";
  redraw();
}

function setMode(atlas){
  document.getElementById("mechView").hidden=atlas;
  document.getElementById("atlasView").hidden=!atlas;
  document.getElementById("mechCtl").hidden=atlas;
  document.getElementById("atlasCtl").hidden=!atlas;
  if(atlas){ document.getElementById("h2L").textContent="ยาตัวนี้ทำอะไรกับไตได้บ้าง และที่ตำแหน่งไหน";
    document.getElementById("h2R").textContent="เลือกยา"; }
}

buildScenarios();
fillDrugs(); drugS.value=String(AT.findIndex(function(a){return a[1]==="Cisplatin";}));
Sim.mount({
  code:"AKI-13", title:"Drug-Induced Kidney Disease: Mechanism by Phenotype",
  lead:"เลือก phenotype แล้วเลือกยา ปรับตัวแปร แล้วดูว่ากลไกในไตเปลี่ยนอย่างไร",
  scenarios:S, order:ORDER, initial:ORDER[0],
  onChange:function(k,s){ if(s.mode==="atlas"){ setMode(true); drawAtlas(); } else { setMode(false); buildScene(k); } },
  refs:REFS,
  note:"ภาพและตัวเลขเป็น model เชิงสอนที่ปรับให้ตรงกับทิศทางและลำดับความแรงในเอกสารอ้างอิง ไม่ใช่ prediction model ของผู้ป่วยรายบุคคล"
});
})();
